// Cores da vegetação em função da temperatura da estrela (SpaceEngine-like)
function vegetationColorFor(tempK) {
  // Fragmento SE: <230K, 230-280K, 280-330K, >330K
  if (tempK < 230) return { r: 80, g: 40, b: 120, name: 'Roxo' };   // vegetação escura/fria
  if (tempK < 280) return { r: 40, g: 100, b: 60, name: 'Verde-escuro' };
  if (tempK < 330) return { r: 60, g: 140, b: 50, name: 'Verde' };    // Terra-like
  if (tempK < 500) return { r: 120, g: 150, b: 40, name: 'Verde-amarelo' };
  return { r: 160, g: 160, b: 60, name: 'Amarelo' };                  // vegetação exposta a luz forte
}

// Classes planetárias para cada tipo interno (ROCHOSO/GASOSO/GELADO)
function pickPlanetClass(type, tEq, atmosphere, size) {
  if (type === 'GASOSO') {
    return (size <= 4 && tEq < 200) ? 'ICEGIANT' : 'GASGIANT';
  }
  if (type === 'GELADO') {
    if (atmosphere.name.indexOf('CH₄') !== -1 && atmosphere.dens !== 'Nula') return 'TITAN';
    return 'ICEWORLD';
  }
  // ROCHOSO
  if (atmosphere.name === 'Vácuo') {
    // Planeta anão: corpos pequenos sem atmosfera
    if (size <= 2) {
      const dwarfRoll = ((size * 17 + Math.round(tEq)) % 100) / 100;
      if (dwarfRoll < 0.55) return 'DWARF';
    }
    return 'SELENA';
  }
  // Super Terra: planetas grandes (>5) com condições Hestia-like
  if (size >= 5 && tEq >= 260 && tEq <= 320 && (atmosphere.name === 'N₂-O₂' || atmosphere.name === 'N₂')) {
    const hestiaRoll = ((size * 31 + Math.round(tEq)) % 100) / 100;
    if (hestiaRoll < 0.65) return 'SUPERTERRA';
  }
  if (tEq >= 250 && tEq <= 320 && (atmosphere.name === 'N₂-O₂' || atmosphere.name === 'N₂')) return 'TERRA';
  if (tEq > 700) return 'DESERT';   // vulcânico seco
  if (tEq < 220) return 'ICEWORLD';
  if (atmosphere.name === 'H₂O') return 'OCEANIA';
  return 'DESERT';
}

function pickWeightedMap(map, roll) { let acc=0; for (const key in map) { acc+=map[key]; if (roll<acc) return key; } return Object.keys(map)[0]; }
function lerp(a,b,t) { return a+(b-a)*t; }
function lerpColor(c1,c2,t) { return [lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)]; }
function rgbStr(c) { return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')'; }
function rgbaStr(c,a) { return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a.toFixed(3)+')'; }

  const rng = mulberry32(galaxy.seed ^ 0xA55A);
  const n = 5 + Math.floor(rng()*3);
  const blobs = [];
  for (let i = 0; i < n; i++) blobs.push({ x:(rng()-0.5), y:(rng()-0.5), s:0.12 + rng()*0.16 });

// Campo de densidade suave (teia cósmica): filamentos + aglomerados + vazios.
function smooth01(t) { return t*t*(3-2*t); }
function vnoise(x, y, seed) {
  const x0 = Math.floor(x), y0 = Math.floor(y), fx = smooth01(x-x0), fy = smooth01(y-y0);
  const h = (i, j) => hash2D(i, j, seed) / 4294967296;
  return lerp(lerp(h(x0,y0), h(x0+1,y0), fx), lerp(h(x0,y0+1), h(x0+1,y0+1), fx), fy);
}

  const S = CURRENT_SEED ^ 0x7EB5;
  const n1 = vnoise(cx/9, cy/9, S), n2 = vnoise(cx/3.5, cy/3.5, S ^ 0x1111);
  const web = Math.pow(1 - Math.abs(2*n1 - 1), 2.2);
  return 0.62*web + 0.53*n2*n2;
}

// raio e prioridade. A célula só vira galáxia se a densidade permitir e se
// nenhuma vizinha de maior prioridade estiver colada nela (anti-sobreposição).
function rawGalaxy(cx, cy) {
  const key = cx + ',' + cy;
  let r = galaxyRawCache.get(key); if (r) return r;
  const H = (s) => hash2D(cx, cy, CURRENT_SEED ^ s) / 4294967296;
  const p = clamp(0.06 + 0.95 * galaxyDensityField(cx, cy), 0, 0.92);
  const sr = H(0x51E5), rr = H(0x9AD1);

  if      (sr < 0.15) { sizeClass='anã';     radius = 2000  + rr*3000; }
  else if (sr < 0.45) { sizeClass='pequena'; radius = 5000  + rr*5000; }
  else if (sr < 0.75) { sizeClass='média';   radius = 10000 + rr*5000; }
  else if (sr < 0.94) { sizeClass='grande';  radius = 15000 + rr*5000; }
  else                { sizeClass='gigante'; radius = 20000 + rr*8000; }
  r = { exists: H(0x6A1A) < p, sizeClass, radius, prio: H(0x9710),
        ux: (cx + 0.06 + H(0x7001)*0.88) * GALAXY_CELL,
        uy: (cy + 0.06 + H(0x7002)*0.88) * GALAXY_CELL };

  return r;
}

function generateGalaxy(ucx, ucy) {
  const key = ucx + ',' + ucy;
  if (galaxyCache.has(key)) return galaxyCache.get(key);
  if (ucx < 0 || ucy < 0 || ucx >= GALAXY_GRID || ucy >= GALAXY_GRID) { galaxyCache.set(key, null); return null; }
  const me = rawGalaxy(ucx, ucy);
  let ok = me.exists;
  for (let dy = -1; dy <= 1 && ok; dy++)
    for (let dx = -1; dx <= 1 && ok; dx++) {
      if (!dx && !dy) continue;
      const o = rawGalaxy(ucx+dx, ucy+dy);
      if (o.exists && o.prio > me.prio && Math.hypot(o.ux-me.ux, o.uy-me.uy) < (o.radius+me.radius)*0.55) ok = false;
    }
  if (!ok) { galaxyCache.set(key, null); return null; }

  const seed = hash2D(ucx, ucy, CURRENT_SEED ^ 0x6A1A);
  const rng = mulberry32(seed);
  const typeRoll = rng();
  let type;
  if      (typeRoll < 0.30) type = 'espiral';
  else if (typeRoll < 0.44) type = 'espiral_barrada';
  else if (typeRoll < 0.62) type = 'eliptica';
  else if (typeRoll < 0.74) type = 'irregular';
  else if (typeRoll < 0.81) type = 'lenticular';
  else if (typeRoll < 0.86) type = 'quasar';
  else                       type = 'ana';
  const ageRoll = rng();
  const age = ageRoll < 0.30 ? 'jovem' : ageRoll < 0.75 ? 'intermediaria' : 'velha';
  const density = 0.35 + rng() * 0.65;
  const arms = 2 + Math.floor(rng()*4);
  const armWidth = 0.10 + rng()*0.20;
  const barLen = type === 'espiral_barrada' ? 0.22 + rng()*0.28 : 0;
  const tiltAngle = rng()*Math.PI*2;
  const orientation = rng()*Math.PI*2;
  const hueShift = (rng()-0.5)*40;
  const smbhMass = 1e6 * Math.pow(10, rng()*3);
  const pitch = Math.tan((11 + rng()*15) * Math.PI/180);
  const flattening = 0.45 + rng()*0.45;
  const isQuasar = (type === 'quasar') || (rng() < 0.03);
  const g = { ucx, ucy, ux: me.ux, uy: me.uy, seed, type, age, sizeClass: me.sizeClass, radius: me.radius,
              density, arms, armWidth, barLen, tiltAngle, orientation, hueShift, smbhMass,
              pitch, flattening, isQuasar,
              name: makeGalaxyName(rng) };

  return g;
}

let _givMemo = { k: '', out: [] };
function galaxiesInView(center, radius, noMemo) {
  const cxMin = Math.max(0, Math.floor((center.x - radius) / GALAXY_CELL));
  const cyMin = Math.max(0, Math.floor((center.y - radius) / GALAXY_CELL));
  const cxMax = Math.min(GALAXY_GRID - 1, Math.floor((center.x + radius) / GALAXY_CELL));
  const cyMax = Math.min(GALAXY_GRID - 1, Math.floor((center.y + radius) / GALAXY_CELL));
  const k = [CURRENT_SEED, cxMin, cxMax, cyMin, cyMax].join(',');
  if (!noMemo && _givMemo.k === k) return _givMemo.out;
  const out = [];
  for (let cy = cyMin; cy <= cyMax; cy++)
    for (let cx = cxMin; cx <= cxMax; cx++) {
      const g = generateGalaxy(cx, cy);
      if (g) out.push(g);
    }
  if (!noMemo) _givMemo = { k, out };
  return out;
}
function galaxyAtWorld(x, y) {
  let best = null, bd = Infinity;
  for (const g of galaxiesInView({ x, y }, 30000, true)) {
    const d = Math.hypot(g.ux - x, g.uy - y);
    if (d < g.radius && d < bd) { bd = d; best = g; }
  }
  return best;
}

function initGalaxy() {
  let saved = null;
  try { saved = localStorage.getItem(GALAXY_KEY); } catch (e) {}
  if (saved) {
    const [ucx, ucy] = saved.split(',').map(Number);
    if (!isNaN(ucx) && !isNaN(ucy)) {
      const g = generateGalaxy(ucx, ucy);
      if (g) { currentGalaxy = g; return; }
    }
  }
  const c0 = Math.floor(GALAXY_GRID / 2);
  for (let r = 0; r < 60; r++)
    for (let dy = -r; dy <= r; dy++)
      for (let dx = -r; dx <= r; dx++) {
        const g = generateGalaxy(c0 + dx, c0 + dy);
        if (g) { currentGalaxy = g; return; }
      }
}
function saveGalaxy() {
  if (currentGalaxy) try { localStorage.setItem(GALAXY_KEY, currentGalaxy.ucx + ',' + currentGalaxy.ucy); } catch (e) {}
}

// SISTEMAS
// ============================================================
function activeSeed() { return currentGalaxy ? currentGalaxy.seed : CURRENT_SEED; }
function galaxyDensity() { return currentGalaxy ? currentGalaxy.density : 0.5; }
function galaxyAge() { return currentGalaxy ? currentGalaxy.age : 'intermediaria'; }

// Raio de exploração local (em unidades de mundo), separado do raio visual
function explorationRadius() {
  if (!currentGalaxy) return 5000;
  // Raio de exploração gigantesco: gera dezenas de milhões de estrelas
  // por galáxia. Tudo é hasheado on-demand; nada é guardado em memória.
  return Math.min(currentGalaxy.radius * 40, 500000);
}

function makeName(rng) {
  const syl = ['VE','LL','OR','AN','IX','TH','KA','RA','ZE','UM','OR','AB','EL','UR','ON','IS'];
  const n = 2 + Math.floor(rng()*2);
  let name = '';
  for (let i = 0; i < n; i++) name += syl[Math.floor(rng()*syl.length)];
  name += '-' + (Math.floor(rng()*9000)+1000);
  return name;
}
function pickRingColor(rng) {
  const rp = ['#c9a86a','#a88860','#d8c8a0','#b89870','#e0d0b0'];
  return rp[Math.floor(rng()*rp.length)];
}

// Densidade bruta da galáxia no ponto (wx, wy), sem hash.
// É a MESMA distribuição que a arte procedural usa — assim as estrelas
// seguem exatamente os braços / bojo / nuvens / clumps que aparecem na arte.
function starDensityAt(wx, wy) {
  if (!currentGalaxy) return 1;
  const er = explorationRadius();
  const dist = Math.hypot(wx, wy);
  if (dist > er) return 0;
  const t = dist / er;
  const type = currentGalaxy.type;
  const density = galaxyDensity();
  let p = 0;

  if (type === 'eliptica') {
    const flat = currentGalaxy.flattening || 0.65;
    const ca = Math.cos(currentGalaxy.tiltAngle || 0), sa = Math.sin(currentGalaxy.tiltAngle || 0);
    const rwx =  wx*ca + wy*sa;
    const rwy = -wx*sa + wy*ca;
    const ex = rwx / er, ey = rwy / (er * flat);
    const en = Math.hypot(ex, ey);
    // Arte: r = u^1.8 concentrado + halo. Gaussian mais larga + cauda fraca.
    p = Math.exp(-en * en * 2.5) + Math.exp(-en * 0.9) * 0.12;
  } else if (type === 'espiral' || type === 'espiral_barrada') {
    const arms  = currentGalaxy.arms  || 2;
    const pitch = currentGalaxy.pitch || 0.25;
    const r0 = (type === 'espiral_barrada' && currentGalaxy.barLen)
      ? Math.max(0.12, currentGalaxy.barLen * 0.95) : 0.09;
    const ca = Math.cos(-(currentGalaxy.tiltAngle || 0)), sa = Math.sin(-(currentGalaxy.tiltAngle || 0));
    const rwx = wx*ca - wy*sa;
    const rwy = wx*sa + wy*ca;
    const rAngle = Math.atan2(rwy, rwx);
    const tSafe = Math.max(r0, t);
    const armPhase = Math.log(tSafe / r0) / pitch;
    const phase = rAngle - armPhase;
    let armMod = 0;
    for (let k = 0; k < arms; k++) {
      const d = phase - (k / arms) * Math.PI * 2;
      // cos^4: braços mais largos, casando com o espalhamento gaussiano da arte
      armMod = Math.max(armMod, Math.pow(Math.max(0, Math.cos(d * arms * 0.5)), 4));
    }
    // Bojo compacto (arte: r = u²*0.30) + disco exponencial (arte: scale 0.30)
    const bulge = Math.exp(-t * t * 22.0) * 0.98;
    const disk  = Math.exp(-t * 2.8) * 0.14;
    // Braços com cauda suave, sem corte radial abrupto
    const armsTerm = armMod * Math.exp(-t * 0.35);
    p = Math.max(bulge, armsTerm) + disk;
    if (type === 'espiral_barrada' && currentGalaxy.barLen) {
      const bl = currentGalaxy.barLen;
      const bx = rwx / (er * Math.max(0.05, bl));
      const by = rwy / (er * 0.055);
      const bn = Math.hypot(bx, by);
      p = Math.max(p, Math.exp(-bn * bn * 1.6) * 0.95);
    }
  } else if (type === 'irregular') {
    const blobs = galaxyBlobs(currentGalaxy);
    // Aplica tilt/rotação como a arte (ctx.rotate(tiltAngle))
    const ca = Math.cos(currentGalaxy.tiltAngle || 0), sa = Math.sin(currentGalaxy.tiltAngle || 0);
    const rwx =  wx*ca + wy*sa;
    const rwy = -wx*sa + wy*ca;
    const nwx = rwx / er, nwy = rwy / er;
    let d = 0;
    for (const b of blobs) {
      const dx = nwx - b.x, dy = nwy - b.y;
      // Arte: gauss() tem std 0.333, então 2σ² = (b.s*0.333)²*2 = b.s²*0.22
      d += Math.exp(-(dx*dx + dy*dy) / (b.s * b.s * 0.22));
    }
    // Corte suave que casa com a extensão visível dos blobs na arte
    if (d < 0.05) return 0;
    p = clamp((d - 0.05) * 1.7, 0.18, 0.95);
  } else if (type === 'lenticular') {
    const flat = currentGalaxy.flattening || 0.5;
    const ca = Math.cos(currentGalaxy.tiltAngle || 0), sa = Math.sin(currentGalaxy.tiltAngle || 0);
    const rwx =  wx*ca + wy*sa;
    const rwy = -wx*sa + wy*ca;
    const ex = rwx / er, ey = rwy / (er * flat);
    const en = Math.hypot(ex, ey);
    p = Math.exp(-en * en * 5.5) * 0.9 + Math.exp(-en * 2.0) * 0.15;
  } else if (type === 'ana') {
    p = Math.exp(-t * t * 2.0) + Math.exp(-t * 1.2) * 0.10;
  } else if (type === 'quasar') {
    p = Math.exp(-t * t * 2.0) + Math.exp(-t * 0.8) * 0.20;
  } else {
    p = 0.5 + 0.4 * (1 - t);
  }
  p *= density * 1.4;
  return Math.min(0.95, p);
}

function systemExists(cx, cy) {
  if (!currentGalaxy) return true;
  if (cx === 0 && cy === 0) return true;
  const wx = cx * SYSTEM_RADIUS, wy = cy * SYSTEM_RADIUS;
  const p = starDensityAt(wx, wy);
  if (p <= 0) return false;
  const h = hash2D(cx, cy, activeSeed() ^ 0xDE7517) / 0xFFFFFFFF;
  return h < p;
}

// Bias espectral em [0, 1]: 0 = população velha (K/M), 1 = jovem (B/A/F).
// Combina geometria (braço/bojo) + tipo de galáxia. Determinístico.
function spectralBias(wx, wy) {
  if (!currentGalaxy) return 0.5;
  const er = explorationRadius();
  const t = Math.hypot(wx, wy) / er;
  const type = currentGalaxy.type;

  if (type === 'eliptica') {
    // Elípticas: predominantemente velhas; núcleo um pouco menos
    return 0.08 + 0.14 * t;
  }
  if (type === 'lenticular') {
    // Disco velho com pouco gás → intermediária-velha
    return 0.18 + 0.12 * (1 - t);
  }
  if (type === 'ana') return 0.12;
  if (type === 'quasar') return 0.05 + 0.15 * (1 - t);

  if (type === 'espiral' || type === 'espiral_barrada') {
    const arms  = currentGalaxy.arms  || 2;
    const pitch = currentGalaxy.pitch || 0.25;
    const r0 = (type === 'espiral_barrada' && currentGalaxy.barLen)
      ? Math.max(0.12, currentGalaxy.barLen * 0.95) : 0.09;
    const ca = Math.cos(-(currentGalaxy.tiltAngle || 0)), sa = Math.sin(-(currentGalaxy.tiltAngle || 0));
    const rwx = wx*ca - wy*sa;
    const rwy = wx*sa + wy*ca;
    const rAngle = Math.atan2(rwy, rwx);
    const tSafe = Math.max(r0, t);
    const armPhase = Math.log(tSafe / r0) / pitch;
    const phase = rAngle - armPhase;
    let armMod = 0;
    for (let k = 0; k < arms; k++) {
      const d = phase - (k / arms) * Math.PI * 2;
      armMod = Math.max(armMod, Math.pow(Math.cos(d * arms * 0.5), 10));
    }
    // Bojo: velho e denso. Braços: jovens (formação estelar ativa). Disco: misto.
    const inBulge = Math.exp(-t * t * 18.0);
    const onArm   = Math.pow(armMod, 0.7);
    let bias = 0.35 * (1 - inBulge) + 0.75 * onArm;
    if (t > 0.7) bias *= 0.55;    // disco externo espesso — mais velho
    return clamp(bias, 0.05, 0.95);
  }
  if (type === 'irregular') {
    // Nuvens jovens misturadas com restos velhos
    const n = vnoise(wx/2000, wy/2000, activeSeed() ^ 0xC0DE);
    return 0.35 + 0.55 * n;
  }
  return 0.4;
}

function computeTeq(starTemp, starRadius, aAU, albedo) {
  const L = Math.pow(starRadius,2) * Math.pow(starTemp/5778,4);
  return 278.6 * Math.pow(L, 0.25) / Math.sqrt(Math.max(0.01, aAU)) * Math.pow(1-albedo, 0.25);

function tidalLockingDistance(starMass, aAU, planetSize) {

  // Fórmula empírica: threshold ~ 0.45 * M^(1/3) * fator_de_tamanho
  const mFactor = Math.pow(Math.max(0.05, starMass), 0.33);
  const sizeFactor = Math.max(0.5, planetSize * 0.4);
  return 0.45 * mFactor * sizeFactor;

      coreC   = { iron: 0.55 + rng()*0.35, nickel: 0.05 + rng()*0.12 };
    }
    // Placas tectônicas (Voronoi simplificado)
    const plateCount = 3 + Math.floor(rng()*7);
    const plates = [];
    for (let pi = 0; pi < plateCount; pi++) {
      plates.push({
        lat: (rng()-0.5)*Math.PI*0.85,
        lon: rng()*Math.PI*2,
        drift: (rng()-0.5)*0.8,
        oceanic: rng() < 0.45,
        age: rng()
      });
    }
    // Calor interno: tamanho × radioatividade × retenção de água
    const sizeN = Math.min(1, size / 6);
    const radiogenicFactor = (coreC.iron || 0.5) * 0.6 + 0.4 * rng();
    const heatInternal = Math.max(0, Math.min(1, sizeN * radiogenicFactor * (1 - waterFrac*0.3)));
    const crustThickness = (mantleC.silicate || 0.5) * (1 - heatInternal*0.4);
    const tectonicActivity = Math.max(0, Math.min(1,
      heatInternal * (0.5 + (crustC.silicate || 0.5) * 0.5) * (1 - crustThickness*0.5)));
    const volcanoCount = Math.floor(tectonicActivity * 8 * (1 - waterFrac*0.6));
    // Vulcanismo criogênico (Europa/Encélado): crosta de gelo + oceano subsuperficial
    const isIcyCrust = (crustC.water || 0) > 0.30 && tEq < 280;
    const tidalHeat = isIcyCrust ? (0.4 + rng()*0.6) : 0;
    const cryovolcanoCount = isIcyCrust ? Math.floor(tidalHeat * waterFrac * 18) : 0;
    const ridgeCount = Math.floor(tectonicActivity * 8) + 2;
    const mareCount = Math.floor(tectonicActivity * 5);
    // ============================================================
    // DADOS DE BIOLOGIA ()
    // ============================================================
    let lifeOrigin = null, lifeType = null, lifeHabitat = null, lifeNotes = '';
    if (habitability >= 20) {
      const bioSeed = hash2D(cx*101 + i*37, cy*53 + i*29, activeSeed() ^ 0xB10A);
      const bRng = mulberry32(bioSeed);
      lifeOrigin = bRng() < 0.62 ? 'abiogênese' : 'panspermia';
      const complexity = habitability / 100;
      if (complexity > 0.75 && bRng() < 0.55) {
        lifeType = 'multicelular';
        const habitatRoll = bRng();
        if (type === 'GASOSO') lifeHabitat = 'aérea';
        else if (pClass === 'OCEANIA' || waterFrac > 0.6) lifeHabitat = 'aquática';
        else if (pClass === 'TERRA' || pClass === 'SUPERTERRA') {
          if (habitatRoll < 0.40) lifeHabitat = 'terrestre';
          else if (habitatRoll < 0.70) lifeHabitat = 'aquática';
          else if (habitatRoll < 0.90) lifeHabitat = 'aérea';
          else lifeHabitat = 'todas';
        } else if (pClass === 'ICEWORLD' || pClass === 'TITAN') lifeHabitat = 'subglacial';
        else lifeHabitat = 'terrestre';
      } else {
        lifeType = 'unicelular';
        lifeHabitat = bRng() < 0.5 ? 'aquática' : 'terrestre';
      }
      if (lifeOrigin === 'panspermia') lifeNotes = 'chegou via meteoritos';
      else lifeNotes = 'surgiu in situ';
    }
    // ============================================================
    planets.push({ distance, size, color, speed, phase, type, letter, epithet, distanceAU, rotation,
      atmosphere, temperatureEq: Math.round(tEq), temperatureDay: Math.round(tDay), temperatureNight: Math.round(tNight),
      tidalLocked, habitability, moons, hasRings, ringColor, hasRivers,
      planetClass: pClass, seaLevel, snowLevel, tropicLat, icecapLat, heightTempGrad, vegColor,
      crust: crustC, mantle: mantleC, core: coreC, waterFrac,
      plates, tectonicActivity, volcanoCount, cryovolcanoCount, ridgeCount, mareCount,
      hostStarTemp: temperature, hostStarMass: starMass,
      lifeOrigin, lifeType, lifeHabitat, lifeNotes,
      lakeCount: (pClass === 'TERRA' || pClass === 'SUPERTERRA')
        ? Math.floor(waterFrac * 12) + ((cx*31 + i*17) % 4)
        : 0 });
  }
  if (!isRogue && rng() < 0.22 && planets.length >= 2) {
    const i = planets.length;
    const distance = 200 + rng()*200;
    const size = 1 + Math.floor(rng()*2);
    const phase = rng()*Math.PI*2;
    const speed = 0.12 + (1.0 / (distance/100));
    const letter = String(i + 1);
    const epSeed = hash2D(cx*53 + i, cy*71 + i, activeSeed() ^ 0xC0FE);
    const epithet = SUMERIAN[epSeed % SUMERIAN.length];
    const distanceAU = (distance/60).toFixed(2);
    const rotation = (epSeed / 0xFFFFFFFF) * 100;
    planets.push({ distance, size, color: PALETTE.comet, speed, phase, type: 'COMETA', letter, epithet,
      distanceAU, rotation, atmosphere: { name: 'Vácuo', hab: 0, dens: 'Nula' },
      temperatureEq: Math.round(temperature*0.15), temperatureDay: 0, temperatureNight: 0,
      tidalLocked: false, habitability: 0, moons: [], hasRings: false, ringColor: null, isComet: true, hasRivers: false,
      planetClass: 'SELENA', seaLevel:0, snowLevel:0.5, tropicLat:0.5, icecapLat:1, heightTempGrad:0,
      vegColor: { r:80,g:80,b:80,name:'—' } });
  }
  return planets;
}

function generateSystem(cx, cy) {
  if (!systemExists(cx, cy)) return { cx, cy, isEmpty: true, worldX: 0, worldY: 0, planets: [] };

  // SMBH no centro
  if (cx === 0 && cy === 0 && currentGalaxy) {
    const mrng = mulberry32(hash2D(0, 0, activeSeed() ^ 0xC0FE));
    const mass = currentGalaxy.smbhMass;
    const schwarzschild = mass * 2.953e-6 * 1e6;
    const spin = 0.3 + mrng()*0.65;
    const nStars = 12 + Math.floor(mrng()*10);
    const orbitStars = [];
    for (let i = 0; i < nStars; i++) {
      const a = mrng()*Math.PI*2;
      const r = 8 + mrng()*60;
      const sp = 0.8 + mrng()*3.5;
      const col = mrng() < 0.4 ? '#fff4d0' : mrng() < 0.7 ? '#ffd0a0' : '#d0e8ff';
      orbitStars.push({ a0:a, r, sp, size: 1+mrng()*1.5, col, ph: mrng()*Math.PI*2 });
    }
    const parts = currentGalaxy.name.split(' ');
    return { cx:0, cy:0, worldX:0, worldY:0,
      name: (currentGalaxy.isQuasar ? 'QUASAR ' : 'CORE ') + (parts.length > 1 ? parts.slice(1).join(' ') : parts[0]),
      starType:'SMBH', starColor:'#000000', starRadius:6, temperature:0, mass, radius:0, lumClass:'—', metallicity:0.5,
      isBlackHole:true, isSupermassive:true, isQuasar: !!currentGalaxy.isQuasar,
      spin, schwarzschild, orbitStars, planets: [] };
  }

  const S = activeSeed();
  const seed = hash2D(cx, cy, S);
  const rng = mulberry32(seed);
  const jitterRange = SYSTEM_RADIUS * 0.30;
  const jx = ((hash2D(cx, cy, S ^ 0xA5A5) / 0xFFFFFFFF) - 0.5) * jitterRange * 2;
  const jy = ((hash2D(cx, cy, S ^ 0x5A5A) / 0xFFFFFFFF) - 0.5) * jitterRange * 2;

  const bhRoll = hash2D(cx, cy, S ^ 0xB1AC) / 0xFFFFFFFF;
  const nsRoll = hash2D(cx, cy, S ^ 0x05AA) / 0xFFFFFFFF;
  const wdRoll = hash2D(cx, cy, S ^ 0x1DEA) / 0xFFFFFFFF;
  const bdRoll = hash2D(cx, cy, S ^ 0xB4D0) / 0xFFFFFFFF;
  const rogueRoll = hash2D(cx, cy, S ^ 0x0FFE) / 0xFFFFFFFF;
  const binaryRoll = hash2D(cx, cy, S ^ 0xB1B1) / 0xFFFFFFFF;

  const wx = cx * SYSTEM_RADIUS + jx;
  const wy = cy * SYSTEM_RADIUS + jy;

  if (bhRoll < 0.018) {
    const mrng = mulberry32(hash2D(cx, cy, S ^ 0xB0B0));
    const mass = 5 + mrng()*25, spin = 0.3 + mrng()*0.65, schwarzschild = mass*2.953;
    return { cx, cy, worldX: wx, worldY: wy, name: makeName(mrng),
      starType:'BH', starColor:'#000000', starRadius:4, temperature:0, mass, radius:0, lumClass:'—', metallicity:0,
      isBlackHole:true, spin, schwarzschild, planets: [] };
  }
  if (nsRoll < 0.015) {
    const mrng = mulberry32(hash2D(cx, cy, S ^ 0x05BB));
    const mass = 1.2 + mrng()*1.0, spinRate = 0.3 + mrng()*6.0, magnetic = 0.5 + mrng()*0.5;
    const planets = makePlanets(mrng, cx, cy, 0.05, 300, mass, false, galaxyAge());
    return { cx, cy, worldX: wx, worldY: wy, name: makeName(mrng),
      starType:'NS', starColor:PALETTE.neutron, starRadius:2, temperature:600000 + Math.round(mrng()*400000),
      mass, radius:0.00002, lumClass:'—', metallicity:0.1, isNeutronStar:true, spinRate, magnetic, planets };
  }
  if (wdRoll < 0.020) {
    const mrng = mulberry32(hash2D(cx, cy, S ^ 0x1DEE));
    const mass = 0.4 + mrng()*0.8, temperature = 6000 + Math.round(mrng()*20000);
    const planets = makePlanets(mrng, cx, cy, 0.02, temperature*0.6, mass, false, galaxyAge());
    return { cx, cy, worldX: wx, worldY: wy, name: makeName(mrng),
      starType:'WD', starColor:PALETTE.whitedwarf, starRadius:3, temperature, mass, radius:0.013, lumClass:'D', metallicity:0,
      isWhiteDwarf:true, planets };
  }
  if (bdRoll < 0.055) {
    const mrng = mulberry32(hash2D(cx, cy, S ^ 0xB4DD));
    const isT = mrng() < 0.4;
    const bdType = isT ? 'T' : 'L';
    const data = STAR_DATA[bdType];
    const mass = randInRange(mrng, data.massRange), radius = randInRange(mrng, data.radiusRange);
    const temperature = Math.round(randInRange(mrng, data.tempRange));
    const hasPlanets = mrng() < 0.65;
    const planets = hasPlanets ? makePlanets(mrng, cx, cy, radius, temperature, mass, false, galaxyAge()) : [];
    return { cx, cy, worldX: wx, worldY: wy, name: makeName(mrng),
      starType: bdType, starColor: bdType==='L' ? '#a04030' : '#602040',
      starRadius: Math.max(2, Math.round(radius*4)), temperature, mass, radius, lumClass:'V', metallicity:-0.2,
      isBrownDwarf:true, planets };
  }
  if (rogueRoll < 0.030) {
    const mrng = mulberry32(hash2D(cx, cy, S ^ 0x0FFF));
    const planets = makePlanets(mrng, cx, cy, 1, 30, 0.1, true, galaxyAge());
    return { cx, cy, worldX: wx, worldY: wy, name: makeName(mrng),
      starType:'—', starColor:'#000000', starRadius:0, temperature:3, mass:0, radius:0, lumClass:'—', metallicity:0,
      isRogue:true, planets };
  }

  // População estelar dependente de posição (braços/bojo/tipo de galáxia)
  const bias = spectralBias(wx, wy);
  const youngW = { M:0.08, K:0.13, G:0.19, F:0.22, A:0.23, B:0.15 };
  const oldW   = { M:0.62, K:0.27, G:0.09, F:0.018, A:0.0065, B:0.0015 };
  const ageW = {};
  for (const k of ['M','K','G','F','A','B']) {
    ageW[k] = oldW[k] * (1 - bias) + youngW[k] * bias;
  }
  const starType = pickWeightedMap(ageW, rng());
  const starColor = PALETTE.starColors[starType] || '#ff6600';
  const data = STAR_DATA[starType];
  // Supergigantes favorecidas em regiões jovens (braços); gigantes em velhas
  const superMul = 1 + 22 * bias * bias;         // até 23× em bias=1
  const giantMul = 1 + 4 * (1 - bias);            // até 5× em bias=0
  const weightedLum = LUM_CLASSES.map(l => {
    let p = l.prob;
    if (l.cls === 'Ib' || l.cls === 'II') p *= superMul;
    if (l.cls === 'III') p *= giantMul;
    return { cls: l.cls, prob: p, massMul: l.massMul, radiusMul: l.radiusMul, tempMul: l.tempMul };
  });
  const lumSum = weightedLum.reduce((a, l) => a + l.prob, 0);
  weightedLum.forEach(l => l.prob /= lumSum);
  const lumClass = pickWeighted(weightedLum, rng());
  const mass = randInRange(rng, data.massRange) * lumClass.massMul;
  const radius = randInRange(rng, data.radiusRange) * lumClass.radiusMul;
  const temperature = Math.round(randInRange(rng, data.tempRange) * lumClass.tempMul);
  const metallicity = ((rng()+rng()+rng())/3 - 0.5) * 1.2;
  const baseVisual = starType==='M'?3:starType==='K'?4:starType==='G'?5:starType==='F'?6:starType==='A'?7:8;
  const visualRadius = Math.round(baseVisual + Math.log2(lumClass.radiusMul) * 1.5);
  const planets = makePlanets(rng, cx, cy, radius, temperature, mass, false, galaxyAge());

  // ---- Sistema múltiplo hierárquico (SE-like) ----
  // Cada estrela pode ser binária, e cada componente pode ser binário por sua vez.
  // Níveis: 0 = single, 1 = binary, 2 = triple/quadruple, 3 = até 8 estrelas.
  const multiplicityRoll = rng();
  let hierarchyLevel = 0;
  if (multiplicityRoll < 0.05) hierarchyLevel = 3;   // 5% chance: 4-8 estrelas
  else if (multiplicityRoll < 0.18) hierarchyLevel = 2; // 13%: 3-4 estrelas
  else if (multiplicityRoll < 0.40) hierarchyLevel = 1; // 22%: binária
  // 60% permanece single

  // Tipo de companheira (pode ser anã marrom, BH, NS)
  function makeCompanionStar(isPrimary) {
    const cRoll = rng();
    let cType, isBD = false, isNS = false, isBH = false;
    if (cRoll < 0.04) { isBD = true; cType = rng() < 0.5 ? 'L' : 'T'; }
    else if (cRoll < 0.05) { isNS = true; cType = 'NS'; }
    else if (cRoll < 0.055) { isBH = true; cType = 'BH'; }
    else if (cRoll < 0.40) cType = 'M';
    else if (cRoll < 0.62) cType = 'K';
    else if (cRoll < 0.78) cType = 'G';
    else if (cRoll < 0.92) cType = 'F';
    else cType = 'A';
    if (isBD) {
      const bdData = STAR_DATA[cType] || STAR_DATA.T;
      return { starType: cType, starColor: cType==='L' ? '#a04030' : '#602040',
        starRadius: Math.max(2, Math.round(randInRange(rng, bdData.radiusRange)*4)),
        mass: randInRange(rng, bdData.massRange), temperature: Math.round(randInRange(rng, bdData.tempRange)),
        isBrownDwarf: true, isNeutronStar: false, isBlackHole: false,
        separation: 6 + rng()*15, angle: rng()*Math.PI*2, speed: 0.15 + rng()*0.5 };
    }
    if (isNS) {
      return { starType: 'NS', starColor: PALETTE.neutron,
        starRadius: 2, mass: 1.2 + rng()*1.0, temperature: 600000 + Math.round(rng()*400000),
        isBrownDwarf: false, isNeutronStar: true, isBlackHole: false,
        separation: 6 + rng()*15, angle: rng()*Math.PI*2, speed: 0.15 + rng()*0.5 };
    }
    if (isBH) {
      return { starType: 'BH', starColor: '#000000',
        starRadius: 4, mass: 5 + rng()*20, temperature: 0,
        isBrownDwarf: false, isNeutronStar: false, isBlackHole: true,
        separation: 6 + rng()*15, angle: rng()*Math.PI*2, speed: 0.15 + rng()*0.5 };
    }
    const cData = STAR_DATA[cType] || STAR_DATA.M;
    return { starType: cType, starColor: PALETTE.starColors[cType] || '#ff6600',
      starRadius: Math.max(2, Math.round(randInRange(rng, cData.radiusRange)*2)),
      mass: randInRange(rng, cData.massRange), temperature: Math.round(randInRange(rng, cData.tempRange)),
      isBrownDwarf: false, isNeutronStar: false, isBlackHole: false,
      separation: 6 + rng()*15, angle: rng()*Math.PI*2, speed: 0.15 + rng()*0.5 };
  }

  // Construir a hierarquia
  let companion = null;
  if (hierarchyLevel >= 1) companion = makeCompanionStar(false);
  if (hierarchyLevel >= 2 && companion) {
    companion.companion = makeCompanionStar(false);
    // Nível 3: companheiro do companheiro do companheiro
    if (hierarchyLevel >= 3 && companion.companion) {
      companion.companion.companion = makeCompanionStar(false);
    }
  }

  // Decidir se cada planeta orbita uma estrela específica (S-type)
  // ou o baricentro (P-type)
  for (const p of planets) {
    if (hierarchyLevel === 0) { p.orbitTarget = 'primary'; continue; }
    // P-type: planetas distantes (após o "critical distance")
    const sepAU = companion ? companion.separation : 10;
    const pTypeThreshold = sepAU * 2.5;  // distância mínima para estabilidade
    if (parseFloat(p.distanceAU) > pTypeThreshold) {
      p.orbitTarget = 'barycenter';
    } else {
      // S-type: orbita a estrela mais massiva (primária ou companheira)
      p.orbitTarget = rng() < 0.7 ? 'primary' : 'companionA';
    }
  }

  return { cx, cy, worldX: wx, worldY: wy, name: makeName(rng),
    starType, starColor, starRadius: visualRadius, temperature, mass, radius, lumClass: lumClass.cls, metallicity,
    isBlackHole:false, isNeutronStar:false, isWhiteDwarf:false, isBrownDwarf:false, isRogue:false,
    companion, hierarchyLevel, planets };
}

const systemCache = new Map();
function getSystem(cx, cy) {
  const key = cx + ',' + cy;
  if (!systemCache.has(key)) systemCache.set(key, generateSystem(cx, cy));
  return systemCache.get(key);
}
function sysKey(sys) { return sys.cx + ',' + sys.cy; }
function sysKind(sys) {
  if (sys.isSupermassive) return 'SMBH';
  if (sys.isBlackHole) return 'BH';
  if (sys.isNeutronStar) return 'NS';
  if (sys.isWhiteDwarf) return 'WD';
  if (sys.isRogue) return 'RG';
  return sys.starType;
}

// HELPERS
function getVisibleSystems() {
  const viewLeft = camera.x - BASE_W/2 - SYSTEM_RADIUS;
  const viewRight = camera.x + BASE_W/2 + SYSTEM_RADIUS;
  const viewTop = camera.y - BASE_H/2 - SYSTEM_RADIUS;
  const viewBottom = camera.y + BASE_H/2 + SYSTEM_RADIUS;
  const sX = Math.floor(viewLeft / SYSTEM_RADIUS), eX = Math.floor(viewRight / SYSTEM_RADIUS);
  const sY = Math.floor(viewTop / SYSTEM_RADIUS), eY = Math.floor(viewBottom / SYSTEM_RADIUS);
  const out = [];
  for (let cy = sY; cy <= eY; cy++)
    for (let cx = sX; cx <= eX; cx++) {
      const s = getSystem(cx, cy);
      if (!s.isEmpty) out.push(s);
    }
  return out;
}
function findNearestSystemToShip() {
  let best = null, bestDist = Infinity;
  for (const sys of getVisibleSystems()) {
    const d = Math.hypot(sys.worldX - ship.x, sys.worldY - ship.y);
    if (d < bestDist) { bestDist = d; best = sys; }
  }
  lastNearest = { sys:best, dist:bestDist };
  return lastNearest;
}
let _sysMapMemo = { key: '', out: [] };
function getSystemsForMap() {
  const r = getMapRadius();
  // Quantiza o raio em meias-oitavas para o memo não invalidar a cada frame
  const rq = Math.round(Math.log2(r) * 4);
  const key = [
    currentGalaxy ? currentGalaxy.ucx + ',' + currentGalaxy.ucy : 'none',
    Math.round(mapCenter.x / (SYSTEM_RADIUS * 2)),
    Math.round(mapCenter.y / (SYSTEM_RADIUS * 2)),

}

  const MAX = totalCells <= 30000 ? 1500 : Math.max(250, Math.round(1500 * (1 - zoomFrac * 0.85)));

  if (totalCells <= 30000) {
    for (let dy = -cellR; dy <= cellR; dy++) {
      for (let dx = -cellR; dx <= cellR; dx++) {
        const wx = (cx0 + dx) * SYSTEM_RADIUS;
        const wy = (cy0 + dy) * SYSTEM_RADIUS;
        const d = Math.hypot(wx - mapCenter.x, wy - mapCenter.y);
        if (d > radius * 1.1) continue;
        const acx = cx0 + dx, acy = cy0 + dy;
        if (!systemExists(acx, acy)) continue;
        const s = getSystem(acx, acy);
        if (!s.isEmpty) out.push(s);

    }
  } else {
    const rng = mulberry32((activeSeed() ^ 0x5AD) + Math.round(radius));
    const samples = 50000;
    const seen = new Set();
    for (let i = 0; i < samples && out.length < MAX; i++) {
      const r = Math.sqrt(rng()) * cellR;
      const theta = rng() * Math.PI * 2;
      const acx = cx0 + Math.round(Math.cos(theta) * r);
      const acy = cy0 + Math.round(Math.sin(theta) * r);
      const k = acx + ',' + acy;
      if (seen.has(k)) continue;
      seen.add(k);
      if (!systemExists(acx, acy)) continue;
      const s = getSystem(acx, acy);
      if (!s.isEmpty) out.push(s);
    }
  }

  const cWX = 0, cWY = 0;

  }

  const seen = new Set(); const unique = [];
  for (const s of out) {
    const k = s.cx + ',' + s.cy;
    if (seen.has(k)) continue;
    seen.add(k); unique.push(s);

  if (unique.length <= MAX) return unique;

}
function getPlanetScreenPositions(sys, time) {

  const out = [];

    const p = sys.planets[i];

}

}

  const dist = Math.hypot(to.x - from.x, to.y - from.y);

  const e = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;
  ship.x = warp.from.x + (warp.to.x - warp.from.x) * e;
  ship.y = warp.from.y + (warp.to.y - warp.from.y) * e;
  ship.vx = 0; ship.vy = 0;
  camera.x = ship.x; camera.y = ship.y;
  if (p >= 1) {
    ship.x = warp.to.x; ship.y = warp.to.y;

// MAPA
function getMapLayout() {

}

}
function worldToMap(wx, wy) {

  const scale = Math.min(L.w, L.h) / (2 * radius);
  return { mx: L.cx + (wx - mapCenter.x)*scale, my: L.cy + (wy - mapCenter.y)*scale, scale, radius };
}

  const L = getMapLayout();
  const radius = getMapRadius();
  const scale = Math.min(L.w, L.h) / (2 * radius);

}

  let best = null, bestDist = 18;
  for (const sys of getSystemsForMap()) {
    const { mx, my } = worldToMap(sys.worldX, sys.worldY);
    const d = Math.hypot(mx - sx, my - sy);

}

  let best = null, bestDist = Infinity;
  for (const g of galaxiesInView(galaxyCenter, (getMapRadius()) * 1.2)) {
    const { mx, my } = galaxyWorldToMap(g.ux, g.uy);
    const d = Math.hypot(mx - sx, my - sy);
    const r = g.radius * Math.min(L.w, L.h) / (2 * (getMapRadius()));
    const thresh = Math.max(8, r);

}

  if (mapFilter === 'NS') return sys.isNeutronStar;

// ---- ZOOM CONTÍNUO (galáxias <-> estrelas) ----
function mapScreenToWorld(sx, sy) {
  const L = getMapLayout(), R = getMapRadius(), sc = Math.min(L.w, L.h) / (2*R);
  const c = (mapMode === 'galaxy') ? galaxyCenter : mapCenter;
  return { x: c.x + (sx - L.cx)/sc, y: c.y + (sy - L.cy)/sc };
}
function openStarMap() {

  mapSelected = null; mapHovered = null;
}
function openGalaxyMap() {

  galaxyCenter.x = currentGalaxy ? currentGalaxy.ux : UNIVERSE_SIZE/2;
  galaxyCenter.y = currentGalaxy ? currentGalaxy.uy : UNIVERSE_SIZE/2;
  selectedGalaxy = currentGalaxy; hoveredGalaxy = null;
}
// factor > 1 aproxima, < 1 afasta. (ax,ay) = ponto da tela que fica parado (o cursor).
function applyMapZoom(factor, ax, ay) {
  const L = getMapLayout();
  if (ax == null || ax < L.x0 || ax > L.x0+L.w || ay < L.y0 || ay > L.y0+L.h) { ax = L.cx; ay = L.cy; }
  const before = mapScreenToWorld(ax, ay);

  if (mapMode === 'star') {

    if (g && factor < 1 && R >= er * SWITCH_OUT) {            // estrelas -> galáxias
      const k = g.radius / er;
      mapMode = 'galaxy';
      galaxyCenter.x = g.ux + mapCenter.x * k; galaxyCenter.y = g.uy + mapCenter.y * k;
      mapZoom = GAL_BASE / (g.radius * SWITCH_OUT);
      selectedGalaxy = g; hoveredGalaxy = null; playSoftWhoosh();
      return;
    }
    if (!g) R = Math.min(R, 160000);
    mapZoom = STAR_BASE / R;
    const sc = Math.min(L.w, L.h) / (2*R);
    mapCenter.x = before.x - (ax - L.cx)/sc; mapCenter.y = before.y - (ay - L.cy)/sc;
  } else {
    R = clamp(R, GAL_R_MIN, GAL_R_MAX);
    const tg = galaxyAtWorld(before.x, before.y);
    if (factor > 1 && tg) {
      if (tg === g && R <= g.radius * SWITCH_IN) {             // galáxia atual -> estrelas
        const sc0 = Math.min(L.w, L.h) / (2*R);
        const cx = before.x - (ax - L.cx)/sc0, cy = before.y - (ay - L.cy)/sc0, k = er / g.radius;
        mapMode = 'star'; mapSelected = null; mapHovered = null;
        mapCenter.x = (cx - g.ux) * k; mapCenter.y = (cy - g.uy) * k;
        mapZoom = STAR_BASE / (er * SWITCH_IN);
        playSoftWhoosh();
        return;
      }
      R = Math.max(R, tg.radius * 1.15);   // outra galáxia: para no enquadramento (A = saltar)
    }
    mapZoom = GAL_BASE / R;
    const sc = Math.min(L.w, L.h) / (2*R);
    galaxyCenter.x = clamp(before.x - (ax - L.cx)/sc, 0, UNIVERSE_SIZE);
    galaxyCenter.y = clamp(before.y - (ay - L.cy)/sc, 0, UNIVERSE_SIZE);
  }
}

// ---- ARTE GALÁCTICA (procedural, com níveis de detalhe) ----
const ART_SPAN = 1.25;   // meia-largura da imagem = 1.25 × raio do disco da galáxia

}
function getGalaxyArt(g, vr) {

  const key = g.ucx + ',' + g.ucy + ':' + colorMode + ':' + res;
  let c = galaxyArtCache.get(key);
  if (c) { galaxyArtCache.delete(key); galaxyArtCache.set(key, c); return c; }

  artBudget -= res / 64;

    const k0 = galaxyArtCache.keys().next().value, c0 = galaxyArtCache.get(k0);
    artPixels -= c0.width * c0.height; galaxyArtCache.delete(k0);

    if (k === 'arrowdown') { titleSel = (titleSel + 1) % 4; playUIClick(); }
    if (k === 'enter') {
      if (titleSel === 0) { screen = 'playing'; playTitleChime(); Music.setTrack('flight'); if (musicEnabled) Music.start();
        if (currentGalaxy) {
          const er = explorationRadius();
          const ang = Math.PI * 0.25;
          const d = er * 0.40;
          ship.x = Math.cos(ang)*d; ship.y = Math.sin(ang)*d;
          ship.vx = 0; ship.vy = 0;
          camera.x = ship.x; camera.y = ship.y;
        }
      } else if (titleSel === 1) { screen = 'options'; optionsSel = 0; confirmClear = false; playUIClick(); }
      else if (titleSel === 2) { screen = 'controls'; playUIClick(); }
      else { playUIClick(); beginQuit(); }
    }
    if (k === 'o') { screen = 'options'; optionsSel = 0; confirmClear = false; playUIClick(); }
    return;
  }
  if (screen === 'controls') {
    if (k === 'escape' || k === 'enter' || k === 'backspace') { screen = 'title'; playUIClick(); }
    return;
  }
  if (planetInfo.open) {
    if (e.repeat) return;
    if (k === 'escape' || k === 'backspace') { planetInfo.open = false; playUIClick(); }
    if (k === 'arrowleft') { planetInfo.tab = (planetInfo.tab + planetInfo.tabs.length - 1) % planetInfo.tabs.length; playUIClick(); }
    if (k === 'arrowright') { planetInfo.tab = (planetInfo.tab + 1) % planetInfo.tabs.length; playUIClick(); }
    return;
  }
  if (screen === 'options') {
    if (confirmClear) {
      if (k === 'enter') { clearProgress(); confirmClear = false; playNamingChime(); }
      else if (k === 'escape' || k === 'backspace') confirmClear = false;
      return;
    }
    if (k === 'arrowup') { optionsSel = (optionsSel + 8) % 9; playUIClick(); }
    if (k === 'arrowdown') { optionsSel = (optionsSel + 1) % 9; playUIClick(); }
    if (k === 'arrowleft' && optionsSel === 0) { setVolume(volumeLevel - 0.1); playUIClick(); }
    if (k === 'arrowright' && optionsSel === 0) { setVolume(volumeLevel + 0.1); playUIClick(); }
    if (k === 'arrowleft' && optionsSel === 2) { setLang(currentLang === 'en' ? 'pt' : 'en'); playUIClick(); }
    if (k === 'arrowright' && optionsSel === 2) { setLang(currentLang === 'en' ? 'pt' : 'en'); playUIClick(); }
    if (k === 'enter') {
      if (optionsSel === 0) {}
      else if (optionsSel === 1) { setMusic(!musicEnabled); playUIClick(); }
      else if (optionsSel === 2) { setLang(currentLang === 'en' ? 'pt' : 'en'); playUIClick(); }
      else if (optionsSel === 3) { const a = window.prompt('Nome do jogador:', playerName); if (a !== null) { playerName = a.trim().slice(0,24); savePlayer(); } }
      else if (optionsSel === 4) {
        const cur = CURRENT_SEED_TEXT || '0x' + CURRENT_SEED.toString(16).toUpperCase();
        const a = window.prompt('Semente:', cur);
        if (a !== null) { setSeedFromText(a); playNamingChime(); }
      }
      else if (optionsSel === 5) {
        colorMode = (colorMode === 'orange') ? 'realistic' : 'orange';
        applyColorPalette(colorMode === 'realistic' ? COLOR_PALETTE_REALISTIC : COLOR_PALETTE_ORANGE);
        galaxyArtCache.clear();
        try { localStorage.setItem(COLORMODE_KEY, colorMode); } catch (e) {}
        playUIClick();
      }
      else if (optionsSel === 6) { flightMode = (flightMode === 'tank') ? 'newtonian' : 'tank'; try { localStorage.setItem(FLIGHTMODE_KEY, flightMode); } catch (e) {} playUIClick(); }
      else if (optionsSel === 7) confirmClear = true;
      else if (optionsSel === 8) { screen = 'title'; Music.setTrack('menu'); playUIClick(); }
    }
    if (k === 'escape') { screen = 'title'; Music.setTrack('menu'); playUIClick(); return; }
    return;
  }
  if (surfaceState) { if (k === 'escape' || k === 'backspace' || k === 'enter') exitSurface(); return; }
  if (telescopeState) {
    if (k === 'escape' || k === 't' || k === 'backspace') { exitTelescope(); return; }
    if (k === 'arrowleft') { telescopeState.selectedIndex = (telescopeState.selectedIndex - 1 + telescopeState.sys.planets.length) % telescopeState.sys.planets.length; playUIClick(); return; }
    if (k === 'arrowright') { telescopeState.selectedIndex = (telescopeState.selectedIndex + 1) % telescopeState.sys.planets.length; playUIClick(); return; }
    if (k === 'enter') { enterOrbit(telescopeState.sys, telescopeState.selectedIndex); telescopeState = null; return; }
    return;
  }
  if (orbitState) {
    if (k === 'escape' || k === 'backspace') exitOrbit();
    if (k === 'enter') { if (canLandOn(orbitState.planet)) enterSurface(orbitState.sys, orbitState.planetIndex); else playUIClick(); }
    if (k === 'i') { planetInfo.open = true; planetInfo.tab = 0;
      planetInfo.sys = orbitState.sys; planetInfo.planetIndex = orbitState.planetIndex;
      planetInfo.planet = orbitState.planet; playUIClick(); }
    return;
  }
  if (logOpen) { if (k === 'l' || k === 'escape') logOpen = false; return; }
  if (mapOpen) {
    if (k === 'escape' || k === 'm' || k === 'g') { mapOpen = false; return; }
    if (k === 'enter') {
      if (mapMode === 'star' && mapSelected) { waypointKey = sysKey(mapSelected); saveWaypoint(); startWarp(mapSelected); return; }
      else if (mapMode === 'galaxy' && selectedGalaxy && selectedGalaxy !== currentGalaxy) { startGalaxyWarp(selectedGalaxy); return; }
    }
    if (k === 'f') {
      if (mapMode === 'star') { const i = MAP_FILTERS.indexOf(mapFilter); mapFilter = MAP_FILTERS[(i+1)%MAP_FILTERS.length]; }
      else { const i = GALAXY_FILTERS.indexOf(galaxyFilter); galaxyFilter = GALAXY_FILTERS[(i+1)%GALAXY_FILTERS.length]; }
      playUIClick(); return;
    }
    if (k === 'c') { if (mapMode === 'star') { waypointKey = null; saveWaypoint(); } else selectedGalaxy = null; return; }
    if (k === 'tab') { e.preventDefault(); toggleMapMode(); return; }
    return;
  }
  if (mode === 'warp' || galaxyWarp) return;
  if (focusedSystem) {
    if (k === 'escape' || k === 'backspace') exitFocus();
    if (k === 't' && focusedSystem.planets.length > 0 && !focusedSystem.isSupermassive) { enterTelescope(focusedSystem); return; }
    if (k === 'i' && focusedSystem.planets.length > 0) {
      planetInfo.open = true; planetInfo.tab = 0;
      planetInfo.sys = focusedSystem; planetInfo.planetIndex = 0;
      planetInfo.planet = focusedSystem.planets[0]; playUIClick(); return;
    }
    if (k === 'n') { e.preventDefault(); const cur = customNames[sysKey(focusedSystem)] || ''; const a = window.prompt('Batizar ' + focusedSystem.name + ':', cur || focusedSystem.name); if (a !== null) setCustomName(focusedSystem, a); }
    if (k === 'j') { e.preventDefault(); const cur = getNote(focusedSystem); const a = window.prompt('Anotação:', cur); if (a !== null) setNote(focusedSystem, a); }
    return;
  }
  if (k === 'm') { mapOpen = true; openStarMap(); playUIClick(); return; }
  if (k === 'g') { mapOpen = true; openGalaxyMap(); playUIClick(); return; }
  if (k === 'l') { logOpen = true; playUIClick(); return; }
  if (k === 'v') { flightMode = (flightMode === 'tank') ? 'newtonian' : 'tank'; try { localStorage.setItem(FLIGHTMODE_KEY, flightMode); } catch (e) {} playUIClick(); return; }
  if (k === 'enter') { e.preventDefault(); const { sys, dist } = findNearestSystemToShip(); if (sys && dist < ENTER_RADIUS) enterFocus(sys); }
  if (k === 't') { const { sys } = findNearestSystemToShip(); if (sys) { ship.x = sys.worldX; ship.y = sys.worldY; ship.vx = 0; ship.vy = 0; camera.x = ship.x; camera.y = ship.y; } }
  if (k === 'c') { waypointKey = null; saveWaypoint(); }
  if (k === 'escape') { if (engineRunning) stopEngine(); screen = 'title'; titleSel = 0; Music.setTrack('menu'); playUIClick(); }
});
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

function toggleMapMode() {
  if (mapMode === 'star') openGalaxyMap(); else openStarMap();
  playUIClick();
}

gameCanvas.addEventListener('mousemove', (e) => {
  const rect = gameCanvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) * (BASE_W / rect.width);
  const sy = (e.clientY - rect.top) * (BASE_H / rect.height);
  mapMouse.x = sx; mapMouse.y = sy;
  if (starBrowser.open) { starBrowser.mouse.x = sx; starBrowser.mouse.y = sy; starBrowser.mouseFocus = true; return; }
  if (mapOpen) {
    if (mapMode === 'star') mapHovered = findMapSystemAt(sx, sy);
    else hoveredGalaxy = findGalaxyAtMap(sx, sy);
  }
});

gameCanvas.addEventListener('wheel', (e) => {
  if (!mapOpen) return;
  e.preventDefault();
  applyMapZoom(e.deltaY > 0 ? (1/ZOOM_FACTOR) : ZOOM_FACTOR, mapMouse.x, mapMouse.y);
  if (mapMode === 'star') mapHovered = findMapSystemAt(mapMouse.x, mapMouse.y);
  else hoveredGalaxy = findGalaxyAtMap(mapMouse.x, mapMouse.y);
}, { passive: false });

gameCanvas.addEventListener('click', (e) => {
  ensureAudio();
  if (screen !== 'playing') return;
  const rect = gameCanvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) * (BASE_W / rect.width);
  const sy = (e.clientY - rect.top) * (BASE_H / rect.height);
  if (telescopeState || orbitState || surfaceState) return;
  if (starBrowser.open) { sbHandleMouseClick(sx, sy); return; }
  if (mapOpen) {
    if (mapMode === 'star') {
      const hit = findMapSystemAt(sx, sy);
      if (hit) { mapSelected = hit; waypointKey = sysKey(hit); saveWaypoint(); playUIClick(); }
    } else {
      const hit = findGalaxyAtMap(sx, sy);
      if (hit) { selectedGalaxy = hit; playUIClick(); }
    }
    return;
  }
  if (mode === 'warp' || galaxyWarp) return;
  if (focusedSystem) {
    if (focusedSystem.isBlackHole || focusedSystem.isRogue) return;
    const now = performance.now();
    const positions = getPlanetScreenPositions(focusedSystem, now);
    let best = null, bestDist = PLANET_CLICK_RADIUS;
    for (const pp of positions) {
      const d = Math.hypot(pp.px - sx, pp.py - sy);
      if (d < bestDist) { bestDist = d; best = pp; }
    }
    if (best) enterOrbit(focusedSystem, best.index);
    return;
  }
  let best = null, bestDist = Infinity;
  for (const sys of getVisibleSystems()) {
    const px = sys.worldX - camera.x + BASE_W/2;
    const py = sys.worldY - camera.y + BASE_H/2;
    const d = Math.hypot(px - sx, py - sy);
    if (d < bestDist) { bestDist = d; best = sys; }
  }
  if (best && bestDist < CLICK_RADIUS) enterFocus(best);
});

// UPDATE
// ============================================================
function update(dt) {
  GamepadManager.poll(dt);
  GamepadManager.checkScreenshot();
  if (warpFlash > 0) warpFlash = Math.max(0, warpFlash - dt*1.8);
  if (screen === 'goodbye') { goodbyeTime += dt; if (goodbyeTime > 2.4) finalizeQuit(); return; }
  if (screen === 'title' || screen === 'options') { titleTime += dt; camera.x += 12*dt; camera.y += 6*dt; if (engineRunning) stopEngine(); return; }
  if (galaxyWarp) { updateGalaxyWarp(dt); return; }
  const tb = focusedSystem ? 1 : 0;
  focusBlend += (tb - focusBlend) * Math.min(1, dt*5);
  if (Math.abs(focusBlend - tb) < 0.001) focusBlend = tb;
  if (orbitState) { orbitState.blend += (1 - orbitState.blend) * Math.min(1, dt*4); if (orbitState.blend > 0.999) orbitState.blend = 1; }
  if (telescopeState) { telescopeState.blend += (1 - telescopeState.blend) * Math.min(1, dt*4); if (telescopeState.blend > 0.999) telescopeState.blend = 1; }
  if (surfaceState) {
    surfaceState.blend += (1 - surfaceState.blend) * Math.min(1, dt*2.5);
    if (surfaceState.blend > 0.999) surfaceState.blend = 1;
    if (!surfaceState.planet.tidalLocked) surfaceState.localTime = (surfaceState.localTime + dt/surfaceState.dayLength) % 1;
    const rot = 1.4;
    if (keys['arrowleft'] || keys['a']) surfaceState.azimuth -= rot*dt;
    if (keys['arrowright'] || keys['d']) surfaceState.azimuth += rot*dt;
    surfaceState.azimuth = ((surfaceState.azimuth % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
    if (engineRunning) stopEngine();
    return;
  }
  if (mode === 'warp') { updateWarp(dt); if (engineRunning) stopEngine(); return; }
  if (orbitState || telescopeState || logOpen || mapOpen || focusedSystem || starBrowser.open) { if (engineRunning) stopEngine(); }
  if (orbitState || telescopeState || logOpen || starBrowser.open) return;
  if (mapOpen) {
    const pan = getMapRadius() / 1.5 * dt, c = (mapMode === 'galaxy') ? galaxyCenter : mapCenter;
    if (keys['arrowleft'] || keys['a']) c.x -= pan;
    if (keys['arrowright'] || keys['d']) c.x += pan;
    if (keys['arrowup'] || keys['w']) c.y -= pan;
    if (keys['arrowdown'] || keys['s']) c.y += pan;
    if (mapMode === 'galaxy') { c.x = clamp(c.x, 0, UNIVERSE_SIZE); c.y = clamp(c.y, 0, UNIVERSE_SIZE); }
    const zk = ((keys['e'] || keys['='] || keys['+']) ? 1 : 0) - ((keys['q'] || keys['-']) ? 1 : 0);
    if (zk) applyMapZoom(Math.pow(2.2, zk*dt*2), mapMouse.x, mapMouse.y);
    return;
  }
  if (focusedSystem) {
    const k = Math.min(1, dt * 3.5);
    camera.x += (focusedSystem.worldX - camera.x) * k;
    camera.y += (focusedSystem.worldY - camera.y) * k;
    return;
  }
  if (flightMode === 'tank') {
    const ACCEL = 320, MAX_SPEED = 520, DRAG = 0.94;
    let ax = 0, ay = 0;
    if (keys['w'] || keys['arrowup'] || GP.up) ay -= 1;
    if (keys['s'] || keys['arrowdown'] || GP.down) ay += 1;
    if (keys['a'] || keys['arrowleft'] || GP.left) ax -= 1;
    if (keys['d'] || keys['arrowright'] || GP.right) ax += 1;
    const tThrottle = (GP.rt || 0) - (GP.lt || 0);
    if (tThrottle !== 0) ay -= tThrottle * 1.35;
    const thrusting = (ax !== 0 || ay !== 0);
    if (thrusting && !engineRunning) startEngine();
    if (!thrusting && engineRunning) stopEngine();
    const mag = Math.hypot(ax, ay) || 1;
    ship.vx += (ax/mag) * ACCEL * dt;
    ship.vy += (ay/mag) * ACCEL * dt;
    const df = Math.pow(DRAG, dt*60);
    ship.vx *= df; ship.vy *= df;
    const sp = Math.hypot(ship.vx, ship.vy);
    if (sp > MAX_SPEED) { ship.vx = (ship.vx/sp)*MAX_SPEED; ship.vy = (ship.vy/sp)*MAX_SPEED; }
    if (engineRunning) updateEngine(sp);
    ship.x += ship.vx * dt; ship.y += ship.vy * dt;
    camera.x += (ship.x - camera.x) * Math.min(1, dt*12);
    camera.y += (ship.y - camera.y) * Math.min(1, dt*12);
    if (sp > 5) ship.facing = Math.atan2(ship.vy, ship.vx);
  } else {
    const THRUST = 130, ROT = 3.6, MAX_SPEED = 800;
    let rotInput = 0;
    if (keys['a'] || keys['arrowleft'] || GP.left) rotInput -= 1;
    if (keys['d'] || keys['arrowright'] || GP.right) rotInput += 1;
    ship.facing += rotInput * ROT * dt;
    let thrustInput = 0;
    if (keys['w'] || keys['arrowup'] || GP.up) thrustInput += 1;
    if (keys['s'] || keys['arrowdown'] || GP.down) thrustInput -= 1;
    thrustInput += ((GP.rt || 0) - (GP.lt || 0)) * 1.35;
    if (thrustInput !== 0 && !engineRunning) startEngine();
    if (thrustInput === 0 && engineRunning) stopEngine();
    if (thrustInput !== 0) {
      ship.vx += Math.cos(ship.facing) * thrustInput * THRUST * dt;
      ship.vy += Math.sin(ship.facing) * thrustInput * THRUST * dt;
    }
    const near = lastNearest.sys;
    if (near && !near.isEmpty && !near.isRogue && !near.isBlackHole) {
      const dx = near.worldX - ship.x, dy = near.worldY - ship.y;
      const r = Math.hypot(dx, dy);
      if (r > 3 && r < 500) {
        const m = Math.max(0.05, near.mass || 1);
        const GM = m * 300000;
        const a = GM / (r * r);
        ship.vx += (dx/r) * a * dt;
        ship.vy += (dy/r) * a * dt;
      }
    }
    const df = Math.pow(0.998, dt*60);
    ship.vx *= df; ship.vy *= df;
    const sp = Math.hypot(ship.vx, ship.vy);
    if (sp > MAX_SPEED) { ship.vx = (ship.vx/sp)*MAX_SPEED; ship.vy = (ship.vy/sp)*MAX_SPEED; }
    if (engineRunning) updateEngine(sp);
    ship.x += ship.vx * dt; ship.y += ship.vy * dt;
    camera.x += (ship.x - camera.x) * Math.min(1, dt*12);
    camera.y += (ship.y - camera.y) * Math.min(1, dt*12);
    shipTrail.push({ x:ship.x, y:ship.y, age:0 });
    if (shipTrail.length > 120) shipTrail.shift();
  }
  for (const p of shipTrail) p.age += dt;
  while (shipTrail.length > 0 && shipTrail[0].age > 2) shipTrail.shift();
}

// NEBULOSAS
// ============================================================
// Paletas de nebulosa por tipo (SE-inspired)
const NEBULA_PALETTES = {
  emissive: [[255,120,80],[255,180,100],[200,80,200],[120,80,220]],
  reflective: [[80,120,220],[100,160,240],[60,100,180],[140,180,255]],
  dark:       [[40,30,50],[60,40,70],[30,20,40],[50,35,55]],
  planetary:  [[80,220,180],[100,240,200],[60,180,160],[140,255,220]],
};
function fbm2D(x, y, seed, octaves) {
  let sum = 0, amp = 1, freq = 1, total = 0;
  for (let o = 0; o < octaves; o++) {
    const xi = Math.floor(x*freq), yi = Math.floor(y*freq);
    const xf = x*freq - xi, yf = y*freq - yi;
    const sx = xf*xf*(3-2*xf), sy = yf*yf*(3-2*yf);
    const a = hash2D(xi, yi, seed) / 0xFFFFFFFF;
    const b = hash2D(xi+1, yi, seed) / 0xFFFFFFFF;
    const c = hash2D(xi, yi+1, seed) / 0xFFFFFFFF;
    const d = hash2D(xi+1, yi+1, seed) / 0xFFFFFFFF;
    const v = lerp(lerp(a,b,sx), lerp(c,d,sx), sy);
    sum += amp * v; total += amp; amp *= 0.55; freq *= 2.1;
  }
  return sum / total;
}
function renderNebulas(time) {
  const S = activeSeed();
  const left = camera.x - BASE_W/2, top = camera.y - BASE_H/2;
  const sX = Math.floor(left/NEBULA_CELL) - 1, eX = Math.floor((left+BASE_W)/NEBULA_CELL) + 1;
  const sY = Math.floor(top/NEBULA_CELL) - 1, eY = Math.floor((top+BASE_H)/NEBULA_CELL) + 1;
  // Bias aumentado: nebulosas mais frequentes (SE mostra muitas)
  const nebulaBias = galaxyAge() === 'jovem' ? 0.85 : galaxyAge() === 'velha' ? 0.42 : 0.65;
  const tSec = time * 0.001;

  for (let cy = sY; cy <= eY; cy++) {
    for (let cx = sX; cx <= eX; cx++) {
      const seed = hash2D(cx, cy, S ^ 0x0B5E);
      const rng = mulberry32(seed);

      // ---- Glóbulos de Bok (2% chance por célula) ----
      if (rng() < 0.02) {
        const bx = cx*NEBULA_CELL + rng()*NEBULA_CELL;
        const by = cy*NEBULA_CELL + rng()*NEBULA_CELL;
        const br = NEBULA_CELL * (0.08 + rng()*0.15);
        const bpx = bx - left, bpy = by - top;
        if (bpx > -br*2 && bpx < BASE_W+br*2 && bpy > -br*2 && bpy < BASE_H+br*2) {
          // Halo avermelhado externo
          const hg = gctx.createRadialGradient(bpx, bpy, 0, bpx, bpy, br*2.0);
          hg.addColorStop(0, 'rgba(100,35,45,0.60)');
          hg.addColorStop(0.5, 'rgba(70,25,30,0.35)');
          hg.addColorStop(1, 'rgba(30,15,20,0)');
          gctx.fillStyle = hg;
          gctx.beginPath(); gctx.arc(bpx, bpy, br*2.0, 0, Math.PI*2); gctx.fill();
          // Núcleo escuro denso
          const core = gctx.createRadialGradient(bpx, bpy, 0, bpx, bpy, br);
          core.addColorStop(0, 'rgba(0,0,0,0.92)');
          core.addColorStop(0.6, 'rgba(5,2,8,0.75)');
          core.addColorStop(1, 'rgba(10,5,15,0)');
          gctx.fillStyle = core;
          gctx.beginPath(); gctx.arc(bpx, bpy, br, 0, Math.PI*2); gctx.fill();
          // Brilho tênue nas bordas (irradiação UV de estrelas próximas)
          const rim = gctx.createRadialGradient(bpx, bpy, br*0.85, bpx, bpy, br*1.3);
          rim.addColorStop(0, 'rgba(180,60,40,0.18)');
          rim.addColorStop(0.5, 'rgba(140,40,30,0.08)');
          rim.addColorStop(1, 'rgba(100,30,20,0)');
          gctx.fillStyle = rim;
          gctx.beginPath(); gctx.arc(bpx, bpy, br*1.3, 0, Math.PI*2); gctx.fill();
        }
      }

      // ---- Nebulosas grandes ----
      if (rng() > nebulaBias) continue;
      const nWorldX = cx*NEBULA_CELL + rng()*NEBULA_CELL;
      const nWorldY = cy*NEBULA_CELL + rng()*NEBULA_CELL;
      const nRadius = NEBULA_CELL * (0.30 + rng()*0.90);
      // Escolher tipo de nebulosa
      const typeRoll = rng();
      let nebType;
      if (typeRoll < 0.40) nebType = 'emissive';
      else if (typeRoll < 0.70) nebType = 'reflective';
      else if (typeRoll < 0.88) nebType = 'dark';
      else nebType = 'planetary';
      const palette = NEBULA_PALETTES[nebType];
      const color = palette[Math.floor(rng()*palette.length)];
      const isDark = (nebType === 'dark');
      // Intensidade 3x maior: visível sobre fundo preto
      let intensity = isDark ? 0.10 + rng()*0.10 : 0.22 + rng()*0.28;
      // Animação: opacidade e tamanho oscilam lentamente
      const animPhase = rng()*Math.PI*2;
      const animFreq = 0.0003 + rng()*0.0004;
      const animAmp = 0.25 + rng()*0.20;
      const animVal = Math.sin(tSec * animFreq + animPhase) * animAmp;
      intensity *= (1 + animVal);
      const nRadiusAnim = nRadius * (1 + animVal*0.10);
      const px = nWorldX - left, py = nWorldY - top;
      if (px < -nRadiusAnim || px > BASE_W+nRadiusAnim || py < -nRadiusAnim || py > BASE_H+nRadiusAnim) continue;
      const c = color[0]+','+color[1]+','+color[2];
      // Camada 1: glow externo suave (para dar "profundidade")
      const glowR = nRadiusAnim * 1.35;
      const gGlow = gctx.createRadialGradient(px, py, nRadiusAnim*0.4, px, py, glowR);
      gGlow.addColorStop(0, 'rgba('+c+','+Math.max(0, intensity*0.35).toFixed(3)+')');
      gGlow.addColorStop(0.6, 'rgba('+c+','+Math.max(0, intensity*0.15).toFixed(3)+')');
      gGlow.addColorStop(1, 'rgba('+c+',0)');
      gctx.fillStyle = gGlow;
      gctx.fillRect(px-glowR, py-glowR, glowR*2, glowR*2);
      // Camada 2: núcleo
      const g = gctx.createRadialGradient(px, py, 0, px, py, nRadiusAnim);
      g.addColorStop(0, 'rgba('+c+','+Math.max(0, intensity).toFixed(3)+')');
      g.addColorStop(0.4, 'rgba('+c+','+Math.max(0, intensity*0.55).toFixed(3)+')');
      g.addColorStop(1, 'rgba('+c+',0)');
      gctx.fillStyle = g;
      gctx.fillRect(px-nRadiusAnim, py-nRadiusAnim, nRadiusAnim*2, nRadiusAnim*2);
    }
  }
}

// STAR LAYERS
// ============================================================
function renderStarLayer(layer, time) {
  const camX = camera.x * layer.parallax, camY = camera.y * layer.parallax;
  const left = camX - BASE_W/2, top = camY - BASE_H/2;
  const sX = Math.floor(left/CHUNK_SIZE) - 1, eX = Math.floor((left+BASE_W)/CHUNK_SIZE) + 1;
  const sY = Math.floor(top/CHUNK_SIZE) - 1, eY = Math.floor((top+BASE_H)/CHUNK_SIZE) + 1;
  const layerSeed = activeSeed() + ((layer.parallax * 1000) | 0);
  const colors = PALETTE[layer.key];
  let streakX = 0, streakY = 0, streakLen = 0;
  if (mode === 'warp' && warp) {
    const dx = warp.to.x - warp.from.x, dy = warp.to.y - warp.from.y;
    const dlen = Math.hypot(dx, dy) || 1;
    const p = warp.t / warp.duration;
    const peak = Math.sin(p * Math.PI);
    streakX = dx/dlen; streakY = dy/dlen;
    streakLen = peak * 26 * (1 - layer.parallax*0.4);
  }
  if (galaxyWarp) {
    const p = galaxyWarp.t / galaxyWarp.duration;
    streakLen = Math.max(streakLen, Math.sin(p*Math.PI)*40);
    streakX = 1; streakY = 0;
  }
  for (let cy = sY; cy <= eY; cy++) {
    for (let cx = sX; cx <= eX; cx++) {
      const rng = mulberry32(hash2D(cx, cy, layerSeed));
      const count = Math.floor(rng() * layer.density * 2);
      for (let i = 0; i < count; i++) {
        const wx = cx*CHUNK_SIZE + rng()*CHUNK_SIZE;
        const wy = cy*CHUNK_SIZE + rng()*CHUNK_SIZE;
        const px = Math.floor(wx - left), py = Math.floor(wy - top);
        if (px < -30 || px > BASE_W+30 || py < -30 || py > BASE_H+30) continue;
        const ci = Math.floor(rng() * colors.length);
        const size = rng() < 0.15 ? layer.sizeMax : 1;
        let color = colors[ci];
        if (layer.twinkle) {
          const tw = Math.sin(time * 0.004 + px*0.7 + py*0.3);
          if (tw > 0.75) color = PALETTE.near[3];
        }
        if (streakLen > 0.5) {
          gctx.strokeStyle = color; gctx.lineWidth = 1;
          gctx.beginPath();
          gctx.moveTo(px - streakX*streakLen, py - streakY*streakLen);
          gctx.lineTo(px, py); gctx.stroke();
        } else {
          gctx.fillStyle = color;
          gctx.fillRect(px, py, size, size);
        }
      }
    }
  }
}

function getSystemGeometry(sys, dist) {
  const isFocused = (sys === focusedSystem);
  const normalZoom = Math.max(0.3, 1 - dist / SYSTEM_RADIUS);
  let starSize, orbitScale;
  if (isFocused) {
    const fs = Math.max(sys.starRadius, 5);
    starSize = sys.starRadius * normalZoom * (1 - focusBlend) + fs * focusBlend;
    let mo = 100;
    for (const p of sys.planets) if (p.distance > mo) mo = p.distance;
    const fit = (Math.min(BASE_W, BASE_H) * 0.42) / mo;
    orbitScale = normalZoom * (1 - focusBlend) + fit * focusBlend;
  } else {
    starSize = sys.starRadius * normalZoom;
    orbitScale = normalZoom;
  }
  return { sx: sys.worldX - camera.x + BASE_W/2, sy: sys.worldY - camera.y + BASE_H/2,
    isFocused, normalZoom, orbitScale, finalStarSize: Math.max(2, Math.round(starSize)) };
}

// VISUAIS DOS SISTEMAS
function drawBlackHoleVisual(sx, sy, baseSize, time) {
  const photonR = baseSize * 2.6;
  const pulse = 0.8 + 0.2 * Math.sin(time*0.003);
  const glow = gctx.createRadialGradient(sx, sy, 0, sx, sy, photonR*2.4);
  glow.addColorStop(0, 'rgba(255,80,20,0)');
  glow.addColorStop(0.3, 'rgba(255,140,60,'+(0.30*pulse).toFixed(2)+')');
  glow.addColorStop(0.6, 'rgba(255,90,30,'+(0.12*pulse).toFixed(2)+')');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  gctx.fillStyle = glow;
  gctx.beginPath(); gctx.arc(sx, sy, photonR*2.4, 0, Math.PI*2); gctx.fill();
  gctx.strokeStyle = 'rgba(255,140,60,0.55)'; gctx.lineWidth = 1;
  gctx.beginPath(); gctx.arc(sx, sy, photonR*1.4, 0, Math.PI*2); gctx.stroke();
  gctx.strokeStyle = 'rgba(255,200,120,'+(0.75*pulse).toFixed(2)+')'; gctx.lineWidth = 1.5;
  gctx.beginPath(); gctx.arc(sx, sy, photonR, 0, Math.PI*2); gctx.stroke();
  gctx.fillStyle = '#000';
  gctx.beginPath(); gctx.arc(sx, sy, baseSize, 0, Math.PI*2); gctx.fill();
}
function drawSupermassiveBlackHole(sys, sx, sy, baseSize, time, focused) {
  const isQuasar = !!sys.isQuasar;
  const coreR = baseSize * (isQuasar ? 2.1 : 1.6);
  const diskOuter = coreR * (isQuasar ? 7.5 : 5.5);
  const diskInner = coreR * 2.2;
  const intensity = isQuasar ? 1.7 : 1.0;

  const halo = gctx.createRadialGradient(sx, sy, 0, sx, sy, diskOuter*1.8);
  halo.addColorStop(0, 'rgba(255,180,80,'+(0.35*intensity).toFixed(2)+')');
  halo.addColorStop(0.35, 'rgba(255,120,40,'+(0.18*intensity).toFixed(2)+')');
  halo.addColorStop(0.7, 'rgba(255,80,20,'+(0.06*intensity).toFixed(2)+')');
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  gctx.fillStyle = halo;
  gctx.beginPath(); gctx.arc(sx, sy, diskOuter*1.8, 0, Math.PI*2); gctx.fill();

  if (isQuasar) {
    const jl = diskOuter * 1.6;
    const pulse = 0.7 + 0.3*Math.sin(time*0.004);
    for (const dir of [-1, 1]) {
      const jg = gctx.createLinearGradient(sx, sy, sx, sy + dir*jl);
      jg.addColorStop(0, 'rgba(200,230,255,'+(0.75*pulse).toFixed(2)+')');
      jg.addColorStop(0.5, 'rgba(120,180,255,'+(0.35*pulse).toFixed(2)+')');
      jg.addColorStop(1, 'rgba(80,120,255,0)');
      gctx.fillStyle = jg;
      gctx.beginPath();
      gctx.moveTo(sx-2, sy);
      gctx.lineTo(sx+2, sy);
      gctx.lineTo(sx+7, sy + dir*jl);
      gctx.lineTo(sx-7, sy + dir*jl);
      gctx.closePath(); gctx.fill();
    }
  }

  if (sys.orbitStars) {
    for (const os of sys.orbitStars) {
      const ang = os.a0 + time*0.0006*os.sp;
      const px = sx + Math.cos(ang)*os.r*(focused?1:0.5);
      const py = sy + Math.sin(ang)*os.r*(focused?0.4:0.2);
      const tailAng = ang - 0.4*Math.sign(os.sp);
      const tx = sx + Math.cos(tailAng)*os.r*(focused?1:0.5);
      const ty = sy + Math.sin(tailAng)*os.r*(focused?0.4:0.2);
      gctx.strokeStyle = os.col + '55'; gctx.lineWidth = 0.5;
      gctx.beginPath(); gctx.moveTo(tx, ty); gctx.lineTo(px, py); gctx.stroke();
      gctx.fillStyle = os.col;
      gctx.fillRect(Math.round(px), Math.round(py), Math.max(1, Math.round(os.size)), Math.max(1, Math.round(os.size)));
    }
  }

  const diskTilt = 0.28, diskPulse = 0.85 + 0.15*Math.sin(time*0.002);
  gctx.save();
  gctx.translate(sx, sy);
  const diskAlpha = isQuasar ? 0.95 : 0.75;
  gctx.strokeStyle = 'rgba(255,200,110,'+(diskAlpha*diskPulse).toFixed(2)+')';
  gctx.lineWidth = isQuasar ? 2.5 : 1.5;
  gctx.beginPath(); gctx.ellipse(0, 0, diskOuter, diskOuter*diskTilt, 0, Math.PI, Math.PI*2); gctx.stroke();
  gctx.strokeStyle = 'rgba(255,140,50,0.55)'; gctx.lineWidth = isQuasar ? 3 : 2;
  gctx.beginPath(); gctx.ellipse(0, 0, diskOuter, diskOuter*diskTilt, 0, 0, Math.PI); gctx.stroke();
  gctx.strokeStyle = 'rgba(255,220,160,0.85)'; gctx.lineWidth = 1;
  gctx.beginPath(); gctx.ellipse(0, 0, diskInner, diskInner*diskTilt, 0, 0, Math.PI*2); gctx.stroke();
  gctx.strokeStyle = 'rgba(255,240,200,0.95)'; gctx.lineWidth = 1;
  gctx.beginPath(); gctx.arc(0, 0, coreR*1.3, 0, Math.PI*2); gctx.stroke();

  if (isQuasar) {
    for (let k = 0; k < 3; k++) {
      const ha = time*0.0018 + k*Math.PI*2/3;
      const hx = Math.cos(ha)*diskInner*1.4;
      const hy = Math.sin(ha)*diskInner*1.4*diskTilt;
      const hg = gctx.createRadialGradient(hx, hy, 0, hx, hy, diskInner*0.55);
      hg.addColorStop(0, 'rgba(255,255,230,0.95)');
      hg.addColorStop(1, 'rgba(255,200,120,0)');
      gctx.fillStyle = hg;
      gctx.beginPath(); gctx.arc(hx, hy, diskInner*0.55, 0, Math.PI*2); gctx.fill();
    }
  }
  gctx.restore();
  gctx.fillStyle = '#000';
  gctx.beginPath(); gctx.arc(sx, sy, coreR, 0, Math.PI*2); gctx.fill();
}
function drawNeutronStarVisual(sys, sx, sy, baseSize, time) {
  const spinRate = sys.spinRate || 1.0;
  const ang = time*0.001*spinRate;
  const coreR = Math.max(1.5, baseSize*0.8);
  const halo = gctx.createRadialGradient(sx, sy, 0, sx, sy, coreR*8);
  halo.addColorStop(0, 'rgba(200,220,255,0.85)');
  halo.addColorStop(0.2, 'rgba(150,190,255,0.35)');
  halo.addColorStop(0.6, 'rgba(100,150,255,0.10)');
  halo.addColorStop(1, 'rgba(80,120,255,0)');
  gctx.fillStyle = halo;
  gctx.beginPath(); gctx.arc(sx, sy, coreR*8, 0, Math.PI*2); gctx.fill();
  gctx.fillStyle = '#ffffff';
  gctx.beginPath(); gctx.arc(sx, sy, coreR, 0, Math.PI*2); gctx.fill();
  for (let s = 0; s < 2; s++) {
    const a = ang + s*Math.PI, len = coreR*26;
    const spread = 0.11 + 0.03*Math.sin(time*0.005);
    gctx.save(); gctx.translate(sx, sy); gctx.rotate(a);
    const bg = gctx.createLinearGradient(0, 0, len, 0);
    bg.addColorStop(0, 'rgba(220,235,255,0.65)');
    bg.addColorStop(0.25, 'rgba(150,190,255,0.30)');
    bg.addColorStop(0.65, 'rgba(100,150,255,0.10)');
    bg.addColorStop(1, 'rgba(80,120,255,0)');
    gctx.fillStyle = bg;
    gctx.beginPath(); gctx.moveTo(0, 0); gctx.lineTo(len, -len*spread); gctx.lineTo(len, len*spread); gctx.closePath(); gctx.fill();
    gctx.restore();
  }
}
function drawWhiteDwarfVisual(sx, sy, baseSize, time) {

function drawBrownDwarfVisual(sys, sx, sy, baseSize, time) {

function drawRogueSystemVisual(sys, sx, sy, time) {

function drawComet(px, py, size, time, angle) {
  gctx.fillStyle = '#dff4ff';
  gctx.beginPath(); gctx.arc(px, py, size, 0, Math.PI*2); gctx.fill();
  gctx.save(); gctx.translate(px, py); gctx.rotate(angle);
  const len = size*8;
  const g = gctx.createLinearGradient(0, 0, len, 0);
  g.addColorStop(0, 'rgba(200,240,255,0.65)');
  g.addColorStop(0.4, 'rgba(150,200,255,0.28)');
  g.addColorStop(1, 'rgba(120,180,255,0)');
