function draw(time) {
  gctx.fillStyle = PALETTE.bg;
  gctx.fillRect(0, 0, BASE_W, BASE_H);
  if (galaxyWarp) { gctx.fillStyle = '#000205'; gctx.fillRect(0, 0, BASE_W, BASE_H); }
  else if (screen === 'playing' && surfaceState) renderSurface(time);
  else {
    renderNebulas(time);
    for (const layer of LAYERS) renderStarLayer(layer, time);
    if (screen === 'title' || screen === 'options' || screen === 'goodbye') {}
    else if (telescopeState) { for (const { sys, dist } of visibleList) drawSystemVisual(sys, dist, time); drawTelescopeView(time); }
    else if (orbitState) drawOrbitView(time);
    else { for (const { sys, dist } of visibleList) drawSystemVisual(sys, dist, time); drawWarpEffects(time); drawShip(); }
  }
  uctx.clearRect(0, 0, BASE_W, BASE_H);
  if (starBrowser.open) { drawStarBrowser(time); drawDebugPanel(); return; }
  if (screen === 'title') { drawTitleScreen(time); drawDebugPanel(); return; }
  if (screen === 'options') { drawOptionsScreen(time); drawDebugPanel(); return; }
  if (screen === 'controls') { drawControlsScreen(time); drawDebugPanel(); return; }
  if (screen === 'goodbye') { drawGoodbye(); drawDebugPanel(); return; }
  if (galaxyWarp) {
    const p = galaxyWarp.t / galaxyWarp.duration;
    const alpha = Math.sin(p*Math.PI);
    uctx.fillStyle = 'rgba(140,180,255,'+(alpha*0.4).toFixed(2)+')';
    uctx.fillRect(0, 0, BASE_W, BASE_H);
    uctx.textAlign = 'center';
    uctx.font = 'bold 10px "DejaVu Sans Mono", monospace';
    uctx.fillStyle = '#ffffff';
    uctx.fillText('SALTO INTERGALÁCTICO', BASE_W/2, BASE_H/2 - 8);
    uctx.fillText('→ ' + galaxyWarp.target.name, BASE_W/2, BASE_H/2 + 6);
    drawDebugPanel();
    return;
  }
  if (planetInfo.open) { drawPlanetInfo(time); drawDebugPanel(); return; }
  if (mapOpen) { drawUnifiedMap(time); drawDebugPanel(); return; }
  if (surfaceState) drawSurfaceHUD(time);
  else if (telescopeState) drawTelescopeHUD(time);
  else if (orbitState) drawOrbitHUD(time);
  else {
    if (!logOpen) { for (const { sys, dist } of visibleList) drawSystemLabel(sys, dist, time); drawFocusPanel(); drawWaypointCompass(); }
    if (warpFlash > 0.01) { uctx.fillStyle = 'rgba(255,180,100,'+(warpFlash*0.7).toFixed(2)+')'; uctx.fillRect(0, 0, BASE_W, BASE_H); }
    drawHUD(time);
  }
  if (logOpen) drawLog();
  drawDebugPanel();
}


// ============================================================
// STAR BROWSER
// ============================================================
const starBrowser = {
  open: false,
  searchRadius: 500,
  filters: { terra:false, desert:false, ice:false, gas:false, comet:false },
  results: [],
  sortCol: 'distance',
  sortAsc: true,
  cursorRow: 0,
  cursorCol: 0,
  focusRow: 'table',   // 'table' | 'header' | 'filters'
  filterIndex: 0,
  scroll: 0,
  status: 'Ajuste o raio e os filtros e pressione [ENTER] ou clique BUSCAR.',
  searching: false,
  mouseFocus: false,
  mouse: { x: 80, y: 80 },
};
const SB_COLUMNS = [
  { key:'name',       label:'Sistema',  x:4,   w:70 },
  { key:'class',      label:'Classe',   x:76,  w:26 },
  { key:'distance',   label:'Dist(ly)', x:104, w:36 },
  { key:'luminosity', label:'Lumin',    x:142, w:30 },
  { key:'appMag',     label:'Mag',      x:174, w:24 },
  { key:'stars',      label:'Est',      x:200, w:16 },
  { key:'planets',    label:'Pl',       x:218, w:16 },
  { key:'score',      label:'Filtro',   x:236, w:60 },
];
const SB_TABLE_Y = 34;
const SB_TABLE_H = BASE_H - SB_TABLE_Y - 22;

function sbHasAnyFilter() {
  const f = starBrowser.filters;
  return f.terra || f.desert || f.ice || f.gas || f.comet;
}

function sbEvaluateSystem(sys) {
  const f = starBrowser.filters;
  let available = 0;
  const seen = new Set();
  if (sys.starType && !sys.isRogue) available++;
  if (sys.companion) available++;
  const matchedKeys = new Set();
  for (const p of sys.planets) {
    const kind = getPlanetVisualKind(p);
    const sub  = getRockySubtype(p);
    const kK = 'k:' + kind, kS = sub ? ('s:' + sub) : null;
    if (!seen.has(kK)) { seen.add(kK); available++; }
    if (kS && !seen.has(kS)) { seen.add(kS); available++; }
    if (f.terra  && kind === 'TERRA')                       matchedKeys.add('T:' + p.letter);
    if (f.desert && (sub === 'DESÉRTICO' || sub === 'ÁRIDO')) matchedKeys.add('D:' + p.letter);
    if (f.ice    && (kind === 'GELADO' || sub === 'GLACIAL')) matchedKeys.add('I:' + p.letter);
    if (f.gas    && kind === 'GASOSO')                       matchedKeys.add('G:' + p.letter);
    if (f.comet  && kind === 'COMETA')                       matchedKeys.add('C:' + p.letter);
  }
  return { matched: matchedKeys.size, available };
}

function sbLuminosity(sys) {
  if (sys.isRogue) return 0;
  if (sys.isSupermassive) return 1e10;
  if (sys.isBlackHole) return 0.001;
  if (sys.isNeutronStar) return 0.01;
  if (sys.isWhiteDwarf) return 0.001;
  const t = (sys.temperature || 3000) / 5778, r = sys.radius || 0.5;
  return Math.max(1e-4, r * r * Math.pow(t, 4));
}

function sbAppMag(sys, distLy) {
  const L = sbLuminosity(sys);
  if (L <= 0) return 99;
  const M = 4.83 - 2.5 * Math.log10(Math.max(1e-12, L));
  const dPc = Math.max(0.01, distLy / 3.26);
  return M + 5 * Math.log10(dPc) - 5;
}

function sbSortResults() {
  const sb = starBrowser;
  const col = sb.sortCol, dir = sb.sortAsc ? 1 : -1;
  sb.results.sort((a, b) => {
    let va = a[col], vb = b[col];
    if (col === 'score') { va = a.matched / Math.max(1, a.available); vb = b.matched / Math.max(1, b.available); }
    if (typeof va === 'string') return dir * String(va).localeCompare(String(vb));
    return dir * ((va || 0) - (vb || 0));
  });
}

function sbCycleSort(colKey) {
  const sb = starBrowser;
  if (sb.sortCol === colKey) sb.sortAsc = !sb.sortAsc;
  else { sb.sortCol = colKey; sb.sortAsc = true; }
  sbSortResults();
  sb.scroll = 0; sb.cursorRow = 0;
}

function sbPerformSearch() {
  const sb = starBrowser;
  sb.searching = true;
  sb.results = [];
  const radiusU = Math.max(SYSTEM_RADIUS, sb.searchRadius * LY_IN_UNITS);
  const cx0 = Math.round(ship.x / SYSTEM_RADIUS);
  const cy0 = Math.round(ship.y / SYSTEM_RADIUS);
  const cellR = Math.max(1, Math.ceil(radiusU / SYSTEM_RADIUS));
  const radiusCellsSq = (radiusU / SYSTEM_RADIUS) * (radiusU / SYSTEM_RADIUS);
  const totalCells = Math.PI * cellR * cellR;
  const useFull = totalCells <= SB_MAX_CELLS;
  const maxTries = useFull ? (2*cellR+1) * (2*cellR+1) : SB_MAX_CELLS;
  const rng = mulberry32(((activeSeed() ^ 0x5EA2) + sb.searchRadius) >>> 0);
  const anyFilter = sbHasAnyFilter();

  const t0 = performance.now();
  let checked = 0;
  for (let i = 0; i < maxTries; i++) {
    if (sb.results.length >= SB_MAX_RESULTS) break;
    let dx, dy;
    if (useFull) {
      dx = (i % (2*cellR+1)) - cellR;
      dy = Math.floor(i / (2*cellR+1)) - cellR;
      if (dx*dx + dy*dy > radiusCellsSq) continue;
    } else {
      const r = Math.sqrt(rng()) * cellR;
      const theta = rng() * Math.PI * 2;
      dx = Math.round(Math.cos(theta) * r);
      dy = Math.round(Math.sin(theta) * r);
    }
    const acx = cx0 + dx, acy = cy0 + dy;
    checked++;
    if (!systemExists(acx, acy)) continue;
    const sys = getSystem(acx, acy);
    if (sys.isEmpty) continue;
    const ev = sbEvaluateSystem(sys);
    if (anyFilter && ev.matched === 0) continue;
    const dU = Math.hypot(sys.worldX - ship.x, sys.worldY - ship.y);
    const dLy = dU / LY_IN_UNITS;
    sb.results.push({
      sys,
      name: getDisplayName(sys),
      class: sys.isRogue ? 'RG' : ((sys.starType || '?') + (sys.lumClass || '')) + (sys.companion ? '+B' : ''),
      distance: dLy,
      luminosity: sbLuminosity(sys),
      appMag: sbAppMag(sys, dLy),
      stars: sys.companion ? 2 : 1,
      planets: sys.planets.length,
      matched: ev.matched,
      available: ev.available,
    });
  }
  const dt = performance.now() - t0;
  sb.searching = false;
  sbSortResults();
  sb.scroll = 0; sb.cursorRow = 0; sb.cursorCol = 0; sb.focusRow = 'table'; sb.filterIndex = 0;
  sb.status = sb.results.length + ' resultado(s) em ' + dt.toFixed(0) + ' ms  (' + checked + ' sistemas verificados)';
  if (sb.results.length === 0) sb.status = 'Nenhum sistema correspondeu aos filtros.';
}

function sbHandleInput(k, e) {
  const sb = starBrowser;
  if (!sb.open) return false;
  if (k === 'escape' || k === 'b') { sb.open = false; playUIClick(); return true; }
  if (k === 'q') { sb.searchRadius = Math.max(50, sb.searchRadius - 50); playUIClick(); return true; }
  if (k === 'e') { sb.searchRadius = Math.min(20000, sb.searchRadius + 50); playUIClick(); return true; }
  if (k === '1') { sb.filters.terra  = !sb.filters.terra;  playUIClick(); return true; }
  if (k === '2') { sb.filters.desert = !sb.filters.desert; playUIClick(); return true; }
  if (k === '3') { sb.filters.ice    = !sb.filters.ice;    playUIClick(); return true; }
  if (k === '4') { sb.filters.gas    = !sb.filters.gas;    playUIClick(); return true; }
  if (k === '5') { sb.filters.comet  = !sb.filters.comet;  playUIClick(); return true; }
  if (k === 'enter') {
    if (sb.focusRow === 'enter') { sbPerformSearch(); return true; }
    if (sb.focusRow === 'filters') {
      sb.filters[SB_FILTER_KEYS[sb.filterIndex]] = !sb.filters[SB_FILTER_KEYS[sb.filterIndex]];
      playUIClick(); return true;
    }
    if (sb.focusRow === 'header') { sbCycleSort(SB_COLUMNS[sb.cursorCol].key); return true; }
    if (sb.results.length === 0) { sbPerformSearch(); return true; }
    const r = sb.results[sb.cursorRow + sb.scroll];
    if (r) { startWarp(r.sys); sb.open = false; }
    return true;
  }
  if (k === 'arrowup') {
    if (sb.focusRow === 'table') {
      if (sb.cursorRow > 0) sb.cursorRow--;
      else if (sb.scroll > 0) sb.scroll--;
      else sb.focusRow = 'header';
    } else if (sb.focusRow === 'header') sb.focusRow = 'filters';
    else if (sb.focusRow === 'filters') sb.focusRow = 'enter';
    playUIClick(); return true;
  }
  if (k === 'arrowdown') {
    if (sb.focusRow === 'enter') sb.focusRow = 'filters';
    else if (sb.focusRow === 'filters') sb.focusRow = 'header';
    else if (sb.focusRow === 'header') sb.focusRow = 'table';
    else {
      const total = sb.results.length;
      if (sb.cursorRow < SB_VISIBLE_ROWS - 1 && sb.cursorRow + sb.scroll + 1 < total) sb.cursorRow++;
      else if (sb.scroll + SB_VISIBLE_ROWS < total) sb.scroll++;
    }
    playUIClick(); return true;
  }
  if (k === 'arrowleft') {
    if (sb.focusRow === 'enter') { sb.focusRow = 'filters'; sb.filterIndex = SB_FILTER_KEYS.length - 1; }
    else if (sb.focusRow === 'filters') { if (sb.filterIndex > 0) sb.filterIndex--; }
    else sb.cursorCol = (sb.cursorCol + SB_COLUMNS.length - 1) % SB_COLUMNS.length;
    playUIClick(); return true;
  }
  if (k === 'arrowright') {
    if (sb.focusRow === 'filters') {
      if (sb.filterIndex < SB_FILTER_KEYS.length - 1) sb.filterIndex++;
      else sb.focusRow = 'enter';
    }
    else if (sb.focusRow !== 'enter') sb.cursorCol = (sb.cursorCol + 1) % SB_COLUMNS.length;
    playUIClick(); return true;
  }
  if (k === ' ') {
    if (sb.focusRow === 'header') sbCycleSort(SB_COLUMNS[sb.cursorCol].key);
    else if (sb.focusRow === 'filters') sb.filters[SB_FILTER_KEYS[sb.filterIndex]] = !sb.filters[SB_FILTER_KEYS[sb.filterIndex]];
    else if (sb.focusRow === 'enter') sbPerformSearch();
    playUIClick(); return true;
  }
  if (k === 'delete' || k === 'backspace') {
    sb.results = []; sb.status = 'Resultados limpos.'; sb.scroll = 0; sb.cursorRow = 0; playUIClick(); return true;
  }
  return true;
}

  uctx.fillStyle = 'rgba(20,40,70,0.85)';
  uctx.fillRect(0, SB_TABLE_Y, BASE_W, 9);
  uctx.font = 'bold 6px "DejaVu Sans Mono", monospace';
  uctx.textAlign = 'left';
  for (let c = 0; c < SB_COLUMNS.length; c++) {
    const col = SB_COLUMNS[c];
    const isSort = sb.sortCol === col.key;
    const isCursor = sb.cursorCol === c;
    const headerFocusedHere = (sb.focusRow === 'header');
    let colColor;
    if (isSort) colColor = '#ffe0a0';
    else if (isCursor && headerFocusedHere) colColor = '#ffff88';
    else if (isCursor) colColor = '#ffffff';
    else colColor = '#88b8e8';
    uctx.fillStyle = colColor;
    uctx.fillText(col.label + (isSort ? (sb.sortAsc ? ' \u25b2' : ' \u25bc') : ''), col.x, SB_TABLE_Y+7);
    if (isCursor && headerFocusedHere) {
      uctx.strokeStyle = 'rgba(255,255,136,0.85)'; uctx.lineWidth = 0.5;
      uctx.beginPath(); uctx.moveTo(col.x-1, SB_TABLE_Y+8.5); uctx.lineTo(col.x + col.w - 2, SB_TABLE_Y+8.5); uctx.stroke();
    }
  }

  uctx.save();
  uctx.beginPath();
  uctx.rect(0, SB_TABLE_Y+10, BASE_W, SB_TABLE_H-10);
  uctx.clip();
  const rows = sb.results;
  const total = rows.length;
  const maxScroll = Math.max(0, total - SB_VISIBLE_ROWS);
  if (sb.scroll > maxScroll) sb.scroll = maxScroll;
  if (sb.scroll < 0) sb.scroll = 0;
  for (let i = 0; i < SB_VISIBLE_ROWS; i++) {
    const idx = i + sb.scroll;
    if (idx >= total) break;
    const r = rows[idx];
    const y = SB_TABLE_Y + 11 + i * SB_ROW_H;
    const isCursor = (i === sb.cursorRow) && (sb.focusRow === 'table');
    if (isCursor) {
      uctx.fillStyle = 'rgba(255,180,100,0.20)';
      uctx.fillRect(0, y-1, BASE_W, SB_ROW_H);
    }
    uctx.font = '6px "DejaVu Sans Mono", monospace';
    uctx.fillStyle = isCursor ? '#ffffff' : '#c8d8ff';
    uctx.fillText(String(r.name).slice(0, 14), 4, y + 5);
    uctx.fillStyle = isCursor ? '#ffffff' : '#88b8e8';
    uctx.fillText(String(r.class), 76, y + 5);
    uctx.fillStyle = isCursor ? '#ffffff' : '#a8c8d8';
    uctx.fillText(r.distance.toFixed(1), 104, y + 5);
    uctx.fillText(r.luminosity.toFixed(3), 142, y + 5);
    uctx.fillText(r.appMag.toFixed(2), 174, y + 5);
    uctx.fillText(String(r.stars), 200, y + 5);
    uctx.fillText(String(r.planets), 218, y + 5);
    uctx.fillStyle = r.matched > 0 ? '#a8ffb0' : '#a0a8b8';
    uctx.fillText(r.matched + '/' + Math.max(1, r.available), 236, y + 5);
  }
  uctx.restore();

  uctx.fillStyle = 'rgba(0,0,0,0.90)';
  uctx.fillRect(0, BASE_H - 20, BASE_W, 20);
  uctx.strokeStyle = 'rgba(120,180,255,0.5)'; uctx.lineWidth = 0.5;
  uctx.beginPath(); uctx.moveTo(0, BASE_H-20); uctx.lineTo(BASE_W, BASE_H-20); uctx.stroke();
  uctx.font = '5px "DejaVu Sans Mono", monospace';
  uctx.textAlign = 'left';
  uctx.fillStyle = '#88a8d8';
  const statusFull = t(sb.status);
  const statusShort = statusFull.length > 62 ? statusFull.slice(0, 60) + '..' : statusFull;
  uctx.fillText(statusShort, 4, BASE_H - 13);
  uctx.fillStyle = '#a8c8ff';
  uctx.fillText('[1..5] filt · [Q/E] raio · [D-pad] navega · [A] ok · [B] fecha', 4, BASE_H - 5);

  if (sb.mouseFocus) {
    uctx.strokeStyle = 'rgba(255,200,120,0.9)'; uctx.lineWidth = 0.7;
    const mx = sb.mouse.x, my = sb.mouse.y;
    uctx.beginPath(); uctx.moveTo(mx-6, my); uctx.lineTo(mx-2, my); uctx.stroke();
    uctx.beginPath(); uctx.moveTo(mx+2, my); uctx.lineTo(mx+6, my); uctx.stroke();
    uctx.beginPath(); uctx.moveTo(mx, my-6); uctx.lineTo(mx, my-2); uctx.stroke();
    uctx.beginPath(); uctx.moveTo(mx, my+2); uctx.lineTo(mx, my+6); uctx.stroke();
    uctx.fillStyle = 'rgba(255,200,120,0.9)';
    uctx.beginPath(); uctx.arc(mx, my, 0.9, 0, Math.PI*2); uctx.fill();
  }
}

function sbHandleMouseClick(sx, sy) {
  const sb = starBrowser;
  if (!sb.open) return false;
  sb.focusRow = 'table';
  if (sy >= SB_TABLE_Y && sy <= SB_TABLE_Y + 9) {
    for (const col of SB_COLUMNS) {
      if (sx >= col.x - 2 && sx < col.x + col.w) {
        sbCycleSort(col.key);
        playUIClick();
        return true;
      }
    }
    return true;
  }
  if (sy >= 6 && sy <= 24 && sx >= BASE_W - 58) {
    sbPerformSearch(); playUIClick(); return true;
  }
  let fx = 130;
  for (const key of SB_FILTER_KEYS) {
    if (sy >= 11 && sy <= 21 && sx >= fx && sx < fx + 24) {
      sb.filters[key] = !sb.filters[key]; playUIClick(); return true;
    }
    fx += 27;
  }
  if (sy >= SB_TABLE_Y + 10 && sy < SB_TABLE_Y + 10 + SB_VISIBLE_ROWS * SB_ROW_H) {
    const rowIdx = Math.floor((sy - (SB_TABLE_Y + 10)) / SB_ROW_H) + sb.scroll;
    if (rowIdx < sb.results.length) {
      sb.cursorRow = Math.floor((sy - (SB_TABLE_Y + 10)) / SB_ROW_H);
      const r = sb.results[rowIdx];
      if (r) { startWarp(r.sys); sb.open = false; }
    }
    return true;
  }
  return true;
}

// Debug F6: estatísticas de sistemas múltiplos na vizinhança
function debugSystemStats() {
  console.log('%c=== DEBUG F6: ESTATÍSTICAS DE SISTEMAS ===', 'color:#ffe080;font-weight:bold');
  const N = 5000;
  const cellR = Math.ceil(Math.sqrt(N) / 2);
  const cx0 = Math.round(ship.x / SYSTEM_RADIUS);
  const cy0 = Math.round(ship.y / SYSTEM_RADIUS);
  const rng = mulberry32(((activeSeed() ^ 0xDB65) + N) >>> 0);
  const stats = {
    total: 0, empty: 0,
    single: 0, binary: 0, triple: 0, quad: 0, multi5plus: 0,
    companionTypes: { M:0, K:0, G:0, F:0, A:0, BD:0, NS:0, BH:0, other:0 },
    hierarchyLevels: [0,0,0,0],
    pType: 0, sType: 0,
    examples: { BD:null, NS:null, BH:null, quadPlus:null },
  };
  for (let i = 0; i < N; i++) {
    const dx = Math.round((rng() - 0.5) * cellR * 2);
    const dy = Math.round((rng() - 0.5) * cellR * 2);
    const cx = cx0 + dx, cy = cy0 + dy;
    if (!systemExists(cx, cy)) { stats.empty++; continue; }
    const sys = getSystem(cx, cy);
    if (sys.isEmpty) { stats.empty++; continue; }
    stats.total++;
    const lvl = sys.hierarchyLevel || 0;
    stats.hierarchyLevels[lvl]++;
    if (lvl === 0) stats.single++;
    else if (lvl === 1) stats.binary++;
    else if (lvl === 2) stats.triple++;
    else if (lvl === 3) {
      // Verificar quantos companheiros tem
      let count = 1;
      if (sys.companion) count++;
      if (sys.companion && sys.companion.companion) count++;
      if (sys.companion && sys.companion.companion && sys.companion.companion.companion) count++;
      if (count >= 5) stats.multi5plus++;
      else stats.quad++;
    }
    // Contar tipo de companheiro
    if (sys.companion) {
      const c = sys.companion;
      let key = c.starType;
      if (c.isBrownDwarf) key = 'BD';
      else if (c.isNeutronStar) key = 'NS';
      else if (c.isBlackHole) key = 'BH';
      if (key in stats.companionTypes) stats.companionTypes[key]++;
      else stats.companionTypes.other++;
      // Salvar exemplos
      if (c.isBrownDwarf && !stats.examples.BD) stats.examples.BD = sys.name + ' (' + sys.starType + lvl + ' + BD)';
      if (c.isNeutronStar && !stats.examples.NS) stats.examples.NS = sys.name + ' (' + sys.starType + lvl + ' + NS)';
      if (c.isBlackHole && !stats.examples.BH) stats.examples.BH = sys.name + ' (' + sys.starType + lvl + ' + BH)';
      if (lvl >= 3 && !stats.examples.quadPlus) stats.examples.quadPlus = sys.name;
    }
    // Contar orbitTarget dos planetas
    for (const p of sys.planets || []) {
      if (p.orbitTarget === 'barycenter') stats.pType++;
      else if (p.orbitTarget === 'primary' || p.orbitTarget === 'companionA') stats.sType++;
    }
  }
  const pct = (v) => (100 * v / Math.max(1, stats.total)).toFixed(2) + '%';
  console.log('%cSistemas:', 'color:#a8c8ff', stats.total + ' (vazios: ' + stats.empty + ')');
  console.log('%cMultiplicidade:', 'color:#a8c8ff');
  console.log('  Single  (1 estrela): ' + stats.hierarchyLevels[0] + '  (' + pct(stats.hierarchyLevels[0]) + ')');
  console.log('  Binária (2 estrelas): ' + stats.hierarchyLevels[1] + '  (' + pct(stats.hierarchyLevels[1]) + ')');
  console.log('  Trio/Quad (3-4):      ' + stats.hierarchyLevels[2] + '  (' + pct(stats.hierarchyLevels[2]) + ')');
  console.log('  Multi 5+ (até 8):     ' + stats.hierarchyLevels[3] + '  (' + pct(stats.hierarchyLevels[3]) + ')');
  console.log('%cTipos de companheiro:', 'color:#a8c8ff');
  const ct = stats.companionTypes;
  console.log('  M:' + ct.M + '  K:' + ct.K + '  G:' + ct.G + '  F:' + ct.F + '  A:' + ct.A);
  console.log('  %cAnãs Marrons: ' + ct.BD + '  |  Estrelas de Nêutrons: ' + ct.NS + '  |  Buracos Negros: ' + ct.BH,
    'color:#ff9060;font-weight:bold');
  console.log('%cExemplos raros encontrados:', 'color:#60ff90;font-weight:bold');
  console.log('  BD: ' + (stats.examples.BD || '— nenhum na amostra'));
  console.log('  NS: ' + (stats.examples.NS || '— nenhum na amostra'));
  console.log('  BH: ' + (stats.examples.BH || '— nenhum na amostra'));
  console.log('  Quad+: ' + (stats.examples.quadPlus || '— nenhum na amostra'));
  console.log('%cÓrbitas dos planetas:', 'color:#a8c8ff');
  console.log('  P-type (baricentro): ' + stats.pType + '  |  S-type (estrela): ' + stats.sType);
  console.log('%c=== FIM ===', 'color:#ffe080;font-weight:bold');
  // Também mostra no HUD
  debug._f6Report = 'F6: ' + stats.total + ' sist · ' +
    'BD:' + ct.BD + ' NS:' + ct.NS + ' BH:' + ct.BH +
    ' · bin:' + stats.hierarchyLevels[1] + ' trio:' + stats.hierarchyLevels[2] + ' 5+:' + stats.hierarchyLevels[3];
  debug._f6Until = performance.now() + 15000;
}

// LOOP
let lastTime = 0;
function loop(timestamp) {
  const dt = Math.min(0.05, (timestamp - lastTime)/1000) || 0;
  lastTime = timestamp; frameId++; artBudget = 8;
  update(dt);
  if (screen === 'playing') {
    visibleList.length = 0;
    if (!surfaceState && !mapOpen && !galaxyWarp) {
      for (const sys of getVisibleSystems()) {
        const d = Math.hypot(sys.worldX - camera.x, sys.worldY - camera.y);
        if (d < SYSTEM_RADIUS*1.5 || sys === focusedSystem) visibleList.push({ sys, dist: d });
      }
      visibleList.sort((a, b) => b.dist - a.dist);
      findNearestSystemToShip();
    }
  } else visibleList.length = 0;
  draw(timestamp);
  debug.frames++; debug.fpsTimer += dt;
  if (debug.fpsTimer >= 1) { debug.fps = debug.frames / debug.fpsTimer; debug.frames = 0; debug.fpsTimer = 0; }
  requestAnimationFrame(loop);
}

// INICIALIZAÇÃO
// ============================================================
// GAMEPAD — GameSir T4 Nova Lite (padrão XInput via dongle)
// Edge detection com try/finally (prev sempre salvo, mesmo com return).
// Cooldown de 120 ms por botão. D-pad analógico vira movimento contínuo
// no mapa. A no mapa = warp direto para o alvo sob o cursor.
// ============================================================
const planetInfo = {
  open: false,
  tab: 0,
  tabs: ['Atmosfera', 'Geologia', 'Orbital', 'Hidrografia', 'Biologia'],
  sys: null, planet: null, planetIndex: 0,
};

const GamepadManager = {
  pad: null,
  prev: {},
  lastFire: {},
  cooldownMs: 120,
  deadzone: 0.22,
  verbose: false,
  screenshotRequested: false,
  // Zoom no mapa: precisa voltar gatilho abaixo de 5% após abrir o mapa
  mapZoomArmed: false,

  init() {
    window.addEventListener('gamepadconnected', (e) => {
      console.log('[Gamepad] Conectado:', e.gamepad.id);
      this.pad = e.gamepad;
    });
    window.addEventListener('gamepaddisconnected', () => {
      console.log('[Gamepad] Desconectado');
      this.pad = null;
    });
  },

  edge(idx, b) {
    const now = !!(b[idx] && b[idx].pressed);
    const was = !!this.prev[idx];
    if (!now || was) return false;
    const t = performance.now();
    if (this.lastFire[idx] && (t - this.lastFire[idx]) < this.cooldownMs) return false;
    this.lastFire[idx] = t;
    if (this.verbose) console.log('[Gamepad] edge botão ' + idx);
    return true;
  },

  held(idx, b) { return !!(b[idx] && b[idx].pressed); },

  // zona morta radial + curva (s^1.7): precisão no começo do curso, velocidade total no fim
  stick(ax, ay) {
    const m = Math.hypot(ax || 0, ay || 0), dz = this.deadzone;
    if (m < dz) return { x: 0, y: 0 };
    const f = Math.pow(Math.min(1, (m - dz) / (1 - dz)), 1.7);
    return { x: ax / m * f, y: ay / m * f };
  },

  poll(dt) {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let p = null;
    for (let i = 0; i < pads.length; i++) if (pads[i] && pads[i].connected) { p = pads[i]; break; }
    if (!p) {
      GP.up = GP.down = GP.left = GP.right = false; GP.rt = GP.lt = 0;
      return;
    }
    this.pad = p;
    const b = p.buttons, a = p.axes;
    const rlx = Math.abs(a[0]) > this.deadzone ? a[0] : 0;
    const rly = Math.abs(a[1]) > this.deadzone ? a[1] : 0;

    GP.rt = b[7] ? b[7].value : 0;
    GP.lt = b[6] ? b[6].value : 0;

    const flying = screen === 'playing' && !mapOpen && !focusedSystem &&
                   !orbitState && !telescopeState && !surfaceState && !logOpen;
    GP.up    = flying && rly < -0.15;
    GP.down  = flying && rly >  0.15;
    GP.left  = flying && rlx < -0.15;
    GP.right = flying && rlx >  0.15;

    // Botões: edges (disparo único por aperto)
    const A  = this.edge(0,  b);
    const B  = this.edge(1,  b);
    const X  = this.edge(2,  b);
    const Y  = this.edge(3,  b);
    const LB = this.edge(4,  b);
    const RB = this.edge(5,  b);
    const SEL= this.edge(8,  b);
    const ST = this.edge(9,  b);
    const L3 = this.edge(10, b);
    const R3 = this.edge(11, b);
    // D-pad: edges para menus, held para movimento contínuo
    const DUe = this.edge(12, b), DDe = this.edge(13, b);
    const DLe = this.edge(14, b), DRe = this.edge(15, b);
    const DU = this.held(12, b), DD = this.held(13, b);
    const DL = this.held(14, b), DR = this.held(15, b);

    try {
      if (screen === 'goodbye') { if (B || ST) cancelQuit(); else if (A) finalizeQuit(); return; }
      // ---------- GUIA DE CONTROLES ----------
      if (screen === 'controls') {
        if (A || B) { screen = 'title'; playUIClick(); }
        return;
      }
      // ---------- TÍTULO ----------
      if (screen === 'title') {
        if (DUe || DDe) { titleSel = (titleSel + (DDe ? 1 : 3)) % 4; playUIClick(); }
        if (A) {
          if (titleSel === 0) {
            screen = 'playing'; playTitleChime(); Music.setTrack('flight');
            if (musicEnabled) Music.start();
            if (currentGalaxy) {
              const er = explorationRadius();
              const ang = Math.PI * 0.25, d = er * 0.40;
              ship.x = Math.cos(ang)*d; ship.y = Math.sin(ang)*d;
              ship.vx = ship.vy = 0; camera.x = ship.x; camera.y = ship.y;
            }
          } else if (titleSel === 1) { screen = 'options'; optionsSel = 0; confirmClear = false; playUIClick(); }
          else if (titleSel === 2) { screen = 'controls'; playUIClick(); }
          else { playUIClick(); beginQuit(); }
        }
        return;
      }

      if (screen === 'controls') {
        if (A || B) { screen = 'title'; playUIClick(); }
        return;
      }

      // ---------- OPÇÕES ----------
      if (screen === 'options') {
        if (confirmClear) {
          if (A) { clearProgress(); confirmClear = false; playNamingChime(); }
          else if (B) confirmClear = false;
        } else {
          if (DUe) { optionsSel = (optionsSel + 8) % 9; playUIClick(); }
          if (DDe) { optionsSel = (optionsSel + 1) % 9; playUIClick(); }
          if (optionsSel === 0) {
            if (DLe) { setVolume(volumeLevel - 0.1); playUIClick(); }
            if (DRe) { setVolume(volumeLevel + 0.1); playUIClick(); }
          }
          if (optionsSel === 2) {
            if (DLe || DRe) { setLang(currentLang === 'en' ? 'pt' : 'en'); playUIClick(); }
          }
          if (A) {
            if (optionsSel === 1) { setMusic(!musicEnabled); playUIClick(); }
            else if (optionsSel === 2) { setLang(currentLang === 'en' ? 'pt' : 'en'); playUIClick(); }
            else if (optionsSel === 3) { const n = window.prompt('Nome do jogador:', playerName); if (n !== null) { playerName = n.trim().slice(0,24); savePlayer(); } }
            else if (optionsSel === 4) { const cur = CURRENT_SEED_TEXT || '0x' + CURRENT_SEED.toString(16).toUpperCase(); const n = window.prompt('Semente:', cur); if (n !== null) { setSeedFromText(n); playNamingChime(); } }
            else if (optionsSel === 5) { colorMode = (colorMode === 'orange') ? 'realistic' : 'orange'; applyColorPalette(colorMode === 'realistic' ? COLOR_PALETTE_REALISTIC : COLOR_PALETTE_ORANGE); galaxyArtCache.clear(); try { localStorage.setItem(COLORMODE_KEY, colorMode); } catch(e){} playUIClick(); }
            else if (optionsSel === 6) { flightMode = (flightMode === 'tank') ? 'newtonian' : 'tank'; try { localStorage.setItem(FLIGHTMODE_KEY, flightMode); } catch(e){} playUIClick(); }
            else if (optionsSel === 7) confirmClear = true;
            else if (optionsSel === 8) { screen = 'title'; Music.setTrack('menu'); playUIClick(); }
          }
          if (B) { screen = 'title'; Music.setTrack('menu'); playUIClick(); }
        }
        return;
      }

      // ---------- JOGO ----------
      if (screen !== 'playing') return;

      if (SEL) this.screenshotRequested = true;
      if (ST) { screen = 'title'; titleSel = 0; Music.setTrack('menu'); playUIClick(); return; }

      // PlanetInfo (aberto por R3 em foco/órbita)
      if (planetInfo.open) {
        if (DL || LB) { planetInfo.tab = (planetInfo.tab + planetInfo.tabs.length - 1) % planetInfo.tabs.length; playUIClick(); }
        if (DR || RB) { planetInfo.tab = (planetInfo.tab + 1) % planetInfo.tabs.length; playUIClick(); }
        if (B || X)   { planetInfo.open = false; playUIClick(); }
        return;
      }

      // L3/R3 alterna modo de voo (só em voo livre)
      if ((L3 || R3) && !mapOpen && !surfaceState && !telescopeState && !orbitState && !focusedSystem) {
        flightMode = (flightMode === 'tank') ? 'newtonian' : 'tank';
        try { localStorage.setItem(FLIGHTMODE_KEY, flightMode); } catch(e){}
        playUIClick();
      }

      // Superfície
      if (surfaceState) {
        if (A || B) { exitSurface(); return; }
        if (DL || rlx < -0.15) surfaceState.azimuth -= 1.4 * dt;
        if (DR || rlx >  0.15) surfaceState.azimuth += 1.4 * dt;
        surfaceState.azimuth = ((surfaceState.azimuth % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
        return;
      }

      // Telescópio
      if (telescopeState) {
        const n = telescopeState.sys.planets.length;
        if (LB || DLe) { telescopeState.selectedIndex = (telescopeState.selectedIndex - 1 + n) % n; playUIClick(); }
        if (RB || DRe) { telescopeState.selectedIndex = (telescopeState.selectedIndex + 1) % n; playUIClick(); }
        if (A) { enterOrbit(telescopeState.sys, telescopeState.selectedIndex); telescopeState = null; return; }
        if (B || X) { exitTelescope(); return; }
        return;
      }

      // Órbita
      if (orbitState) {
        if (A) { if (canLandOn(orbitState.planet)) enterSurface(orbitState.sys, orbitState.planetIndex); else playUIClick(); return; }
        if (B) { exitOrbit(); return; }
        if (R3) {
          planetInfo.open = true; planetInfo.tab = 0;
          planetInfo.sys = orbitState.sys;
          planetInfo.planetIndex = orbitState.planetIndex;
          planetInfo.planet = orbitState.planet;
          playUIClick(); return;
        }
        return;
      }

      // Star Browser
      if (starBrowser.open) {
        const rs = this.stick(a[2], a[3]);
        if (rs.x || rs.y) {
          starBrowser.mouseFocus = true;
          starBrowser.mouse.x = clamp(starBrowser.mouse.x + rs.x*180*dt, 2, BASE_W-2);
          starBrowser.mouse.y = clamp(starBrowser.mouse.y + rs.y*180*dt, 2, BASE_H-2);
          if (starBrowser.mouse.y >= SB_TABLE_Y + 10 && starBrowser.mouse.y < SB_TABLE_Y + 10 + SB_VISIBLE_ROWS*SB_ROW_H) {
            starBrowser.cursorRow = Math.max(0, Math.min(SB_VISIBLE_ROWS-1, Math.floor((starBrowser.mouse.y - (SB_TABLE_Y+10)) / SB_ROW_H)));
          }
        }
        const ls = this.stick(a[0], a[1]);
        if (ls.y) {
          starBrowser.scroll = clamp(starBrowser.scroll + Math.round(ls.y * dt * 30), 0, Math.max(0, starBrowser.results.length - SB_VISIBLE_ROWS));
        }
        if (DUe) {
          if (starBrowser.focusRow === 'table') {
            if (starBrowser.cursorRow > 0) starBrowser.cursorRow--;
            else if (starBrowser.scroll > 0) starBrowser.scroll--;
            else starBrowser.focusRow = 'header';
          } else if (starBrowser.focusRow === 'header') {
            starBrowser.focusRow = 'filters';
          } else if (starBrowser.focusRow === 'filters') {
            starBrowser.focusRow = 'enter';
          }
          starBrowser.mouseFocus = false; playUIClick();
        }
        if (DDe) {
          if (starBrowser.focusRow === 'enter') starBrowser.focusRow = 'filters';
          else if (starBrowser.focusRow === 'filters') starBrowser.focusRow = 'header';
          else if (starBrowser.focusRow === 'header') starBrowser.focusRow = 'table';
          else {
            const tot = starBrowser.results.length;
            if (starBrowser.cursorRow < SB_VISIBLE_ROWS - 1 && starBrowser.cursorRow + starBrowser.scroll + 1 < tot) starBrowser.cursorRow++;
            else if (starBrowser.scroll + SB_VISIBLE_ROWS < tot) starBrowser.scroll++;
          }
          starBrowser.mouseFocus = false; playUIClick();
        }
        if (DLe) {
          if (starBrowser.focusRow === 'enter') { starBrowser.focusRow = 'filters'; starBrowser.filterIndex = SB_FILTER_KEYS.length - 1; }
          else if (starBrowser.focusRow === 'filters') { if (starBrowser.filterIndex > 0) starBrowser.filterIndex--; }
          else starBrowser.cursorCol = (starBrowser.cursorCol + SB_COLUMNS.length - 1) % SB_COLUMNS.length;
          starBrowser.mouseFocus = false; playUIClick();
        }
        if (DRe) {
          if (starBrowser.focusRow === 'filters') {
            if (starBrowser.filterIndex < SB_FILTER_KEYS.length - 1) starBrowser.filterIndex++;
            else starBrowser.focusRow = 'enter';
          }
          else if (starBrowser.focusRow !== 'enter') starBrowser.cursorCol = (starBrowser.cursorCol + 1) % SB_COLUMNS.length;
          starBrowser.mouseFocus = false; playUIClick();
        }
        if (LB) {
          if (starBrowser.focusRow === 'filters') starBrowser.filterIndex = (starBrowser.filterIndex + SB_FILTER_KEYS.length - 1) % SB_FILTER_KEYS.length;
          else starBrowser.searchRadius = Math.max(50, starBrowser.searchRadius - 50);
          playUIClick();
        }
        if (RB) {
          if (starBrowser.focusRow === 'filters') starBrowser.filterIndex = (starBrowser.filterIndex + 1) % SB_FILTER_KEYS.length;
          else starBrowser.searchRadius = Math.min(20000, starBrowser.searchRadius + 50);
          playUIClick();
        }
        if (A) {
          if (starBrowser.focusRow === 'enter') {
            sbPerformSearch();
          } else if (starBrowser.focusRow === 'filters') {
            const k = SB_FILTER_KEYS[starBrowser.filterIndex];
            starBrowser.filters[k] = !starBrowser.filters[k];
            playUIClick();
          } else if (starBrowser.focusRow === 'header') {
            sbCycleSort(SB_COLUMNS[starBrowser.cursorCol].key);
          } else if (starBrowser.results.length === 0) {
            sbPerformSearch();
          } else {
            const r = starBrowser.results[starBrowser.cursorRow + starBrowser.scroll];
            if (r) { startWarp(r.sys); starBrowser.open = false; }
          }
        }
        if (B || ST) { starBrowser.open = false; playUIClick(); }
        return;
      }

      // Diário
      if (logOpen) { if (B || ST) logOpen = false; return; }

      // Mapa
      if (mapOpen) {
        if (mapMouse.x < 0) { mapMouse.x = BASE_W/2; mapMouse.y = BASE_H/2; }
        const L = getMapLayout();
        // ANALÓGICO ESQUERDO = move o MAPA (estrelas / galáxias)
        const ls = this.stick(a[0], a[1]);
        if (ls.x || ls.y) {
          const c = (mapMode === 'galaxy') ? galaxyCenter : mapCenter;
          const pan = getMapRadius() * 1.1 * dt * (MAP_PAN_INVERT ? -1 : 1);
          c.x += ls.x * pan; c.y += ls.y * pan;
          if (mapMode === 'galaxy') { c.x = clamp(c.x, 0, UNIVERSE_SIZE); c.y = clamp(c.y, 0, UNIVERSE_SIZE); }
        }
        // ANALÓGICO DIREITO = move o CURSOR (devagar, com curva); D-pad = ajuste fino
        const rs = this.stick(a[2], a[3]);
        mapMouse.x += rs.x * 110 * dt; mapMouse.y += rs.y * 110 * dt;
        if (DL) mapMouse.x -= 55 * dt;
        if (DR) mapMouse.x += 55 * dt;
        if (DU) mapMouse.y -= 55 * dt;
        if (DD) mapMouse.y += 55 * dt;
        mapMouse.x = clamp(mapMouse.x, L.x0 + 1, L.x0 + L.w - 1);
        mapMouse.y = clamp(mapMouse.y, L.y0 + 1, L.y0 + L.h - 1);
        // Gatilhos: RT aproxima, LT afasta — o zoom é ancorado no cursor.
        // Só arma depois de soltar os gatilhos (evita zoom por quem vinha acelerando).
        const rawRt = GP.rt || 0, rawLt = GP.lt || 0;
        if (!this.mapZoomArmed) { if (rawRt < 0.05 && rawLt < 0.05) this.mapZoomArmed = true; }
        else {
          const zd = rawRt - rawLt;
          if (Math.abs(zd) > 0.05) applyMapZoom(Math.pow(2.0, zd * dt * 3.2), mapMouse.x, mapMouse.y);
        }
        if (mapMode === 'star') mapHovered = findMapSystemAt(mapMouse.x, mapMouse.y);
        else hoveredGalaxy = findGalaxyAtMap(mapMouse.x, mapMouse.y);

        if (LB || RB) {
          const dir = RB ? 1 : -1;
          if (mapMode === 'star') { const i = MAP_FILTERS.indexOf(mapFilter); mapFilter = MAP_FILTERS[(i + dir + MAP_FILTERS.length) % MAP_FILTERS.length]; }
          else { const i = GALAXY_FILTERS.indexOf(galaxyFilter); galaxyFilter = GALAXY_FILTERS[(i + dir + GALAXY_FILTERS.length) % GALAXY_FILTERS.length]; }
          playUIClick();
        }
        if (L3 || R3) { mapOpen = false; starBrowser.open = true; starBrowser.mouse.x = 80; starBrowser.mouse.y = 80; playUIClick(); return; }
        if (Y) { toggleMapMode(); return; }
        if (A) {
          if (mapMode === 'star' && mapHovered) {
            mapSelected = mapHovered; waypointKey = sysKey(mapHovered); saveWaypoint(); startWarp(mapHovered); return;
          }
          if (mapMode === 'galaxy' && hoveredGalaxy) {
            selectedGalaxy = hoveredGalaxy;
            if (hoveredGalaxy !== currentGalaxy) { startGalaxyWarp(hoveredGalaxy); return; }
          }
          playUIClick();
        }
        if (B) { mapOpen = false; return; }
        return;
      }

      // Focado em sistema
      if (focusedSystem) {
        if (B) { exitFocus(); return; }
        if (X && focusedSystem.planets.length > 0 && !focusedSystem.isSupermassive) { enterTelescope(focusedSystem); return; }
        // Y orbita o primeiro planeta
        if (Y && focusedSystem.planets.length > 0 && !focusedSystem.isBlackHole && !focusedSystem.isRogue) {
          enterOrbit(focusedSystem, 0); return;
        }
        // R3 abre informações do planeta selecionado (se houver)
        if (R3 && focusedSystem.planets.length > 0) {
          planetInfo.open = true; planetInfo.tab = 0;
          planetInfo.sys = focusedSystem; planetInfo.planetIndex = 0;
          planetInfo.planet = focusedSystem.planets[0];
          playUIClick(); return;
        }
        return;
      }

      // Voo livre
      if (A) { const {sys, dist} = findNearestSystemToShip(); if (sys && dist < ENTER_RADIUS) enterFocus(sys); return; }
      if (B) { if (waypointKey) { waypointKey = null; saveWaypoint(); } return; }
      if (X) { const {sys} = findNearestSystemToShip(); if (sys) { ship.x = sys.worldX; ship.y = sys.worldY; ship.vx = ship.vy = 0; camera.x = ship.x; camera.y = ship.y; } return; }
      if (Y) { mapOpen = true; openStarMap(); mapMouse.x = BASE_W/2; mapMouse.y = BASE_H/2; this.mapZoomArmed = false; playUIClick(); return; }
      if (LB) { mapOpen = true; openGalaxyMap(); mapMouse.x = BASE_W/2; mapMouse.y = BASE_H/2; this.mapZoomArmed = false; playUIClick(); return; }
      if (RB) { logOpen = true; playUIClick(); return; }
    } finally {
      // Garantia: prev sempre salvo, mesmo com return no meio
      for (let i = 0; i < b.length; i++) this.prev[i] = !!(b[i] && b[i].pressed);
    }
  },

  checkScreenshot() {
    if (this.screenshotRequested) {
      this.screenshotRequested = false;
      const ev = new KeyboardEvent('keydown', {key:'F4'});
      window.dispatchEvent(ev);
    }
  }
};
GamepadManager.init();initGalaxy();
if (currentGalaxy) {
  const er = explorationRadius();
  const ang = Math.PI * 0.25;
  const d = er * 0.40;
  ship.x = Math.cos(ang)*d; ship.y = Math.sin(ang)*d;
}
camera.x = ship.x; camera.y = ship.y;
galaxyCenter.x = currentGalaxy ? currentGalaxy.ux : UNIVERSE_SIZE/2;
galaxyCenter.y = currentGalaxy ? currentGalaxy.uy : UNIVERSE_SIZE/2;

Music.setTrack('menu');
if (musicEnabled) { ensureAudio(); Music.start(); }

console.log('[Singularvs] seed=0x' + CURRENT_SEED.toString(16).toUpperCase());
console.log('[Singularvs] Galáxia: ' + (currentGalaxy ? currentGalaxy.name + ' R=' + currentGalaxy.radius.toFixed(0) + 'u exploração R=' + explorationRadius().toFixed(0) + 'u' : '—'));
console.log('[Singularvs] SYSTEM_RADIUS=' + SYSTEM_RADIUS + ' CELL=' + GALAXY_CELL);
requestAnimationFrame(loop);
})();
