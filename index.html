  gctx.beginPath(); gctx.moveTo(0, 0); gctx.lineTo(len, -size*1.6); gctx.lineTo(len, size*1.6); gctx.closePath(); gctx.fill();
  gctx.restore();
}

function drawSystemVisual(sys, dist, time) {
  const geo = getSystemGeometry(sys, dist);
  const { sx, sy, isFocused, normalZoom, finalStarSize } = geo;
  if (sx < -80 || sx > BASE_W+80 || sy < -80 || sy > BASE_H+80) return;
  const isVisited = visited.has(sysKey(sys));
  const isWaypoint = waypointKey === sysKey(sys);
  if (!isFocused) {
    const ringR = 20 + 6*Math.sin(time*0.003 + sys.cx*3 + sys.cy*7);
    let ringColor;
    if (sys.isSupermassive) ringColor = 'rgba(255,200,100,0.75)';
    else if (sys.isBlackHole) ringColor = isVisited ? 'rgba(255,180,100,0.55)' : 'rgba(255,80,30,0.4)';
    else if (sys.isNeutronStar) ringColor = isVisited ? 'rgba(180,210,255,0.6)' : 'rgba(140,180,255,0.4)';
    else if (sys.isRogue) ringColor = isVisited ? 'rgba(180,200,220,0.5)' : 'rgba(140,160,180,0.3)';
    else if (sys.isBrownDwarf) ringColor = isVisited ? 'rgba(200,120,100,0.55)' : 'rgba(160,80,60,0.3)';
    else ringColor = isVisited ? 'rgba(255,180,100,0.55)' : 'rgba(255,140,26,0.30)';
    gctx.strokeStyle = ringColor;
    gctx.setLineDash(isVisited ? [] : [2, 3]);
    gctx.beginPath(); gctx.arc(sx, sy, ringR, 0, Math.PI*2); gctx.stroke();
    gctx.setLineDash([]);
  }
  if (isWaypoint && !isFocused) {
    const wpR = 28 + 3*Math.sin(time*0.006);
    gctx.strokeStyle = PALETTE.waypoint; gctx.lineWidth = 1;
    gctx.beginPath(); gctx.arc(sx, sy, wpR, 0, Math.PI*2); gctx.stroke();
    gctx.lineWidth = 0.5;
    gctx.beginPath(); gctx.arc(sx, sy, wpR+3, 0, Math.PI*2); gctx.stroke();
  }
  if (sys.isSupermassive) drawSupermassiveBlackHole(sys, sx, sy, Math.max(3, finalStarSize), time, isFocused);
  else if (sys.isBlackHole) { drawBlackHoleVisual(sx, sy, Math.max(2, finalStarSize-1), time); return; }
  else if (sys.isNeutronStar) drawNeutronStarVisual(sys, sx, sy, Math.max(2, finalStarSize), time);
  else if (sys.isWhiteDwarf) drawWhiteDwarfVisual(sx, sy, Math.max(2, finalStarSize), time);
  else if (sys.isBrownDwarf) drawBrownDwarfVisual(sys, sx, sy, Math.max(2, finalStarSize), time);
  else if (sys.isRogue) drawRogueSystemVisual(sys, sx, sy, time);
  else {
    const col = starColorFor(sys);
    const gr = finalStarSize*5 + 6;
    const g = gctx.createRadialGradient(sx, sy, 0, sx, sy, gr);
    g.addColorStop(0, col); g.addColorStop(0.35, col+'66'); g.addColorStop(1, 'transparent');
    gctx.fillStyle = g;
    gctx.beginPath(); gctx.arc(sx, sy, gr, 0, Math.PI*2); gctx.fill();
    gctx.fillStyle = col;
    gctx.beginPath(); gctx.arc(sx, sy, finalStarSize, 0, Math.PI*2); gctx.fill();
    if (sys.companion) {
      const c = sys.companion;
      const a = c.angle + time*0.0008*c.speed;
      const off = c.separation * (1 + focusBlend*1.5);
      const csx = sx + Math.cos(a)*off, csy = sy + Math.sin(a)*off*0.5;
      const csr = c.starRadius, cgr = csr*5+4;
      const ccol = colorMode === 'realistic' ? (PALETTE.starColors[c.starType] || c.starColor) : c.starColor;
      const cg = gctx.createRadialGradient(csx, csy, 0, csx, csy, cgr);
      cg.addColorStop(0, ccol); cg.addColorStop(0.4, ccol+'66'); cg.addColorStop(1, 'transparent');
      gctx.fillStyle = cg;
      gctx.beginPath(); gctx.arc(csx, csy, cgr, 0, Math.PI*2); gctx.fill();
      gctx.fillStyle = ccol;
      gctx.beginPath(); gctx.arc(csx, csy, csr, 0, Math.PI*2); gctx.fill();
    }
  }
  const showP = isFocused ? focusBlend > 0.05 : normalZoom > 0.4;
  if (showP && sys.planets.length > 0) {
    for (const p of sys.planets) {
      const a = p.phase + time*0.001*p.speed;
      const r = p.distance * geo.orbitScale;
      const px = sx + Math.cos(a)*r, py = sy + Math.sin(a)*r*0.4;
      const ps = Math.max(2, Math.round(p.size * geo.orbitScale));
      if (isFocused && focusBlend > 0.4) {
        gctx.strokeStyle = 'rgba(255,140,26,0.15)'; gctx.lineWidth = 1;
        gctx.beginPath(); gctx.ellipse(sx, sy, r, r*0.4, 0, 0, Math.PI*2); gctx.stroke();
      }
      if (p.type === 'COMETA') { drawComet(px, py, ps, time, Math.atan2(py-sy, px-sx)+Math.PI); continue; }
      gctx.fillStyle = p.color;
      gctx.beginPath(); gctx.arc(px, py, ps, 0, Math.PI*2); gctx.fill();
      if (p.tidalLocked && isFocused && focusBlend > 0.6) {
        gctx.fillStyle = 'rgba(255,120,40,0.5)';
        gctx.beginPath(); gctx.arc(px - ps*0.5, py, ps*0.8, 0, Math.PI*2); gctx.fill();
      }
    }
  }
}

function drawShip() {
  if (focusedSystem && focusBlend > 0.4) return;
  if (mode === 'warp' || galaxyWarp) return;
  const cx = Math.floor(BASE_W/2), cy = Math.floor(BASE_H/2);
  if (flightMode === 'newtonian') {
    for (const p of shipTrail) {
      const px = p.x - camera.x + BASE_W/2, py = p.y - camera.y + BASE_H/2;
      const a = Math.max(0, 1 - p.age/2) * 0.5;
      gctx.fillStyle = 'rgba(255,140,60,'+a.toFixed(2)+')';
      gctx.fillRect(Math.round(px), Math.round(py), 1, 1);
    }
    gctx.save(); gctx.translate(cx, cy); gctx.rotate(ship.facing + Math.PI/2);
    gctx.fillStyle = PALETTE.ship.body;
    gctx.fillRect(-1, -3, 2, 4); gctx.fillRect(-2, 0, 4, 2); gctx.fillRect(-1, 2, 2, 1);
    gctx.fillStyle = PALETTE.ship.cockpit; gctx.fillRect(0, -4, 1, 1);
    if (keys['w'] || keys['arrowup']) {
      gctx.fillStyle = PALETTE.ship.engine; gctx.fillRect(-1, 4, 2, 2);
      gctx.fillStyle = '#ffff80'; gctx.fillRect(0, 4, 1, 1);
    }
    gctx.restore();
  } else {
    if (keys['w'] || keys['arrowup']) {
      gctx.fillStyle = PALETTE.ship.engine; gctx.fillRect(cx, cy+3, 1, 2);
      gctx.fillStyle = PALETTE.ship.cockpit; gctx.fillRect(cx, cy+3, 1, 1);
    }
    gctx.fillStyle = PALETTE.ship.body;
    gctx.fillRect(cx, cy-2, 1, 1); gctx.fillRect(cx-1, cy-1, 3, 1); gctx.fillRect(cx-2, cy, 5, 1);
    gctx.fillRect(cx-1, cy+1, 3, 1); gctx.fillRect(cx-1, cy+2, 1, 1); gctx.fillRect(cx+1, cy+2, 1, 1);
    gctx.fillStyle = PALETTE.ship.cockpit; gctx.fillRect(cx, cy-1, 1, 1);
  }
}
function drawWarpEffects(time) {
  if (mode === 'warp' && warp) {
    const p = warp.t / warp.duration;
    const intensity = Math.sin(p * Math.PI);
    const g = gctx.createRadialGradient(BASE_W/2, BASE_H/2, 0, BASE_W/2, BASE_H/2, 100);
    g.addColorStop(0, 'rgba(255,180,100,'+(0.55*intensity).toFixed(2)+')');
    g.addColorStop(0.5, 'rgba(255,140,26,'+(0.25*intensity).toFixed(2)+')');
    g.addColorStop(1, 'transparent');
    gctx.fillStyle = g;
    gctx.fillRect(0, 0, BASE_W, BASE_H);
  }
}

// CLASSIFICAÇÃO (igual ao anterior)
function getPlanetVisualKind(planet) {
  if (planet.type === 'COMETA') return 'COMETA';
  const pc = planet.planetClass;
  if (pc === 'GASGIANT' || pc === 'ICEGIANT') return 'GASOSO';
  if (pc === 'ICEWORLD' || pc === 'TITAN') return 'GELADO';
  if (pc === 'TERRA') return 'TERRA';
  if (pc === 'OCEANIA') return 'OCEANICO';
  if (pc === 'SELENA') return 'ROCHOSO';
  if (planet.tidalLocked && planet.temperatureDay > 700) return 'MOLTEN';
  return 'ROCHOSO';
}
function getRockySubtype(planet) {
  // Usa a classe planetária como base, com subtipo derivado de temperatura
  const pc = planet.planetClass || (planet.type === 'ROCHOSO' ? 'DESERT' : null);
  if (!pc) return null;
  if (pc === 'SELENA') return 'SELENA';
  if (pc === 'DESERT') {
    if (planet.temperatureEq > 700) return 'VULCÂNICO';
    if (planet.temperatureEq > 400) return 'ÁRIDO';
    return 'DESÉRTICO';
  }
  if (pc === 'TERRA') return 'TEMPERADO';
  if (pc === 'OCEANIA') return 'OCEÂNICO';
  if (pc === 'ICEWORLD') return 'GLACIAL';
  if (pc === 'TITAN') return 'TITÃ';
  return null;
}
function getPlanetDescriptor(planet) {
  const seed = hash2D(planet.epithet.charCodeAt(0), planet.letter.charCodeAt(0), activeSeed() ^ 0xFACE);
  const rng = mulberry32(seed);
  const roll = rng();
  const atm = planet.atmosphere ? planet.atmosphere.name : 'Vácuo';
  const dens = planet.atmosphere ? planet.atmosphere.dens : 'Nula';
  if (planet.tidalLocked) {
    if (planet.temperatureDay > 700) return roll < 0.5 ? 'Lado diurno em fusão rochosa' : 'Oceano de magma permanente';
    if (planet.temperatureDay < 320 && planet.temperatureNight > 100) return roll < 0.5 ? 'Anel temperado no terminador' : 'Nuvens em espiral convergem';
    return roll < 0.5 ? 'Geleira eterna no lado noturno' : 'Crosta congelada no hemisfério oculto';
  }
  if (planet.type === 'ROCHOSO') {
    const sub = getRockySubtype(planet);
    if (sub === 'VULCÂNICO' || sub === 'MOLTEN') {
      if (atm.indexOf('CO') !== -1) return roll < 0.5 ? 'Rios de lava basáltica' : 'Atmosfera densa de CO₂';
      return roll < 0.5 ? 'Rios de lava basáltica' : 'Crosta rachada por calor';
    }
    if (sub === 'ÁRIDO') {
      if (atm === 'Vácuo') return roll < 0.5 ? 'Deserto selado pelo vácuo' : 'Superfície crestada pelo Sol';
      return roll < 0.5 ? 'Deserto de silicatos' : 'Superfície selada por calor';
    }
    if (sub === 'TEMPERADO') {
      if (atm === 'N₂-O₂') return roll < 0.5 ? 'Crosta temperada com água' : 'Ciclos sazonais ativos';
      if (atm === 'N₂')     return roll < 0.5 ? 'Estepes de nitrogênio' : 'Planícies férteis';
      return roll < 0.5 ? 'Crosta temperada' : 'Ciclos sazonais ativos';
    }
    if (sub === 'DESÉRTICO') {
      if (atm === 'CO₂') return roll < 0.5 ? 'Tempestades de poeira' : 'Dunas de carbonato';
      if (atm === 'Ar')  return roll < 0.5 ? 'Depósitos minerais expostos' : 'Estepes áridas';
      return roll < 0.5 ? 'Estepes áridas' : 'Depósitos minerais expostos';
    }
    if (sub === 'GLACIAL') {
      if (atm === 'Vácuo') return roll < 0.5 ? 'Crosta congelada estéril' : 'Gelo eterno sob estrelas';
      return roll < 0.5 ? 'Geleiras cobrem continentes' : 'Crosta congelada';
    }
    if (atm === 'Vácuo') return 'Superfície estéril de silicatos';
    if (atm === 'CO₂')   return 'Superfície selada por dióxido de carbono';
    return 'Superfície rochosa estável';
  } else if (planet.type === 'GASOSO') {
    if (atm.indexOf('NH₃') !== -1) return roll < 0.25 ? 'Bandas de amônia em turbulência' : 'Tempestades de amônia duradouras';
    if (atm.indexOf('CH₄') !== -1) return roll < 0.25 ? 'Bandas de metano em turbulência' : 'Ciclones polares de metano';
    return roll < 0.25 ? 'Bandas de hidrogênio em turbulência' :
           roll < 0.50 ? 'Tempestades equatoriais duradouras' :
           roll < 0.75 ? 'Correntes de hidrogênio' : 'Ciclones polares estáveis';
  } else if (planet.type === 'COMETA') {
    return roll < 0.5 ? 'Cauda de poeira ionizada' : 'Núcleo volátil em sublimação';
  } else {
    if (atm.indexOf('CH₄') !== -1) {
      return roll < 0.5 ? 'Superfície cristalina de metano' : 'Lagos de metano líquido';
    }
    if (atm.indexOf('N₂') !== -1) {
      if (dens === 'Tênue') return roll < 0.5 ? 'Atmosfera de nitrogênio rarefeita' : 'Calotas polares permanentes';
      return roll < 0.5 ? 'Atmosfera densa de nitrogênio' : 'Calotas polares permanentes';
    }
    if (atm.indexOf('CO') !== -1) {
      return roll < 0.5 ? 'Geleiras de CO₂ em sublimação' : 'Crosta de monóxido de carbono';
    }
    return roll < 0.5 ? 'Superfície congelada estável' : 'Geleiras de CO₂ em sublimação';
  }
}
function projectSphere(cx, cy, R, lat, lon) {
  const cosφ = Math.cos(lat), sinφ = Math.sin(lat);
  const cosθ = Math.cos(lon), sinθ = Math.sin(lon);
  const depth = cosφ * cosθ;
  const scaleX = cosφ * Math.sqrt(cosθ*cosθ + sinφ*sinφ*sinθ*sinθ);
  const scaleY = cosφ;
  return { x: cx + R*cosφ*sinθ, y: cy - R*sinφ, depth, scaleX, scaleY };
}

// ORBIT VIEW (igual ao anterior)
function drawRingsOrbit(cx, cy, R, planet, clipAbove) {
  const rr = R*1.7, rr2 = R*1.45;
  gctx.save();
  gctx.beginPath();
  if (clipAbove) gctx.rect(cx - rr*1.5, cy - rr*1.2, rr*3, rr*1.2);
  else gctx.rect(cx - rr*1.5, cy, rr*3, rr*1.2);
  gctx.clip();
  gctx.strokeStyle = planet.ringColor + (clipAbove ? '88' : 'dd');
  gctx.lineWidth = 2;
  gctx.beginPath(); gctx.ellipse(cx, cy, rr, rr*0.32, 0, 0, Math.PI*2); gctx.stroke();
  gctx.strokeStyle = planet.ringColor + (clipAbove ? '55' : '99');
  gctx.lineWidth = 1;
  gctx.beginPath(); gctx.ellipse(cx, cy, rr2, rr2*0.32, 0, 0, Math.PI*2); gctx.stroke();
  gctx.restore();
}

function drawOrbitView(time) {
  if (!orbitState) return;
  const { planet, blend } = orbitState;
  drawPlanetBody(planet, BASE_W/2, BASE_H/2 - 6, Math.max(2, Math.round((42 + planet.size*6) * blend)), time);
}
// Desenho único do globo planetário (usado pela órbita E pelo telescópio),
// para que o planeta observado seja exatamente o que será visitado.
function drawPlanetBody(planet, cx, cy, R, time) {
  const kind = getPlanetVisualKind(planet);
  const glowColor = (kind === 'TERRA') ? '#4a8aa8' : planet.color;
  const glow = gctx.createRadialGradient(cx, cy, R*0.9, cx, cy, R*1.5);
  glow.addColorStop(0, glowColor+'55'); glow.addColorStop(1, 'transparent');
  gctx.fillStyle = glow;
  gctx.beginPath(); gctx.arc(cx, cy, R*1.5, 0, Math.PI*2); gctx.fill();
  if (planet.hasRings) drawRingsOrbit(cx, cy, R, planet, true);
  gctx.save();
  gctx.beginPath(); gctx.arc(cx, cy, R, 0, Math.PI*2); gctx.clip();
  let baseColor;
  if (kind === 'TERRA') baseColor = '#1a3a5a';
  else if (kind === 'OCEANICO') baseColor = '#6a4a2a';
  else if (kind === 'MOLTEN') baseColor = '#3a0a05';
  else baseColor = planet.color;
  gctx.fillStyle = baseColor;
  gctx.fillRect(cx-R, cy-R, R*2, R*2);
  const seed = hash2D(planet.epithet.charCodeAt(0), planet.letter.charCodeAt(0), activeSeed() ^ 0xD00D);
  const rng = mulberry32(seed);
  const rotSpeed = 0.15 + planet.size*0.04;
  const rotation = planet.tidalLocked ? 0 : (time*0.001) * rotSpeed;
  const features = [];
  const rockySub = getRockySubtype(planet);
  if (kind === 'ROCHOSO' || kind === 'GELADO' || kind === 'MOLTEN') {
    const count = kind === 'GELADO' ? 22 + Math.floor(rng()*10) : 30 + Math.floor(rng()*12);
    for (let i = 0; i < count; i++) {
      features.push({ type:'crater', lat:(rng()-0.5)*Math.PI*0.92, lon: rng()*Math.PI*2,
        size: (0.05+rng()*0.10)*R, dark: rng()>0.5, frozen: kind==='GELADO' });
    }
    if (rockySub === 'VULCÂNICO' || rockySub === 'MOLTEN') {
      const lavaN    = Math.max(6, Math.floor((planet.volcanoCount || 10) * 1.5));
      const volcanoN = Math.max(3, planet.volcanoCount || 5);
      for (let i = 0; i < lavaN; i++) features.push({ type:'lava', lat:(rng()-0.5)*Math.PI*0.85, lon: rng()*Math.PI*2, size:(0.05+rng()*0.09)*R });
      for (let i = 0; i < volcanoN; i++) features.push({ type:'volcano',
        lat:(rng()-0.5)*Math.PI*0.85, lon: rng()*Math.PI*2,
        size:(0.05+rng()*0.06)*R, phase: rng()*Math.PI*2 });
    }
    // Cryovulcões (Europa-like) em mundos com crosta de gelo e oceano interno
    if (kind === 'GELADO' && planet.cryovolcanoCount > 0) {
      for (let i = 0; i < planet.cryovolcanoCount; i++) {
        features.push({ type:'cryovolcano',
          lat: (rng()-0.5)*Math.PI*0.85, lon: rng()*Math.PI*2,
          size: (0.05 + rng()*0.07)*R, phase: rng()*Math.PI*2 });
      }
    }
    if (rockySub && rockySub !== 'MOLTEN') {
      const nRidge = (rockySub === 'TEMPERADO') ? 5 : 3;
      const ridgeScale = (rockySub === 'TEMPERADO') ? 0.040 : 0.030;
      for (let i = 0; i < nRidge; i++) {
        const pts = [];
        let lat = (rng()-0.5)*Math.PI*0.6, lon = rng()*Math.PI*2;
        const segs = 5 + Math.floor(rng()*4);
        for (let s = 0; s < segs; s++) { pts.push({lat, lon}); lat += (rng()-0.5)*0.3; lon += 0.20 + rng()*0.15; }
        features.push({ type:'ridge', pts, size: R*(ridgeScale + rng()*0.02) });
      }
    }
    if (rockySub === 'DESÉRTICO' || rockySub === 'ÁRIDO') {
      for (let i = 0; i < 8; i++) {
        const pts = [];
        const wlat = (rng()-0.5)*Math.PI*0.7;
        const wlon = rng()*Math.PI*2;
        for (let s = 0; s < 6; s++) pts.push({ lat: wlat + (rng()-0.5)*0.1, lon: wlon + s*0.25 });
        features.push({ type:'wave', pts, size: R*(0.022 + rng()*0.018) });
      }
    }
    if (rockySub === 'TEMPERADO' || kind === 'TERRA') {
      for (let i = 0; i < 12; i++) {
        features.push({ type:'grass',
          lat:(rng()-0.5)*Math.PI*0.75, lon: rng()*Math.PI*2,
          size:(0.04 + rng()*0.05)*R });
      }
    }
    if (planet.hasRivers) {
      for (let i = 0; i < 4; i++) {
        const pts = [];
        let lat = (rng()-0.5)*Math.PI*0.7, lon = rng()*Math.PI*2;
        for (let s = 0; s < 8; s++) { pts.push({lat, lon}); lat += (rng()-0.5)*0.25; lon += 0.15 + rng()*0.25; }
        features.push({ type:'river', pts, width: R*(0.025 + rng()*0.02) });
      }
    }
    if (planet.tidalLocked) features.push({ type:'terminator', dayT: planet.temperatureDay, nightT: planet.temperatureNight });
    // Mancha vermelha permanente em Terra-like locked ao redor de anã vermelha
    if (planet.tidalLocked && (planet.hostStarTemp || 5000) < 4000 && kind === 'TERRA') {
      features.push({ type:'redspot' });
    }
  } else if (kind === 'GASOSO') {
    const bandCount = Math.ceil(R / Math.max(3, Math.floor(R/8)));
    for (let i = 0; i < bandCount; i++) {
      features.push({ type:'band', relY: (i/bandCount)*2 - 1, alphaBase: 0.08 + rng()*0.16, alphaSpeed: 0.5+rng()*1.5, phase: rng()*Math.PI*2 });
    }
    features.push({ type:'spot', lat:(rng()-0.5)*0.6, lon: rng()*Math.PI*2, sizeX: R*0.20, sizeY: R*0.10 });
    } else if (kind === 'TERRA' || kind === 'OCEANICO') {
    const isTerra = (kind === 'TERRA');

    // ---- 1. Continentes derivados (parcialmente) das placas tectônicas ----
    const continents = [];
    const plates = planet.plates || [];
    const contCount = isTerra ? (3 + Math.floor(rng()*3)) : (2 + Math.floor(rng()*2));
    for (let c = 0; c < contCount; c++) {
      let cLat, cLon, cSize;
      if (plates.length > 0) {
        const plate = plates[c % plates.length];
        cLat = plate.lat + (rng()-0.5) * 0.3;
        cLon = plate.lon + (rng()-0.5) * 0.4;
        cSize = isTerra ? R*(0.28 + rng()*0.28) * (0.7 + plate.age*0.6) : R*(0.12 + rng()*0.14);
      } else {
        cLat = (rng()-0.5)*Math.PI*0.7;
        cLon = rng()*Math.PI*2;
        cSize = isTerra ? R*(0.30 + rng()*0.28) : R*(0.12 + rng()*0.14);
      }
      const circles = [];
      for (let i = 0; i < 8; i++) {
        circles.push({ dLat:(rng()-0.5)*(cSize/R)*0.9, dLon:(rng()-0.5)*(cSize/R)*1.3, size: cSize*(0.5+rng()*0.5) });
      }
      continents.push({ cLat, cLon, cSize, circles });
      features.push({ type: isTerra ? 'continent' : 'lake', cLat, cLon, circles });
    }

    // Helper: retorna true se (lat, lon) cai sobre algum continente
    const isLand = (lat, lon) => {
      for (const cont of continents) {
        let dLat = lat - cont.cLat;
        let dLon = lon - cont.cLon;
        while (dLon >  Math.PI) dLon -= Math.PI*2;
        while (dLon < -Math.PI) dLon += Math.PI*2;
        const dWorld = Math.hypot(dLat, dLon) * R;
        if (dWorld < cont.cSize * 1.05) return true;
      }
      return false;
    };

    // ---- 2. Rios: nascem em MONTANHAS e terminam em oceano ou lago ----
    const riverPaths = [];
    const mountainSeeds = features.filter(f => f.type === 'ridge');
    const lakeSeeds = features.filter(f => f.type === 'lake');
    const riverCount = 3 + Math.floor(rng()*5);
    for (let i = 0; i < riverCount; i++) {
      let startLat, startLon, found = false;
      // Preferir nascer em uma cordilheira
      if (mountainSeeds.length > 0 && rng() < 0.75) {
        const m = mountainSeeds[Math.floor(rng()*mountainSeeds.length)];
        const pt = m.pts[Math.floor(rng()*m.pts.length)];
        startLat = pt.lat; startLon = pt.lon; found = true;
      } else {
        for (let t = 0; t < 30; t++) {
          startLat = (rng()-0.5)*Math.PI*0.7;
          startLon = rng()*Math.PI*2;
          if (isLand(startLat, startLon)) { found = true; break; }
        }
      }
      if (!found) continue;
      const pts = [{lat:startLat, lon:startLon}];
      let lat = startLat, lon = startLon;
      // Fluxo: desce em direção ao equador e levemente para leste
      for (let s = 0; s < 14; s++) {
        lat += (rng()-0.5)*0.18 - 0.04 * Math.sign(lat);
        lon += 0.12 + rng()*0.20;
        // Termina ao encontrar oceano
        if (!isLand(lat, lon)) break;
        // Ou termina em um lago próximo
        let hitLake = false;
        for (const lake of lakeSeeds) {
          const dLat = lat - lake.cLat, dLon = lon - lake.cLon;
          if (Math.hypot(dLat, dLon) * R < lake.cSize * 0.6) { hitLake = true; break; }
        }
        if (hitLake) break;
        pts.push({lat, lon});
      }
      if (pts.length >= 3) {
        riverPaths.push(pts);
        features.push({ type:'river', pts, width: R*(0.025 + rng()*0.02) });
      }
    }
    // Lagos reais em Terra: pequenos corpos d'água cercados de terra
    if (isTerra) {
      const lakeTarget = planet.lakeCount || 0;
      let lakesPlaced = 0;
      for (let attempt = 0; attempt < 80 && lakesPlaced < lakeTarget; attempt++) {
        const lLat = (rng()-0.5)*Math.PI*0.75;
        const lLon = rng()*Math.PI*2;
        if (isLand(lLat, lLon)) {
          const lSize = R*(0.030 + rng()*0.035);
          features.push({ type:'lake', cLat:lLat, cLon:lLon,
            circles:[{dLat:0, dLon:0, size:lSize}] });
          lakesPlaced++;
        }
      }
    }

    // Helper: retorna true se (lat, lon) está perto de algum rio
    const nearRiver = (lat, lon) => {
      for (const pts of riverPaths) {
        for (const pt of pts) {
          const dLat = lat - pt.lat;
          let dLon = lon - pt.lon;
          while (dLon > Math.PI) dLon -= Math.PI*2;
          while (dLon < -Math.PI) dLon += Math.PI*2;
          if (Math.hypot(dLat, dLon) * R < R * 0.08) return true;
        }
      }
      return false;
    };

    // ---- 3. Cordilheiras (terra, evitando rios) ou ilhas vulcânicas (água) ----
    const nRidge = isTerra ? 12 : 7;
    for (let i = 0; i < nRidge; i++) {
      // Procura latitude/longitude em terra para garantir visibilidade
      let lat = (rng()-0.5)*Math.PI*0.65, lon = rng()*Math.PI*2;
      for (let t = 0; t < 16 && !isLand(lat, lon); t++) {
        lat = (rng()-0.5)*Math.PI*0.65;
        lon = rng()*Math.PI*2;
      }
      // Gera TODOS os rng primeiro (preserva sequência determinística)
      const segs = 6 + Math.floor(rng()*4);
      const ridgePts = [];
      let clat = lat, clon = lon;
      for (let s = 0; s < segs; s++) {
        ridgePts.push({lat: clat, lon: clon});
        clat += (rng()-0.5)*0.3;
        clon += 0.20 + rng()*0.15;
      }
      const ridgeSize = R*(0.075 + rng()*0.040);
      const volcSize = R*(0.055 + rng()*0.045);
      const volcPhase = rng()*Math.PI*2;

      // Aceita a crista se ao menos METADE dos pontos cair em terra.
      // Filtra apenas os pontos que caem sobre rios (deixa o resto intacto).
      let landPts = 0;
      for (const pt of ridgePts) if (isLand(pt.lat, pt.lon)) landPts++;
      if (landPts >= Math.max(2, Math.floor(ridgePts.length * 0.5))) {
        const filtered = ridgePts.filter(pt => !nearRiver(pt.lat, pt.lon));
        if (filtered.length >= 2) {
          features.push({ type:'ridge', pts: filtered, size: ridgeSize });
        }
      } else {
        features.push({ type:'volcanic_island', lat, lon, size: volcSize, phase: volcPhase });
      }
    }

    // ---- 4. Vegetação (apenas em terra, evitando rios e montanhas) ----
    if (isTerra) {
      for (let i = 0; i < 24; i++) {
        const lat = (rng()-0.5)*Math.PI*0.80, lon = rng()*Math.PI*2;
        if (isLand(lat, lon) && !nearRiver(lat, lon)) {
          features.push({ type:'grass', lat, lon, size:(0.05 + rng()*0.06)*R });
        }
      }
    }

    // ---- 5. Nuvens (só em Terra) ----
    if (isTerra) {
      for (let i = 0; i < 6; i++) features.push({ type:'cloud',
        lat:(rng()-0.5)*Math.PI*0.85, lon: rng()*Math.PI*2,
        w: R*(0.14+rng()*0.22), h: R*(0.025+rng()*0.035) });
    }
  } else if (kind === 'SUPERTERRA') {
    // Hestia: oceanos rasos, muitas ilhas, sem calotas polares
    const islandCount = 22 + Math.floor(rng()*16);
    for (let c = 0; c < islandCount; c++) {
      const cLat = (rng()-0.5)*Math.PI*0.95, cLon = rng()*Math.PI*2;
      const cSize = R*(0.10 + rng()*0.16);
      const circles = [];
      for (let i = 0; i < 5; i++) {
        circles.push({ dLat:(rng()-0.5)*(cSize/R)*0.8, dLon:(rng()-0.5)*(cSize/R)*1.1, size: cSize*(0.5+rng()*0.5) });
      }
      features.push({ type:'continent', cLat, cLon, circles });
    }
    // Muitos rios curtos
    for (let i = 0; i < 10; i++) {
      const pts = [];
      let lat = (rng()-0.5)*Math.PI*0.85, lon = rng()*Math.PI*2;
      for (let s = 0; s < 6; s++) { pts.push({lat, lon}); lat += (rng()-0.5)*0.2; lon += 0.12 + rng()*0.18; }
      features.push({ type:'river', pts, width: R*(0.02 + rng()*0.02) });
    }
    // Vegetação abundante (cor da vegetação local)
    for (let i = 0; i < 30; i++) {
      const lat = (rng()-0.5)*Math.PI*0.85, lon = rng()*Math.PI*2;
      features.push({ type:'grass', lat, lon, size:(0.05 + rng()*0.06)*R });
    }
    for (let i = 0; i < 8; i++) features.push({ type:'cloud',
      lat:(rng()-0.5)*Math.PI*0.9, lon: rng()*Math.PI*2,
      w: R*(0.18+rng()*0.24), h: R*(0.03+rng()*0.04) });
  } else if (kind === 'COMETA') {
    for (let i = 0; i < 8; i++) features.push({ type:'vent', lat:(rng()-0.5)*Math.PI*0.9, lon: rng()*Math.PI*2, size:(0.06+rng()*0.10)*R });
  }
  for (const f of features) {
    if (f.type === 'band') {
      const bandH = Math.max(3, Math.floor(R/8));
      const by = cy + f.relY*R;
      const alpha = f.alphaBase * (0.6 + 0.4*Math.abs(Math.sin(time*0.0004*f.alphaSpeed + f.phase)));
      gctx.fillStyle = 'rgba(0,0,0,'+alpha.toFixed(2)+')';
      gctx.fillRect(cx-R, Math.floor(by), R*2, bandH-1);
    } else if (f.type === 'spot') {
      const p = projectSphere(cx, cy, R, f.lat, f.lon + rotation);
      if (p.depth < 0.08) continue;
      const rx = Math.max(f.sizeX * p.scaleX, 1), ry = Math.max(f.sizeY * p.scaleY, 1);
      gctx.fillStyle = 'rgba(255,100,50,0.55)';
      gctx.beginPath(); gctx.ellipse(p.x, p.y, rx, ry, 0, 0, Math.PI*2); gctx.fill();
    } else if (f.type === 'crater') {
      const p = projectSphere(cx, cy, R, f.lat, f.lon + rotation);
      if (p.depth < 0.06) continue;
      const rx = Math.max(f.size * p.scaleX, 0.5), ry = Math.max(f.size * p.scaleY, 0.5);
      if (f.frozen) gctx.fillStyle = f.dark ? 'rgba(20,60,90,0.55)' : 'rgba(200,230,250,0.35)';
      else gctx.fillStyle = f.dark ? 'rgba(0,0,0,0.38)' : 'rgba(255,255,255,0.16)';
      gctx.beginPath(); gctx.ellipse(p.x, p.y, rx, ry, 0, 0, Math.PI*2); gctx.fill();
    } else if (f.type === 'lava') {
      const p = projectSphere(cx, cy, R, f.lat, f.lon + rotation);
      if (p.depth < 0.06) continue;
      const rx = Math.max(f.size * p.scaleX, 0.7), ry = Math.max(f.size * p.scaleY, 0.7);
      const flicker = 0.7 + 0.3*Math.sin(time*0.005 + f.lat*7);
      gctx.fillStyle = 'rgba(255,80,20,'+(0.55*flicker).toFixed(2)+')';
      gctx.beginPath(); gctx.ellipse(p.x, p.y, rx, ry, 0, 0, Math.PI*2); gctx.fill();
    } else if (f.type === 'volcano') {
      const p = projectSphere(cx, cy, R, f.lat, f.lon + rotation);
      if (p.depth < 0.08) continue;
      const pulse = 0.5 + 0.5*Math.sin(time*0.003 + f.phase);
      const gr = f.size * p.scaleX * (1 + pulse*0.6);
      const vg = gctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, gr);
      vg.addColorStop(0, 'rgba(255,200,80,'+(0.9*pulse).toFixed(2)+')');
      vg.addColorStop(0.5, 'rgba(255,80,20,'+(0.5*pulse).toFixed(2)+')');
      vg.addColorStop(1, 'rgba(255,40,0,0)');
      gctx.fillStyle = vg;
      gctx.beginPath(); gctx.arc(p.x, p.y, gr, 0, Math.PI*2); gctx.fill();
      gctx.fillStyle = 'rgba(80,20,10,0.85)';
      gctx.beginPath(); gctx.arc(p.x, p.y, f.size*p.scaleX*0.4, 0, Math.PI*2); gctx.fill();
    } else if (f.type === 'cryovolcano') {
      const p = projectSphere(cx, cy, R, f.lat, f.lon + rotation);
      if (p.depth < 0.08) continue;
      const pulse = 0.5 + 0.5*Math.sin(time*0.0025 + f.phase);
      const gr = f.size * p.scaleX * (1 + pulse*0.5);
      const vg = gctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, gr);
      vg.addColorStop(0,    'rgba(220,245,255,'+(0.90*pulse).toFixed(2)+')');
      vg.addColorStop(0.40, 'rgba(130,205,245,'+(0.55*pulse).toFixed(2)+')');
      vg.addColorStop(0.75, 'rgba(70,150,220,' +(0.28*pulse).toFixed(2)+')');
      vg.addColorStop(1,    'rgba(30,90,180,0)');
      gctx.fillStyle = vg;
      gctx.beginPath(); gctx.arc(p.x, p.y, gr, 0, Math.PI*2); gctx.fill();
      gctx.fillStyle = 'rgba(20,45,75,0.85)';
      gctx.beginPath(); gctx.arc(p.x, p.y, f.size*p.scaleX*0.45, 0, Math.PI*2); gctx.fill();
      gctx.fillStyle = 'rgba(240,250,255,'+(0.6+0.4*pulse).toFixed(2)+')';
      gctx.beginPath(); gctx.arc(p.x, p.y, f.size*p.scaleX*0.20, 0, Math.PI*2); gctx.fill();
    } else if (f.type === 'ridge') {
      // 1) Base da serra: stroke contínuo escuro (sombra)
      gctx.strokeStyle = 'rgba(30,20,12,0.92)';
      gctx.lineWidth = Math.max(2.4, f.size * 1.4);
      gctx.lineCap = 'round';
      gctx.lineJoin = 'round';
      gctx.beginPath();
      let started = false;
      for (const pt of f.pts) {
        const p = projectSphere(cx, cy, R, pt.lat, pt.lon + rotation);
        if (p.depth < 0.06) { started = false; continue; }
        if (!started) { gctx.moveTo(p.x, p.y); started = true; }
        else gctx.lineTo(p.x, p.y);
      }
      gctx.stroke();
      // 2) Picos triangulares ao longo da serra
      for (const pt of f.pts) {
        const p = projectSphere(cx, cy, R, pt.lat, pt.lon + rotation);
        if (p.depth < 0.06) continue;
        const sz = Math.max(3.0, f.size * p.scaleX * 1.15);
        // Triângulo escuro (silhueta)
        gctx.fillStyle = 'rgba(48,36,26,0.92)';
        gctx.beginPath();
        gctx.moveTo(p.x - sz, p.y + sz*0.35);
        gctx.lineTo(p.x + sz, p.y + sz*0.35);
        gctx.lineTo(p.x, p.y - sz*1.6);
        gctx.closePath(); gctx.fill();
        // Face iluminada (sol do lado esquerdo)
        gctx.fillStyle = 'rgba(120,95,70,0.55)';
        gctx.beginPath();
        gctx.moveTo(p.x - sz, p.y + sz*0.35);
        gctx.lineTo(p.x, p.y - sz*1.6);
        gctx.lineTo(p.x - sz*0.35, p.y - sz*0.35);
        gctx.closePath(); gctx.fill();
        // Neve no cume (só picos altos)
        if (sz > 2.5) {
          gctx.fillStyle = 'rgba(235,235,240,0.60)';
          gctx.beginPath();
          gctx.moveTo(p.x - sz*0.35, p.y - sz*0.9);
          gctx.lineTo(p.x + sz*0.35, p.y - sz*0.9);
          gctx.lineTo(p.x, p.y - sz*1.6);
          gctx.closePath(); gctx.fill();
        }
      }
    } else if (f.type === 'wave') {
      gctx.strokeStyle = 'rgba(245,205,140,0.80)';
      gctx.lineWidth = Math.max(0.7, f.size*1.15);
      gctx.beginPath();
      let started = false;
      for (const pt of f.pts) {
        const p = projectSphere(cx, cy, R, pt.lat, pt.lon + rotation);
        if (p.depth < 0.06) { started = false; continue; }
        if (!started) { gctx.moveTo(p.x, p.y); started = true; }
        else gctx.lineTo(p.x, p.y);
      }
      gctx.stroke();
    } else if (f.type === 'grass') {
      const p = projectSphere(cx, cy, R, f.lat, f.lon + rotation);
      if (p.depth < 0.06) continue;
      const sz = Math.max(1, Math.round(f.size * p.scaleX));
      gctx.fillStyle = 'rgba(60,110,50,0.75)';
      gctx.beginPath(); gctx.ellipse(p.x, p.y, sz, sz*0.65, 0, 0, Math.PI*2); gctx.fill();
      gctx.fillStyle = 'rgba(120,180,90,0.70)';
      gctx.beginPath(); gctx.ellipse(p.x - sz*0.3, p.y - sz*0.2, sz*0.45, sz*0.35, 0, 0, Math.PI*2); gctx.fill();
    } else if (f.type === 'volcanic_island') {
      const p = projectSphere(cx, cy, R, f.lat, f.lon + rotation);
      if (p.depth < 0.08) continue;
      const sz = Math.max(1, f.size * p.scaleX);
      const pulse = 0.45 + 0.55 * (0.5 + 0.5*Math.sin(time*0.004 + f.phase));
      const hr = sz * 1.9;
      const vg = gctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, hr);
      vg.addColorStop(0,    'rgba(255,220,120,'+(0.85*pulse).toFixed(2)+')');
      vg.addColorStop(0.30, 'rgba(255,110,40,' +(0.65*pulse).toFixed(2)+')');
      vg.addColorStop(0.65, 'rgba(190,50,15,'  +(0.35*pulse).toFixed(2)+')');
      vg.addColorStop(1,    'rgba(120,20,10,0)');
      gctx.fillStyle = vg;
      gctx.beginPath(); gctx.arc(p.x, p.y, hr, 0, Math.PI*2); gctx.fill();
      gctx.fillStyle = 'rgba(110,45,30,0.92)';
      gctx.beginPath(); gctx.ellipse(p.x, p.y, sz*1.05, sz*0.85, 0, 0, Math.PI*2); gctx.fill();
      gctx.fillStyle = 'rgba(150,60,35,0.85)';
      gctx.beginPath(); gctx.ellipse(p.x - sz*0.2, p.y - sz*0.15, sz*0.55, sz*0.45, 0, 0, Math.PI*2); gctx.fill();
      const cr = sz * 0.42;
      gctx.fillStyle = 'rgba(255,240,180,'+(0.75 + 0.25*pulse).toFixed(2)+')';
      gctx.beginPath(); gctx.arc(p.x, p.y, cr, 0, Math.PI*2); gctx.fill();
      gctx.fillStyle = 'rgba(255,160,60,'+(0.55*pulse).toFixed(2)+')';
      gctx.beginPath(); gctx.arc(p.x, p.y, cr*0.55, 0, Math.PI*2); gctx.fill();
    } else if (f.type === 'river') {
      gctx.strokeStyle = 'rgba(40,90,140,0.85)';
      gctx.lineWidth = Math.max(0.7, f.width);
      gctx.beginPath();
      let started = false;
      for (const pt of f.pts) {
        const p = projectSphere(cx, cy, R, pt.lat, pt.lon + rotation);
        if (p.depth < 0.05) { started = false; continue; }
        if (!started) { gctx.moveTo(p.x, p.y); started = true; }
        else gctx.lineTo(p.x, p.y);
      }
      gctx.stroke();
      gctx.strokeStyle = 'rgba(140,200,240,0.5)';
      gctx.lineWidth = Math.max(0.4, f.width * 0.4);
      gctx.beginPath(); started = false;
      for (const pt of f.pts) {
        const p = projectSphere(cx, cy, R, pt.lat+0.01, pt.lon + rotation);
        if (p.depth < 0.05) { started = false; continue; }
        if (!started) { gctx.moveTo(p.x, p.y); started = true; }
        else gctx.lineTo(p.x, p.y);
      }
      gctx.stroke();
    } else if (f.type === 'continent' || f.type === 'lake') {
      const color = f.type === 'continent' ? '#7a5a3a' : '#2a4a5a';
      for (let i = 0; i < f.circles.length; i++) {
        const c = f.circles[i];
        const p = projectSphere(cx, cy, R, f.cLat + c.dLat, f.cLon + c.dLon + rotation);
        if (p.depth < 0.05) continue;
        const rx = Math.max(c.size * p.scaleX, 0.7), ry = Math.max(c.size * p.scaleY, 0.7);
        gctx.fillStyle = color;
        gctx.beginPath(); gctx.ellipse(p.x, p.y, rx, ry, 0, 0, Math.PI*2); gctx.fill();
      }
    } else if (f.type === 'cloud') {
      const p = projectSphere(cx, cy, R, f.lat, f.lon + rotation);
      if (p.depth < 0.05) continue;
      const rx = Math.max(f.w * p.scaleX, 0.7), ry = Math.max(f.h * p.scaleY, 0.5);
      gctx.fillStyle = 'rgba(230,210,180,0.24)';
      gctx.beginPath(); gctx.ellipse(p.x, p.y, rx, ry, 0, 0, Math.PI*2); gctx.fill();
    } else if (f.type === 'vent') {
      const p = projectSphere(cx, cy, R, f.lat, f.lon + rotation);
      if (p.depth < 0.06) continue;
      const rx = Math.max(f.size * p.scaleX, 0.6), ry = Math.max(f.size * p.scaleY, 0.6);
      const jitter = 0.4 + 0.5*Math.sin(time*0.008 + f.lat*5);
      gctx.fillStyle = 'rgba(180,240,255,'+(0.7*jitter).toFixed(2)+')';
      gctx.beginPath(); gctx.ellipse(p.x, p.y, rx, ry, 0, 0, Math.PI*2); gctx.fill();
    } else if (f.type === 'redspot') {
      const spotX = cx + R*0.48, spotY = cy;
      const spotR = R*0.38;
      const rg = gctx.createRadialGradient(spotX, spotY, 0, spotX, spotY, spotR);
      rg.addColorStop(0,   'rgba(220,75,55,0.72)');
      rg.addColorStop(0.5, 'rgba(180,45,35,0.45)');
      rg.addColorStop(1,   'rgba(120,30,20,0)');
      gctx.fillStyle = rg;
      gctx.beginPath(); gctx.arc(spotX, spotY, spotR, 0, Math.PI*2); gctx.fill();
      const rg2 = gctx.createRadialGradient(spotX, spotY, 0, spotX, spotY, spotR*0.4);
      rg2.addColorStop(0, 'rgba(255,140,90,0.55)');
      rg2.addColorStop(1, 'rgba(220,80,50,0)');
      gctx.fillStyle = rg2;
      gctx.beginPath(); gctx.arc(spotX, spotY, spotR*0.4, 0, Math.PI*2); gctx.fill();
    } else if (f.type === 'terminator') {
      const nightAlpha = f.nightT < 150 ? 0.85 : f.nightT < 250 ? 0.6 : 0.35;
      const grad = gctx.createLinearGradient(cx - R, 0, cx + R, 0);
      grad.addColorStop(0, 'rgba(0,0,0,'+nightAlpha.toFixed(2)+')');
      grad.addColorStop(0.42, 'rgba(0,0,0,'+nightAlpha.toFixed(2)+')');
      grad.addColorStop(0.62, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      gctx.fillStyle = grad;
      gctx.fillRect(cx-R, cy-R, R*2, R*2);
      if (f.dayT > 700) {
        const hotGrad = gctx.createRadialGradient(cx + R*0.5, cy, 0, cx + R*0.5, cy, R*0.8);
        hotGrad.addColorStop(0, 'rgba(255,180,80,0.75)');
        hotGrad.addColorStop(0.4, 'rgba(255,80,20,0.35)');
        hotGrad.addColorStop(1, 'rgba(0,0,0,0)');
        gctx.fillStyle = hotGrad;
        gctx.beginPath(); gctx.arc(cx + R*0.5, cy, R*0.8, 0, Math.PI*2); gctx.fill();
      }
    }
  }
  if (kind === 'GELADO' || rockySub === 'GLACIAL') {
    gctx.fillStyle = 'rgba(255,255,255,0.78)';
    gctx.beginPath(); gctx.ellipse(cx, cy - R*0.85, R*0.55, R*0.16, 0, 0, Math.PI*2); gctx.fill();
    gctx.beginPath(); gctx.ellipse(cx, cy + R*0.85, R*0.55, R*0.16, 0, 0, Math.PI*2); gctx.fill();
  } else if (kind === 'TERRA') {
    gctx.fillStyle = 'rgba(240,240,235,0.85)';
    gctx.beginPath(); gctx.ellipse(cx, cy - R*0.92, R*0.34, R*0.11, 0, 0, Math.PI*2); gctx.fill();
    gctx.beginPath(); gctx.ellipse(cx, cy + R*0.92, R*0.34, R*0.11, 0, 0, Math.PI*2); gctx.fill();
  }
  const grad = gctx.createLinearGradient(cx - R, cy, cx + R, cy);
  grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(0.50, 'rgba(0,0,0,0)');
  grad.addColorStop(0.88, 'rgba(0,0,0,0.55)'); grad.addColorStop(1, 'rgba(0,0,0,0.85)');
  gctx.fillStyle = grad; gctx.fillRect(cx-R, cy-R, R*2, R*2);
  gctx.restore();
  if (planet.hasRings) drawRingsOrbit(cx, cy, R, planet, false);
  const borderColor = (kind === 'TERRA') ? '#4a8aa8' : planet.color;
  gctx.strokeStyle = borderColor; gctx.lineWidth = 1;
  gctx.beginPath(); gctx.arc(cx, cy, R, 0, Math.PI*2); gctx.stroke();
}

// HUDs e painéis (mantidos encurtados — idênticos em essência ao )
function drawOrbitHUD(time) {
  if (!orbitState) return;
  const { planet, sys } = orbitState;
  const sysName = getDisplayName(sys).split('-')[0];
  const sciName = sysName + '-' + planet.letter;
  const kind = getPlanetVisualKind(planet);
  let kindTag = '';
  if (kind === 'TERRA') kindTag = ' ★TERRA';
  else if (kind === 'OCEANICO') kindTag = ' ~ÁGUA';
  else if (kind === 'MOLTEN') kindTag = ' 🔥';

  uctx.textAlign = 'center';
  uctx.font = 'bold 10px "DejaVu Sans Mono", monospace';
  uctx.fillStyle = PALETTE.near[3];
  uctx.fillText(sciName + '  ·  ' + planet.epithet, BASE_W/2, 12);
  uctx.font = '6px "DejaVu Sans Mono", monospace';
  uctx.fillStyle = PALETTE.hud;
  uctx.fillText(getPlanetDescriptor(planet) + kindTag, BASE_W/2, 21);
  uctx.textAlign = 'left';
  uctx.font = '5px "DejaVu Sans Mono", monospace';
  uctx.fillStyle = PALETTE.hud;
  const pcLabel = (PLANET_CLASSES[planet.planetClass] || { label: planet.type }).label;
  uctx.fillText('CLASSE ' + pcLabel + kindTag, 6, BASE_H - 48);
  // Tarja de habitabilidade (verde/alto, amarelo/médio, vermelho/baixo)
  if (planet.habitability > 0) {
    const barColor = planet.habitability >= 75 ? PALETTE.ok
                   : planet.habitability >= 40 ? '#ffd070'
                   :                             '#ff6060';
    uctx.fillStyle = barColor;
    uctx.fillRect(6, BASE_H - 62, 60 * (planet.habitability / 100), 2);
    uctx.strokeStyle = barColor;
    uctx.lineWidth = 0.5;
    uctx.strokeRect(6.5, BASE_H - 62.5, 59, 3);
  }
  uctx.fillText('ÓRBITA ' + planet.distanceAU + ' UA', 6, BASE_H - 41);
  if (planet.tidalLocked) {
    uctx.fillText('T.DIA  ' + planet.temperatureDay + ' K', 6, BASE_H - 34);
    uctx.fillText('T.NOIT ' + planet.temperatureNight + ' K', 6, BASE_H - 27);
  } else {
    uctx.fillText('T.EQ   ' + planet.temperatureEq + ' K', 6, BASE_H - 34);
    uctx.fillText('ATMOS  ' + planet.atmosphere.name, 6, BASE_H - 27);
  }
  uctx.fillText('HABIT  ' + planet.habitability + '%', 6, BASE_H - 20);
  uctx.fillText('LUAS   ' + (planet.moons.length === 0 ? '—' : planet.moons.map(m => m.name).join(', ')), 6, BASE_H - 13);
  uctx.textAlign = 'right';
  uctx.fillStyle = PALETTE.hud;
  uctx.fillText('SISTEMA ' + getDisplayName(sys), BASE_W - 6, BASE_H - 48);
  uctx.fillText('CLASSE  ' + sys.starType + ' ' + sys.lumClass, BASE_W - 6, BASE_H - 41);
  uctx.fillText('TEMP    ' + sys.temperature + ' K', BASE_W - 6, BASE_H - 34);
  uctx.fillText('MASSA   ' + sys.mass.toFixed(2) + ' M☉', BASE_W - 6, BASE_H - 27);
  uctx.fillText('GALÁXIA ' + (currentGalaxy ? currentGalaxy.name : '—'), BASE_W - 6, BASE_H - 20);
  uctx.textAlign = 'center';
  uctx.font = '6px "DejaVu Sans Mono", monospace';
  if (canLandOn(planet)) {
    uctx.fillStyle = PALETTE.ok;
    uctx.fillText('[ENTER] POUSAR  ·  [ESC] RETORNAR AO SISTEMA', BASE_W/2, BASE_H - 2);
  } else {
    uctx.fillStyle = PALETTE.hudDim;
    uctx.fillText('SEM SOLO SÓLIDO  ·  [ESC] RETORNAR AO SISTEMA', BASE_W/2, BASE_H - 2);
  }
}

function drawTelescopeView(time) {
  if (!telescopeState) return;
  const { sys, selectedIndex, blend } = telescopeState;
  if (sys.planets.length === 0) return;
  const planet = sys.planets[selectedIndex];
  gctx.fillStyle = 'rgba(0,0,0,'+(0.55*blend).toFixed(2)+')';
  gctx.fillRect(0, 0, BASE_W, BASE_H);
  const cx = BASE_W/2, cy = 82, visorR = 58;
  gctx.save(); gctx.beginPath(); gctx.arc(cx, cy, visorR*blend, 0, Math.PI*2); gctx.clip();
  gctx.fillStyle = '#000'; gctx.fillRect(cx-visorR, cy-visorR, visorR*2, visorR*2);
  const rng = mulberry32(hash2D(selectedIndex*31, sys.cx*17, activeSeed() ^ 0x7E1E));
  for (let i = 0; i < 60; i++) {
    const sx = cx - visorR + rng()*visorR*2, sy = cy - visorR + rng()*visorR*2;
    const sz = rng() < 0.15 ? 1.5 : 1;
    gctx.fillStyle = rng() < 0.7 ? 'rgba(255,200,150,0.8)' : 'rgba(255,255,255,0.6)';
    gctx.fillRect(Math.floor(sx), Math.floor(sy), Math.ceil(sz), Math.ceil(sz));
  }
  const planetR = Math.max(2, Math.round(Math.min(visorR*0.78, 24 + planet.size*4) * blend));
  drawPlanetBody(planet, cx, cy, planetR, time);
  const scanY = cy - visorR + ((time*0.06) % (visorR*2));
  gctx.fillStyle = 'rgba(255,180,100,0.18)';
  gctx.fillRect(cx-visorR, scanY, visorR*2, 1);
  gctx.restore();
  gctx.strokeStyle = 'rgba(255,180,100,0.9)'; gctx.lineWidth = 1;
  gctx.beginPath(); gctx.arc(cx, cy, visorR*blend, 0, Math.PI*2); gctx.stroke();
}

function drawTelescopeHUD(time) {
  if (!telescopeState) return;

  const planet = sys.planets[selectedIndex];
  const sysName = getDisplayName(sys).split('-')[0];

  uctx.font = '6px "DejaVu Sans Mono", monospace';
  uctx.fillStyle = PALETTE.hud;

  uctx.textAlign = 'center';
  uctx.font = '6px "DejaVu Sans Mono", monospace';

// SUPERFÍCIE (idêntica ao anterior, com rios)
function terrainNoise(seed, x, octaves) {
  let h = 0, amp = 1, freq = 1, total = 0;

    else if (detailType === 'ice') { gctx.fillRect(Math.floor(x), Math.floor(y-s*2), 1, Math.floor(s*2)); gctx.fillStyle = 'rgba(255,255,255,0.6)'; gctx.fillRect(Math.floor(x), Math.floor(y-s*2), 1, 1); }
    else if (detailType === 'lava') { const flick = 0.5 + 0.5*Math.sin(time*0.006 + x*0.3); gctx.fillStyle = 'rgba(255,110,30,'+(0.5 + flick*0.3).toFixed(2)+')'; gctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(s), 1); }
    else if (detailType === 'water') gctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(s*2), 1);
  }
  const vg = gctx.createRadialGradient(BASE_W/2, BASE_H/2, 40, BASE_W/2, BASE_H/2, 200);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.4)');
  gctx.fillStyle = vg; gctx.fillRect(0, 0, BASE_W, BASE_H);
  if (blend < 1) { gctx.fillStyle = 'rgba(0,0,0,'+(1-blend).toFixed(2)+')'; gctx.fillRect(0, 0, BASE_W, BASE_H); }
}

// LABELS
function drawSystemLabel(sys, dist, time) {
  const geo = getSystemGeometry(sys, dist);
  const { sx, sy, isFocused, normalZoom, finalStarSize } = geo;
  if (sx < -60 || sx > BASE_W+60 || sy < -60 || sy > BASE_H+60) return;
  const showName = isFocused ? focusBlend > 0.3 : normalZoom > 0.55;
  if (showName) {
    const isVisited = visited.has(sysKey(sys));
    uctx.font = '6px "DejaVu Sans Mono", monospace';
    uctx.textAlign = 'center';
    let nmColor, tag, tagColor;
    if (sys.isSupermassive) { nmColor = '#ffe0a0'; tag = 'SMBH'; tagColor = 'rgba(255,200,120,0.85)'; }
    else if (sys.isBlackHole) { nmColor = PALETTE.blackhole; tag = 'BURACO NEGRO'; tagColor = 'rgba(255,140,60,0.7)'; }
    else if (sys.isNeutronStar) { nmColor = PALETTE.neutronGlow; tag = 'PULSAR'; tagColor = 'rgba(150,190,255,0.7)'; }
    else if (sys.isWhiteDwarf) { nmColor = PALETTE.whitedwarf; tag = 'ANÃ BRANCA'; tagColor = 'rgba(200,220,255,0.7)'; }
    else if (sys.isBrownDwarf) { nmColor = PALETTE.brownDwarf; tag = 'ANÃ MARROM ' + sys.starType; tagColor = 'rgba(200,120,100,0.75)'; }
    else if (sys.isRogue) { nmColor = PALETTE.rogue; tag = 'ÓRFÃO'; tagColor = 'rgba(180,200,220,0.7)'; }
    else { nmColor = isVisited ? PALETTE.near[3] : PALETTE.hud; tag = sys.starType + sys.lumClass + (sys.companion ? ' +B' : ''); tagColor = PALETTE.hudDim; }
    uctx.fillStyle = nmColor;
    uctx.fillText(getDisplayName(sys), sx, sy - finalStarSize - 6);
    uctx.fillStyle = tagColor;
    uctx.fillText(tag, sx, sy - finalStarSize - 12);
  }
  const showP = isFocused ? focusBlend > 0.05 : normalZoom > 0.4;
  if (showP && isFocused && focusBlend > 0.6 && !sys.isBlackHole && !sys.isRogue) {
    for (const p of sys.planets) {
      const a = p.phase + time*0.001*p.speed;
      const r = p.distance * geo.orbitScale;
      const px = sx + Math.cos(a)*r, py = sy + Math.sin(a)*r*0.4;
      const ps = Math.max(2, Math.round(p.size * geo.orbitScale));
      uctx.font = '5px "DejaVu Sans Mono", monospace';
      uctx.textAlign = 'center';
      uctx.fillStyle = PALETTE.hud;
      uctx.fillText(p.letter.toUpperCase() + ' ' + p.epithet, px, py - ps - 2);
    }
  }
}

function drawFocusPanel() {
  if (!focusedSystem || focusBlend < 0.5) return;
  const sys = focusedSystem;
  const isSMBH = sys.isSupermassive, isBH = sys.isBlackHole && !isSMBH, isRG = sys.isRogue;
  const PANEL_W = 118;
  let HEADER_H = isSMBH ? 66 : isBH ? 60 : isRG ? 48 : 48;
  const PLANET_H = 12, PADDING_BOT = 6;
  const planetsCount = Math.max(1, sys.planets.length);
  const PANEL_H = HEADER_H + ((isSMBH || isBH || isRG) && sys.planets.length === 0 ? 6 : planetsCount*PLANET_H) + PADDING_BOT;
  const x = BASE_W - PANEL_W - 4;
  const y = 34;
  const finalY = (y + PANEL_H > BASE_H - 10) ? (BASE_H - PANEL_H - 10) : y;
  uctx.fillStyle = 'rgba(0,0,0,0.80)'; uctx.fillRect(x, finalY, PANEL_W, PANEL_H);
  uctx.strokeStyle = isSMBH ? 'rgba(255,200,120,0.85)' : isBH ? 'rgba(255,80,30,0.75)' : isRG ? 'rgba(150,170,190,0.6)' : 'rgba(255,140,26,0.6)';
  uctx.lineWidth = 0.5; uctx.strokeRect(x+0.5, finalY+0.5, PANEL_W-1, PANEL_H-1);
  uctx.textAlign = 'left';
  uctx.font = 'bold 7px "DejaVu Sans Mono", monospace';
  uctx.fillStyle = isSMBH ? '#ffe0a0' : isBH ? PALETTE.blackhole : isRG ? PALETTE.rogue : PALETTE.hud;
  uctx.fillText(getDisplayName(sys), x+3, finalY+9);
  uctx.font = '5px "DejaVu Sans Mono", monospace';
  uctx.fillStyle = PALETTE.hud;
  let cy = finalY + 15;
  if (isSMBH) {
    uctx.fillText('SMBH massa ' + (sys.mass/1e6).toFixed(1) + '×10⁶ M☉', x+3, cy); cy += 6;
    uctx.fillText('R.SCHW  ' + sys.schwarzschild.toFixed(1) + ' ×10⁶ km', x+3, cy); cy += 6;
  } else if (isBH) {
    uctx.fillText('BH massa ' + sys.mass.toFixed(2) + ' M☉', x+3, cy); cy += 6;
  } else if (isRG) {
    uctx.fillText('ÓRFÃO · ' + sys.planets.length + ' planetas', x+3, cy); cy += 6;
  } else {
    uctx.fillText('Classe ' + sys.starType + sys.lumClass + ' · ' + sys.temperature + 'K', x+3, cy); cy += 6;
    uctx.fillText('Massa  ' + sys.mass.toFixed(2) + ' M☉ · R ' + sys.radius.toFixed(2), x+3, cy); cy += 6;
    uctx.fillText('Planetas: ' + sys.planets.length, x+3, cy); cy += 6;
    // Hierarquia (sistemas múltiplos)
    if (sys.hierarchyLevel && sys.hierarchyLevel > 0) {
      let hInfo = 'Sist. ' + ['single','binário','triplo','múltiplo'][Math.min(3, sys.hierarchyLevel)];
      if (sys.companion) {
        let cTag = sys.companion.starType;
        if (sys.companion.isBrownDwarf) cTag = 'BD';
        else if (sys.companion.isNeutronStar) cTag = 'NS';
        else if (sys.companion.isBlackHole) cTag = 'BH';
        hInfo += ' +' + cTag;
      }
      uctx.fillStyle = '#ffd070';
      uctx.fillText(hInfo, x+3, cy); cy += 6;
    }
  }
  let yy = finalY + HEADER_H + 4;
  for (let i = 0; i < sys.planets.length; i++) {
    const p = sys.planets[i];
    uctx.fillStyle = p.color;
    uctx.beginPath(); uctx.arc(x+6, yy-2, 1.6, 0, Math.PI*2); uctx.fill();
    uctx.fillStyle = PALETTE.near[3];
    uctx.font = '5px "DejaVu Sans Mono", monospace';
    uctx.fillText(getDisplayName(sys).split('-')[0] + '-' + p.letter, x+11, yy);
    uctx.fillStyle = PALETTE.hudDim;
    uctx.fillText(p.epithet + ' ' + p.distanceAU + 'UA', x+11, yy+5);
    yy += PLANET_H;
  }
}

function drawStarMap(time, L) {
  uctx.fillStyle = 'rgba(0,0,0,0.85)';
  uctx.fillRect(0, 0, BASE_W, BASE_H);
  uctx.strokeStyle = 'rgba(255,140,26,0.7)'; uctx.lineWidth = 0.5;
  uctx.strokeRect(L.x0-0.5, L.y0-0.5, L.w+1, L.h+1);
  uctx.strokeStyle = 'rgba(255,140,26,0.08)';
  let gridStep = 250; { const sc0 = Math.min(L.w, L.h)/(2*getMapRadius()); while (gridStep*sc0 < 10) gridStep *= 4; }
  const radius = getMapRadius();
  const sgX = Math.floor((mapCenter.x - radius)/gridStep) * gridStep;
  const sgY = Math.floor((mapCenter.y - radius)/gridStep) * gridStep;
  for (let gx = sgX; gx <= mapCenter.x + radius; gx += gridStep) {
    const { mx } = worldToMap(gx, mapCenter.y);
    if (mx < L.x0 || mx > L.x0+L.w) continue;
    uctx.beginPath(); uctx.moveTo(mx, L.y0); uctx.lineTo(mx, L.y0+L.h); uctx.stroke();
  }
  for (let gy = sgY; gy <= mapCenter.y + radius; gy += gridStep) {
    const { my } = worldToMap(mapCenter.x, gy);
    if (my < L.y0 || my > L.y0+L.h) continue;
    uctx.beginPath(); uctx.moveTo(L.x0, my); uctx.lineTo(L.x0+L.w, my); uctx.stroke();
  }
  uctx.save();
  uctx.beginPath(); uctx.rect(L.x0, L.y0, L.w, L.h); uctx.clip();
  let starAlpha = 1;
  if (currentGalaxy) {                       // a galáxia "aparece" por baixo ao afastar o zoom
    const er = explorationRadius(), ua = clamp((radius/er - 1.15) / 0.6, 0, 1);
    if (ua > 0) {
      const c = worldToMap(0, 0), vr = er * c.scale, art = getGalaxyArt(currentGalaxy, vr), s = vr*2*ART_SPAN;
      if (art) { uctx.globalAlpha = ua*0.95; uctx.drawImage(art, c.mx - s/2, c.my - s/2, s, s); }
      starAlpha = 1 - 0.55*ua;
    }
  }
  uctx.globalAlpha = starAlpha;

  // -------- Ramps de fade entre stipple e sistemas individuais --------
  // Evita o "pop" abrupto quando o usuário cruza o limiar.
  const stippleAlpha = clamp((radius - 3000) / 5000, 0, 1);
  const sysAlpha     = clamp((12000 - radius) / 6000, 0, 1);
  const denseView    = radius > 6500;

  // -------- Camada de stipple em WORLD SPACE (LOD travado + hex offset) --------
  // O step é travado em potências de 2 de SYSTEM_RADIUS, para que a grade
  // NÃO mude continuamente ao dar zoom (era a causa do flicker).
  if (stippleAlpha > 0.01) {
    const LOD_MULS = [3, 6, 12, 24, 48, 96, 192, 384, 768];
    const rawStep = Math.max(SYSTEM_RADIUS * 3, radius / 55);
    let stepMul = LOD_MULS[0];
    for (const m of LOD_MULS) { if (SYSTEM_RADIUS * m <= rawStep) stepMul = m; }
    const step = SYSTEM_RADIUS * stepMul;
    const sc0 = Math.min(L.w, L.h) / (2 * radius);
    const gx0 = Math.floor((mapCenter.x - radius * 1.15) / step);
    const gx1 = Math.floor((mapCenter.x + radius * 1.15) / step);
    const gy0 = Math.floor((mapCenter.y - radius * 1.15) / step);
    const gy1 = Math.floor((mapCenter.y + radius * 1.15) / step);
    const nearColors = PALETTE.near;
    const seedStipple = activeSeed() ^ 0xDE7517;
    const brightnessThreshold = clamp(0.45 + (radius / explorationRadius()) * 0.55, 0.45, 1.15);
    for (let gy = gy0; gy <= gy1; gy++) {
      // Offset hexagonal: linhas ímpares deslocam meia célula — quebra moiré
      const rowOff = (gy & 1) ? step * 0.5 : 0;
      for (let gx = gx0; gx <= gx1; gx++) {
        // Jitter sub-celular determinístico (world-space): quebra grade
        const jx = ((hash2D(gx, gy, seedStipple ^ 0x1111) / 0xFFFFFFFF) - 0.5) * step * 0.85;
        const jy = ((hash2D(gx, gy, seedStipple ^ 0x2222) / 0xFFFFFFFF) - 0.5) * step * 0.85;
        const wx = (gx + 0.5) * step + rowOff + jx;
        const wy = (gy + 0.5) * step + jy;
        const p = starDensityAt(wx, wy);
        if (p <= 0.001) continue;
        const hh = hash2D(gx, gy, seedStipple) / 0xFFFFFFFF;
        if (hh > p) continue;
        const bright = hash2D(gx, gy, seedStipple ^ 0xB1) / 0xFFFFFFFF;
        if (bright * brightnessThreshold < 0.5) continue;
        const mx = L.cx + (wx - mapCenter.x) * sc0;
        const my = L.cy + (wy - mapCenter.y) * sc0;
        if (mx < L.x0 || mx > L.x0 + L.w || my < L.y0 || my > L.y0 + L.h) continue;
        // Variação de brilho por hash — mais natural
        const cIdx = Math.floor((hh * 31) % nearColors.length);
        uctx.globalAlpha = starAlpha * stippleAlpha * (0.55 + 0.45 * bright);
        uctx.fillStyle = nearColors[cIdx];
        uctx.fillRect(Math.round(mx), Math.round(my), 1, 1);
      }
    }
    uctx.globalAlpha = starAlpha;
  }

  // -------- Sistemas individuais (fade-out conforme afasta) --------
  if (sysAlpha > 0.01) for (const sys of getSystemsForMap()) {
    if (!systemMatchesFilter(sys)) continue;
    const { mx, my } = worldToMap(sys.worldX, sys.worldY);
    if (mx < L.x0-4 || mx > L.x0+L.w+4 || my < L.y0-4 || my > L.y0+L.h+4) continue;
    const isVisited = visited.has(sysKey(sys));
    const isSelected = (mapSelected === sys);
    const isHovered = (mapHovered === sys);
    const isWaypoint = waypointKey === sysKey(sys);
    const isSpecial = sys.isSupermassive || sys.isBlackHole || sys.isNeutronStar
                   || sys.isWhiteDwarf || sys.isBrownDwarf || sys.isRogue;
    if (denseView && !isSpecial && !isSelected && !isHovered && !isWaypoint && !isVisited) {
      continue;
    }
    uctx.globalAlpha = starAlpha * (isSpecial ? 1 : sysAlpha);
    if (sys.isSupermassive) {
      const pulse = 3 + Math.sin(time*0.006);
      uctx.fillStyle = '#ffe0a0';
      uctx.beginPath(); uctx.arc(mx, my, pulse, 0, Math.PI*2); uctx.fill();
      uctx.strokeStyle = '#fff'; uctx.lineWidth = 0.5;
      uctx.beginPath(); uctx.arc(mx, my, pulse+1.5, 0, Math.PI*2); uctx.stroke();
    } else if (sys.isBlackHole) {
      uctx.strokeStyle = isVisited ? PALETTE.blackhole : 'rgba(255,80,30,0.7)'; uctx.lineWidth = 0.8;
      uctx.beginPath(); uctx.moveTo(mx-2, my); uctx.lineTo(mx+2, my); uctx.moveTo(mx, my-2); uctx.lineTo(mx, my+2); uctx.stroke();
    } else if (sys.isNeutronStar) {
      uctx.fillStyle = isVisited ? PALETTE.neutron : 'rgba(150,190,255,0.8)';
      uctx.beginPath(); uctx.moveTo(mx, my-2.2); uctx.lineTo(mx+2.2, my); uctx.lineTo(mx, my+2.2); uctx.lineTo(mx-2.2, my); uctx.closePath(); uctx.fill();
    } else if (sys.isRogue) {
      uctx.strokeStyle = isVisited ? PALETTE.rogue : 'rgba(140,160,180,0.6)'; uctx.lineWidth = 0.6;
      uctx.beginPath(); uctx.arc(mx, my, 1.5, 0, Math.PI*2); uctx.stroke();
    } else if (sys.isBrownDwarf) {
      uctx.fillStyle = isVisited ? PALETTE.brownDwarf : 'rgba(160,80,60,0.7)';
      uctx.beginPath(); uctx.arc(mx, my, 1.3, 0, Math.PI*2); uctx.fill();
    } else if (isVisited) {
      uctx.fillStyle = sys.isWhiteDwarf ? PALETTE.whitedwarf : starColorFor(sys);
      uctx.beginPath(); uctx.arc(mx, my, 1.6, 0, Math.PI*2); uctx.fill();
    } else {
      uctx.strokeStyle = starColorFor(sys) + 'aa'; uctx.lineWidth = 0.7;
      uctx.beginPath(); uctx.arc(mx, my, 1.4, 0, Math.PI*2); uctx.stroke();
    }
    if (isHovered && !isSelected) { uctx.strokeStyle = PALETTE.hudDim; uctx.lineWidth = 0.6; uctx.beginPath(); uctx.arc(mx, my, 3.5, 0, Math.PI*2); uctx.stroke(); }
    if (isWaypoint) { uctx.strokeStyle = PALETTE.waypoint; uctx.lineWidth = 0.7; uctx.beginPath(); uctx.arc(mx, my, 4.5, 0, Math.PI*2); uctx.stroke(); }
    if (isSelected) { const pulse = 4 + Math.sin(time*0.008)*0.8; uctx.strokeStyle = PALETTE.near[3]; uctx.lineWidth = 0.8; uctx.beginPath(); uctx.arc(mx, my, pulse, 0, Math.PI*2); uctx.stroke(); }
  }
  uctx.globalAlpha = 1;
  const shipPos = worldToMap(ship.x, ship.y);
  if (shipPos.mx > L.x0 && shipPos.mx < L.x0+L.w && shipPos.my > L.y0 && shipPos.my < L.y0+L.h) {
    uctx.fillStyle = PALETTE.near[3];
    uctx.beginPath(); uctx.moveTo(shipPos.mx, shipPos.my-3); uctx.lineTo(shipPos.mx-2, shipPos.my+2); uctx.lineTo(shipPos.mx+2, shipPos.my+2); uctx.closePath(); uctx.fill();
  }
  uctx.restore();
  const infoSys = mapSelected || mapHovered;
  if (infoSys) {
    const d = Math.hypot(infoSys.worldX - ship.x, infoSys.worldY - ship.y);
    uctx.font = '6px "DejaVu Sans Mono", monospace';
    uctx.textAlign = 'left';
    uctx.fillStyle = PALETTE.near[3];
    uctx.fillText(getDisplayName(infoSys), L.x0+2, L.y0+L.h+8);
    uctx.fillStyle = PALETTE.hud;
    uctx.fillText('T' + infoSys.starType + '  ' + (infoSys.temperature || 0) + 'K  · ' + infoSys.planets.length + 'PL · ' + d.toFixed(0) + 'u', L.x0+2, L.y0+L.h+15);
    uctx.textAlign = 'right';
    if (mapSelected === infoSys) { uctx.fillStyle = PALETTE.near[3]; uctx.fillText('[ENTER] WARP', L.x0+L.w-2, L.y0+L.h+8); }
  }
}

function drawGalaxyMap(time, L) {
  uctx.fillStyle = 'rgba(0,2,5,0.95)';
  uctx.fillRect(0, 0, BASE_W, BASE_H);
  uctx.strokeStyle = 'rgba(180,200,255,0.55)'; uctx.lineWidth = 0.5;
  uctx.strokeRect(L.x0-0.5, L.y0-0.5, L.w+1, L.h+1);
  const radius = getMapRadius();
  uctx.save();
  uctx.beginPath(); uctx.rect(L.x0, L.y0, L.w, L.h); uctx.clip();
  const gl = galaxiesInView(galaxyCenter, radius*1.2);
  if (!gl._sorted) gl._sorted = gl.slice().sort((a, b) => b.radius - a.radius);   // grandes embaixo
  const { scale } = galaxyWorldToMap(galaxyCenter.x, galaxyCenter.y);
  for (const g of gl._sorted) {
    if (!galaxyMatchesFilter(g)) continue;
    const { mx, my } = galaxyWorldToMap(g.ux, g.uy);
    const vr = g.radius * scale, ext = vr*ART_SPAN;
    if (mx < L.x0 - ext || mx > L.x0 + L.w + ext || my < L.y0 - ext || my > L.y0 + L.h + ext) continue;
    const colors = PALETTE.galaxy[g.type] || PALETTE.galaxy.espiral;
    if (vr < 1.0) { uctx.globalAlpha = 0.9; uctx.fillStyle = colors[1]; uctx.fillRect(mx - 0.4, my - 0.4, 0.8, 0.8); }
    else if (vr < 7) drawGalaxyGlyph(g, mx, my, vr, colors);
    else {
      const art = getGalaxyArt(g, vr);
      if (art) { const s = vr*2*ART_SPAN; uctx.globalAlpha = 1; uctx.drawImage(art, mx - s/2, my - s/2, s, s); }
      else drawGalaxyGlyph(g, mx, my, vr, colors);
    }
    uctx.globalAlpha = 1;
    const isCurrent = (g === currentGalaxy), isSelected = (g === selectedGalaxy), isHovered = (g === hoveredGalaxy);
    const base = Math.max(5, vr*1.05);
    if (g.isQuasar) {
      // Brilho lento e discreto, tipo estrela variável — não pisca como árvore de Natal
      const ph = time*0.0006 + g.ucx*7 + g.ucy*13;
      const glowA = 0.14 + 0.30 * (0.5 + 0.5*Math.sin(ph));
      const glowR = base + 2.0 + Math.sin(ph*1.3)*0.8;
      uctx.strokeStyle = 'rgba(255,245,190,'+glowA.toFixed(3)+')'; uctx.lineWidth = 0.7;
      uctx.beginPath(); uctx.arc(mx, my, glowR, 0, Math.PI*2); uctx.stroke();
      uctx.strokeStyle = 'rgba(255,240,180,'+(glowA*0.35).toFixed(3)+')'; uctx.lineWidth = 0.4;
      uctx.beginPath(); uctx.arc(mx, my, glowR+2.5, 0, Math.PI*2); uctx.stroke();
    }
    if (isCurrent) {
      const pulse = base + Math.sin(time*0.006)*1.2;
      uctx.strokeStyle = '#ffe0a0'; uctx.lineWidth = 0.7;
      uctx.beginPath(); uctx.arc(mx, my, pulse, 0, Math.PI*2); uctx.stroke();
      uctx.beginPath(); uctx.arc(mx, my, pulse+3, 0, Math.PI*2); uctx.stroke();
    }
    if (isSelected && !isCurrent) {
      uctx.strokeStyle = '#ffffff'; uctx.lineWidth = 0.8;
      uctx.beginPath(); uctx.arc(mx, my, base + 1 + Math.sin(time*0.008)*0.9, 0, Math.PI*2); uctx.stroke();
    }
    if (isHovered && !isSelected && !isCurrent) {
      uctx.strokeStyle = 'rgba(255,220,160,0.7)'; uctx.lineWidth = 0.5;
      uctx.beginPath(); uctx.arc(mx, my, base + 1, 0, Math.PI*2); uctx.stroke();
    }
  }
  uctx.restore();
  // barra de escala
  { const target = 40/scale, p = Math.pow(10, Math.floor(Math.log10(target))), n = target/p;
    const nice = (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p, len = nice*scale;
    const x1 = L.x0 + L.w - 6, x0 = x1 - len, yy = L.y0 + L.h - 6;
    uctx.strokeStyle = 'rgba(200,220,255,0.8)'; uctx.lineWidth = 0.6;
    uctx.beginPath(); uctx.moveTo(x0, yy-2); uctx.lineTo(x0, yy); uctx.lineTo(x1, yy); uctx.lineTo(x1, yy-2); uctx.stroke();
    uctx.font = '5px "DejaVu Sans Mono", monospace'; uctx.textAlign = 'center'; uctx.fillStyle = 'rgba(200,220,255,0.8)';
    uctx.fillText((nice >= 1000 ? (nice/1000) + 'k' : nice) + ' u', (x0+x1)/2, yy-3); }
  const info = selectedGalaxy || hoveredGalaxy;
  if (info) {
    const dist = currentGalaxy ? Math.hypot(info.ux - currentGalaxy.ux, info.uy - currentGalaxy.uy) : 0;
    uctx.font = '6px "DejaVu Sans Mono", monospace';
    uctx.textAlign = 'left';
    uctx.fillStyle = '#e0e8ff';
    uctx.fillText((info === currentGalaxy ? '★ ' : '') + info.name, L.x0+2, L.y0+L.h+8);
    uctx.fillStyle = PALETTE.hud;
    const line = info.type.replace('_', ' ').toUpperCase() + '  ·  ' + info.sizeClass.toUpperCase() + '  ·  ' +
      (info.age === 'jovem' ? 'JOVEM' : info.age === 'velha' ? 'VELHA' : 'INTERM.') +
      '  ·  Ø' + (info.radius*2).toFixed(0) + 'u  ·  ρ ' + (info.density*100).toFixed(0) + '%' +
      '  ·  ' + (info === currentGalaxy ? 'PRESENTE' : dist.toFixed(0) + 'u');
    uctx.fillText(line, L.x0+2, L.y0+L.h+15);
    uctx.textAlign = 'right';
    if (selectedGalaxy && selectedGalaxy !== currentGalaxy) { uctx.fillStyle = '#ffe0a0'; uctx.fillText('[ENTER/A] SALTO', L.x0+L.w-2, L.y0+L.h+8); }
    else if (selectedGalaxy === currentGalaxy) { uctx.fillStyle = PALETTE.ok; uctx.fillText('LOCAL ATUAL · APROXIME P/ ENTRAR', L.x0+L.w-2, L.y0+L.h+8); }
  }
}

function drawWaypointCompass() {
  if (!waypointKey) return;
  if (mapOpen || logOpen || orbitState || telescopeState || surfaceState) return;
  const sys = getWaypointSystem();
  if (!sys || sys === focusedSystem) return;
  const dx = sys.worldX - ship.x, dy = sys.worldY - ship.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 30) return;
  const angle = Math.atan2(dy, dx);
  const r = Math.min(BASE_W, BASE_H)*0.32;
  const px = BASE_W/2 + Math.cos(angle)*r, py = BASE_H/2 + Math.sin(angle)*r;
  uctx.save(); uctx.translate(px, py); uctx.rotate(angle);
  uctx.fillStyle = PALETTE.waypoint;
  uctx.beginPath(); uctx.moveTo(5, 0); uctx.lineTo(-3, -3.5); uctx.lineTo(-1.5, 0); uctx.lineTo(-3, 3.5); uctx.closePath(); uctx.fill();
  uctx.restore();
  uctx.font = '6px "DejaVu Sans Mono", monospace';
  uctx.textAlign = 'center';
  uctx.fillStyle = PALETTE.waypoint;
  uctx.fillText(getDisplayName(sys), px, py-7);
  uctx.fillStyle = PALETTE.hudDim;
  uctx.fillText(dist.toFixed(0) + 'u', px, py+10);
}

  uctx.fillStyle = PALETTE.hud;

  if (currentGalaxy) {
    uctx.textAlign = 'left';
    uctx.font = '5px "DejaVu Sans Mono", monospace';
    uctx.fillStyle = 'rgba(200,220,255,0.75)';
    uctx.fillText('GAL ' + currentGalaxy.name, 4, 28);
    uctx.fillStyle = 'rgba(180,200,255,0.6)';
    uctx.fillText(currentGalaxy.type.toUpperCase() + ' · ' + currentGalaxy.sizeClass.toUpperCase(), 4, 36);
  }
  uctx.textAlign = 'right';
  uctx.font = '5px "DejaVu Sans Mono", monospace';
  uctx.fillStyle = flightMode === 'newtonian' ? PALETTE.ok : PALETTE.hudDim;
  uctx.fillText('[V] ' + (flightMode === 'newtonian' ? 'NAVE' : 'TANQUE'), BASE_W-4, 46);
  if (lastNearest.sys && mode === 'flight' && !focusedSystem && !orbitState) {
    uctx.textAlign = 'left';
    uctx.fillStyle = lastNearest.dist < ENTER_RADIUS ? PALETTE.ok : PALETTE.hudDim;
    uctx.font = '6px "DejaVu Sans Mono", monospace';
    uctx.fillText('ALVO ' + getDisplayName(lastNearest.sys) + ' ' + lastNearest.dist.toFixed(0) + 'u', 4, 52);
    // Aviso discreto SÓ se o jogador está PRESO (empuxo < gravidade e v < vEsc)
    if (flightMode === 'newtonian' && lastNearest.sys && !lastNearest.sys.isRogue) {
      const near = lastNearest.sys;
      const dxT = near.worldX - ship.x, dyT = near.worldY - ship.y;
      const rT = Math.hypot(dxT, dyT);
      if (rT > 0.5 && rT < 400) {
        const mT = Math.max(0.05, near.mass || 1);
        const GMv = mT * 300000;
        const pull = GMv / (rT * rT);
        const maxThrust = 130;
        const spT = Math.hypot(ship.vx, ship.vy);
        const vEsc = Math.sqrt(2 * GMv / rT);
        if (pull > maxThrust * 1.15 && spT < vEsc * 1.05) {
          if (Math.sin(time * 0.003) > -0.15) {
            uctx.textAlign = 'left';
            uctx.font = '6px "DejaVu Sans Mono", monospace';
            uctx.fillStyle = 'rgba(255,140,26,0.75)';
            uctx.fillText('use modo tanque para sair', 4, BASE_H - 20);
          }
        }
      }
    }
  }
  if (mode === 'warp' && warp) {
    const p = (warp.t / warp.duration * 100).toFixed(0);
    uctx.textAlign = 'center';
    uctx.font = 'bold 8px "DejaVu Sans Mono", monospace';
    uctx.fillStyle = PALETTE.near[3];
    uctx.fillText('WARP → ' + getDisplayName(warp.targetSystem), BASE_W/2, 14);
    uctx.font = '6px "DejaVu Sans Mono", monospace';
    uctx.fillStyle = PALETTE.hud;
    uctx.fillText(p + '%', BASE_W/2, 24);
  } else if (focusedSystem && focusBlend > 0.3) {
    uctx.textAlign = 'center';
    uctx.fillStyle = PALETTE.hudDim;
    uctx.font = '6px "DejaVu Sans Mono", monospace';
    uctx.fillText('N BATIZA · J NOTA · M MAPA · L DIÁRIO · ESC SOLTAR', BASE_W/2, BASE_H-6);
  } else {
    uctx.textAlign = 'center';
    uctx.fillStyle = PALETTE.hudDim;
    uctx.font = '6px "DejaVu Sans Mono", monospace';
    uctx.fillText('WASD · M MAPA · G GALÁXIA · V VOO · L DIÁRIO · ESC MENU', BASE_W/2, BASE_H-4);
  }
}

function drawPlanetInfo(time) {
  const pi = planetInfo;
  uctx.fillStyle = 'rgba(0,3,10,0.96)'; uctx.fillRect(0, 0, BASE_W, BASE_H);
  const p = pi.planet, sys = pi.sys;
  if (!p || !sys) return;
  const sysName = getDisplayName(sys).split('-')[0];
  const sciName = sysName + '-' + p.letter;
  // Cabeçalho
  uctx.textAlign = 'left';
  uctx.font = 'bold 8px "DejaVu Sans Mono", monospace';
  uctx.fillStyle = PALETTE.near[3];
  uctx.fillText(sciName + ' · ' + p.epithet, 6, 11);
  uctx.font = '5px "DejaVu Sans Mono", monospace';
  uctx.fillStyle = PALETTE.hudDim;
  uctx.fillText('Classe: ' + (PLANET_CLASSES[p.planetClass] || {label:p.type}).label +
                '  ·  T.Eq ' + p.temperatureEq + ' K  ·  Hab ' + p.habitability + '%', 6, 19);
  // Abas
  const tabY = 26, tabH = 11;
  for (let i = 0; i < pi.tabs.length; i++) {
    const tx = 4 + i * 63;
    const active = (i === pi.tab);
    uctx.fillStyle = active ? 'rgba(255,180,100,0.25)' : 'rgba(255,180,100,0.06)';
    uctx.fillRect(tx, tabY, 60, tabH);
    uctx.strokeStyle = active ? PALETTE.near[3] : 'rgba(255,140,26,0.35)';
    uctx.lineWidth = active ? 0.8 : 0.4;
    uctx.strokeRect(tx+0.5, tabY+0.5, 59, tabH-1);
    uctx.textAlign = 'center';
    uctx.font = active ? 'bold 5px "DejaVu Sans Mono", monospace' : '5px "DejaVu Sans Mono", monospace';
    uctx.fillStyle = active ? PALETTE.near[3] : PALETTE.hudDim;
    uctx.fillText(pi.tabs[i], tx+30, tabY+7.5);
  }
  // Conteúdo
  const contentY = tabY + tabH + 6;
  const rows = [];
  if (pi.tab === 0) {
    // Pressão atmosférica (atm/bar/mmHg)
    const densMap = { 'Nula': 1e-6, 'Tênue': 0.01, 'Média': 1.0, 'Densa': 8.0, 'Espessa': 80.0 };
    const pressureAtm = (densMap[p.atmosphere.dens] || 0.001) * (p.size/3) * (p.temperatureEq/288);
    const pressureMMHG = pressureAtm * 760;
    let pressureStr;
    if (pressureAtm < 0.001) pressureStr = pressureAtm.toExponential(2) + ' atm';
    else if (pressureAtm < 0.1) pressureStr = pressureAtm.toFixed(4) + ' atm';
    else pressureStr = pressureAtm.toFixed(2) + ' atm';
    pressureStr += ' / ' + (pressureMMHG < 10 ? pressureMMHG.toFixed(2) : pressureMMHG.toFixed(0)) + ' mmHg';
    rows.push(['PRESSÃO', pressureStr]);
    rows.push(['COMPOSIÇÃO', p.atmosphere.name || '—']);
    rows.push(['DENSIDADE', p.atmosphere.dens || 'Nula']);
    rows.push(['EFEITO ESTUFA', (p.atmosphere.dens === 'Densa' || p.atmosphere.dens === 'Espessa') ? 'Alto' : 'Baixo']);
    rows.push(['TEMPERATURA MÉDIA', p.temperatureEq + ' K']);
    if (p.tidalLocked) {
      rows.push(['LADO DIURNO', p.temperatureDay + ' K']);
      rows.push(['LADO NOTURNO', p.temperatureNight + ' K']);
    }
    rows.push(['ALBEDO', (p.type === 'GASOSO' ? '0.45' : p.type === 'GELADO' ? '0.55' : '0.30')]);
  } else if (pi.tab === 1) {
    const cr = p.crust || {}, ma = p.mantle || {}, co = p.core || {};
    rows.push(['CROSTA (silicato)', ((cr.silicate||0)*100).toFixed(1) + '%']);
    rows.push(['CROSTA (ferro)', ((cr.iron||0)*100).toFixed(1) + '%']);
    rows.push(['CROSTA (água)', ((cr.water||0)*100).toFixed(1) + '%']);
    rows.push(['MANTO (silicato)', ((ma.silicate||0)*100).toFixed(1) + '%']);
    rows.push(['MANTO (ferro)', ((ma.iron||0)*100).toFixed(1) + '%']);
    rows.push(['NÚCLEO (ferro)', ((co.iron||0)*100).toFixed(1) + '%']);
    rows.push(['ATIV. TECTÔNICA', ((p.tectonicActivity||0)*100).toFixed(0) + '%']);
    rows.push(['PLACAS', (p.plates||[]).length + '']);
    rows.push(['VULCÕES', (p.volcanoCount||0) + '']);
    rows.push(['CRIOVULCÕES', (p.cryovolcanoCount||0) + '']);
    rows.push(['CORDILHEIRAS', (p.ridgeCount||0) + '']);
  } else if (pi.tab === 2) {
    rows.push(['DIST. ESTRELA', p.distanceAU + ' UA']);
    rows.push(['PERÍODO ORBITAL', (parseFloat(p.distanceAU) * 365).toFixed(0) + ' dias']);
    rows.push(['INCLINAÇÃO', (p.phase * 57.3).toFixed(1) + '°']);
    rows.push(['ROTAÇÃO', p.rotation.toFixed(1) + ' h']);
    rows.push(['TRAV. MARÉ', p.tidalLocked ? 'Sim' : 'Não']);
    if (p.tidalLocked) rows.push(['TERMINADOR', (p.temperatureDay + p.temperatureNight)/2 + ' K']);
    rows.push(['EXCENTRICIDADE', (0.05 + ((p.phase*100)%30)/100).toFixed(3)]);
    rows.push(['MASSA (M⊕)', (p.size / 3).toFixed(2)]);
    rows.push(['RAIO (R⊕)', (p.size / 3).toFixed(2)]);
  } else if (pi.tab === 3) {
    rows.push(['COBERTURA DE ÁGUA', ((p.waterFrac||0)*100).toFixed(1) + '%']);
    rows.push(['NÍVEL DO MAR', ((p.seaLevel||0)*100).toFixed(1) + '%']);
    rows.push(['RIOS', p.hasRivers ? 'Sim' : 'Não']);
    rows.push(['TEMPERATURA (gelo)', (p.temperatureEq - 40) + ' K']);
    rows.push(['GELEIRAS', p.snowLevel ? ((1-p.snowLevel)*100).toFixed(0) + '% cobertura' : '—']);
    rows.push(['LAGOS', (p.lakeCount || 0) + ' detectados']);
  } else if (pi.tab === 4) {
    if (p.lifeType) {
      rows.push(['ORIGEM', p.lifeOrigin || '—']);
      rows.push(['TIPO', p.lifeType]);
      rows.push(['HABITAT', p.lifeHabitat || '—']);
      rows.push(['NOTAS', p.lifeNotes || '—']);
      rows.push(['HABITABILIDADE', p.habitability + '%']);
      rows.push(['CHNOPS', p.habitability > 50 ? 'Todos presentes' : 'Parciais']);
    } else {
      rows.push(['VIDA', 'Nenhuma detectada']);
      rows.push(['HABITABILIDADE', p.habitability + '%']);
      rows.push(['CHNOPS', p.habitability > 20 ? 'Parciais' : 'Ausentes']);
    }
  }
  for (let i = 0; i < rows.length; i++) {
